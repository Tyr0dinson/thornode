    depends_on:
      thornode-fox:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      SIGNER_SEED_PHRASE: *fox-seed
      PEER: bifrost
      CHAIN_API: thornode-fox:1317
      CHAIN_RPC: thornode-fox:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode-fox:50051
    volumes:
      - "../scripts:/docker/scripts"
      - "../../dkls/go-wrappers/includes/linux/${DKLS_LIB_ARCH:-arm64}/libgodkls.so:/usr/lib/libgodkls.so:ro"
      - bifrost-fox:/var/data/bifrost
      - thornode-fox:/root/.thornode
    command: ["bifrost"]

  bifrost-goat:
    <<: *bifrost
    depends_on:
      thornode-goat:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      SIGNER_SEED_PHRASE: *goat-seed
      PEER: bifrost
