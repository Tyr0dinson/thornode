      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-wolf
      SEEDS: thornode,thornode-cat,thornode-fox,thornode-goat
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf analyst"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-wolf:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-eagle:
    image: thornode:dkls-chainnet
    restart: unless-stopped
    hostname: thornode-eagle
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-eagle
      SEEDS: thornode,thornode-cat,thornode-fox,thornode-goat
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle bitter"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-eagle:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  # ================================ Bifrosts ======================================

  bifrost: &bifrost
    image: thornode:dkls-chainnet
    restart: unless-stopped
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      SIGNER_SEED_PHRASE: *dog-seed
      CHAIN_API: thornode:1317
      CHAIN_RPC: thornode:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode:50051
    volumes:
      - "../scripts:/docker/scripts"
      - "../../dkls/go-wrappers/includes/linux/${DKLS_LIB_ARCH:-arm64}/libgodkls.so:/usr/lib/libgodkls.so:ro"
      - bifrost:/var/data/bifrost
      - thornode:/root/.thornode
    networks:
      default:
        aliases:
          - bifrost-dog
    entrypoint: /docker/scripts/bifrost.sh
    command: ["bifrost", "-p"]
    logging: *logging

  bifrost-cat:
    <<: *bifrost
    depends_on:
      thornode-cat:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      SIGNER_SEED_PHRASE: *cat-seed
      PEER: bifrost
      CHAIN_API: thornode-cat:1317
      CHAIN_RPC: thornode-cat:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode-cat:50051
    volumes:
      - "../scripts:/docker/scripts"
      - "../../dkls/go-wrappers/includes/linux/${DKLS_LIB_ARCH:-arm64}/libgodkls.so:/usr/lib/libgodkls.so:ro"
      - bifrost-cat:/var/data/bifrost
      - thornode-cat:/root/.thornode
    command: ["bifrost"]

  bifrost-fox:
