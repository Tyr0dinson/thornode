      CHAIN_RPC: thornode-goat:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode-goat:50051
    volumes:
      - "../scripts:/docker/scripts"
      - "../../dkls/go-wrappers/includes/linux/${DKLS_LIB_ARCH:-arm64}/libgodkls.so:/usr/lib/libgodkls.so:ro"
      - bifrost-goat:/var/data/bifrost
      - thornode-goat:/root/.thornode
    command: ["bifrost"]

  bifrost-whale:
