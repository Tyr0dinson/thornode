  NET: chainnet
  CHAIN_ID: thorchain
  SIGNER_NAME: thorchain
  SIGNER_PASSWD: password
  THORNODE_GRPC_ENABLE: "true"
  THOR_COSMOS_EBIFROST_ADDRESS: "0.0.0.0:50051"
  THOR_BLOCK_TIME: "6s"
  PORT_RPC: "27147"
  PORT_API: "1317"
  THOR_SEED_NODES_ENDPOINT: ""
  FAUCET: "cthor1zf3gsk7edzwl9syyefvfhle37cjtql35layy8z"
  EXTRA_FUND_ACCOUNT_1: "cthor1uuds8pd92qnnq0udw0rpg0szpgcslc9p0cdl2t" # cat
  EXTRA_FUND_ACCOUNT_2: "cthor13wrmhnh2qe98rjse30pl7u6jxszjjwl4pak8t6" # fox
  EXTRA_FUND_ACCOUNT_3: "cthor1yvyh2uq8ly0aa44aretj0w0hnqx7rsfzl9rd6z" # goat
  EXTRA_FUND_ACCOUNT_4: "cthor1rsq5yj5gv96f9aag8c42gmxyq63ee3pcsq3h6c" # whale
  EXTRA_FUND_ACCOUNT_5: "cthor1l8373d0wlhyjukqx60gxs0mck4f3utgxjaxj6l" # wolf
  EXTRA_FUND_ACCOUNT_6: "cthor1lc4rwftmqqzr0tykf623uyqwzcrrltvnsjtxy8" # eagle
