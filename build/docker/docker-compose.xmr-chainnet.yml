      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-whale
      SEEDS: thornode,thornode-cat,thornode-fox
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale away"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-whale:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-wolf:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-wolf
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-wolf
      SEEDS: thornode,thornode-cat,thornode-fox,thornode-goat
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf analyst"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-wolf:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-eagle:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-eagle
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-eagle
      SEEDS: thornode,thornode-cat,thornode-fox,thornode-goat
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle bitter"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-eagle:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  # ================================ Bifrosts ======================================

  bifrost: &bifrost
    image: thornode:xmr-chainnet
    restart: unless-stopped
    depends_on:
      thornode:
        condition: service_healthy
      monero-daemon:
        condition: service_healthy
      xmr-frost-signer:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      SIGNER_SEED_PHRASE: "dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog fossil"
      CHAIN_API: thornode:1317
      CHAIN_RPC: thornode:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode:50051
      BIFROST_CHAINS_XMR_SIGNER_ENDPOINT: "http://xmr-frost-signer:8283"
    volumes:
      - "../scripts:/docker/scripts"
      - bifrost:/var/data/bifrost
      - thornode:/root/.thornode
    networks:
