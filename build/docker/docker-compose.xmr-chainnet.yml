########################################################################################
# Private THORChain 7-node cluster (6 active + 1 standby, churning) + Monero mainnet
#
# Usage:
#   export XMR_DAEMON_URL=http://<external-full-monerod>:18081
#   # current chainnet host on 91.99.89.216: http://188.245.203.167:18081
#   docker compose -f docker-compose.xmr-chainnet.yml build --no-cache
#   docker compose -f docker-compose.xmr-chainnet.yml up -d
#   bash xmr-chainnet-post-deploy.sh
#
# Validators are dog/cat/fox/goat/whale/wolf/eagle. Dog is genesis and uses the
# unsuffixed services thornode/bifrost/xmr-frost-signer; explicit *-dog DNS
# aliases are attached below. Others join via validator.sh.
# DesiredValidatorSet=6 in constants_chainnet.go gives
# 6 active + 1 standby with ChurnInterval=80 blocks (~10 min). The post-deploy
# script sets AsgardSize=3 before first churn, so fresh bring-up goes straight
# to 2 active XMR vaults of 3 members each (2-of-3 FROST).
#
# Tear down (preserve monerod volume — NEVER docker compose down -v):
#   docker compose -f docker-compose.xmr-chainnet.yml stop <all services except monero-daemon>
#   docker compose -f docker-compose.xmr-chainnet.yml rm -f <same services>
#   docker volume rm docker_thornode docker_thornode-{cat,fox,goat,whale,wolf,eagle} \
#     docker_bifrost docker_bifrost-{cat,fox,goat,whale,wolf,eagle} \
#     docker_xmr-frost-data docker_xmr-frost-data-{cat,fox,goat,whale,wolf,eagle}
#
# Most constants are baked into constants_chainnet.go (ChurnInterval, JailTime,
# EmissionCurve, etc). Only runtime-toggled values need mimir:
#   HaltChurning=1/0         - toggled during deploy for p2p stabilization
#   P2PGateDisabled=1        - bifrost reads via GetMimir, not constants
#   NumberOfNewNodesPerChurn  - 5 for initial keygen, 1 for steady-state
#
# IMPORTANT: Post-deploy script restarts bifrosts in order (dog first, then
# others) to establish libp2p bootstrap connections. Simultaneous start via
# compose leaves bifrosts unable to discover peers for TSS keygen.
#
# Auth: bifrost <-> frost-signer uses raw SIGNER_SEED_PHRASE in the
# Authorization header.
# Both Go and Rust must be built from the same commit. Mismatched auth causes
# silent scan failure (txs=0 on every block). Always rebuild BOTH together.
########################################################################################

x-xmr-daemon-url: &xmr-daemon-url "${XMR_DAEMON_URL:?set XMR_DAEMON_URL to the external full Monero RPC URL}"

volumes:
  thornode:
  thornode-cat:
  thornode-fox:
  thornode-goat:
  thornode-whale:
  thornode-wolf:
  thornode-eagle:
  bifrost:
  bifrost-cat:
  bifrost-fox:
  bifrost-goat:
  bifrost-whale:
  bifrost-wolf:
  bifrost-eagle:
  monero-daemon:
  xmr-frost-data:
  xmr-frost-data-cat:
  xmr-frost-data-fox:
  xmr-frost-data-goat:
  xmr-frost-data-whale:
  xmr-frost-data-wolf:
  xmr-frost-data-eagle:

