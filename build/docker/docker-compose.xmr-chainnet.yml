x-bifrost-env: &bifrost-env
  NET: chainnet
  CHAIN_ID: thorchain
  SIGNER_NAME: thorchain
  SIGNER_PASSWD: password
  THOR_SEED_NODES_ENDPOINT: ""
  THOR_BLOCK_TIME: "6s"
  BLOCK_SCANNER_BACKOFF: "5s"
  BIFROST_METRICS_PPROF_ENABLED: "true"
  BIFROST_SIGNER_BACKUP_KEYSHARES: "true"
  BIFROST_SIGNER_RESCHEDULE_BUFFER_BLOCKS: "20"
  BIFROST_SIGNER_AUTO_OBSERVE: "false"
  BIFROST_SIGNER_KEYGEN_TIMEOUT: "8s"
  BIFROST_SIGNER_KEYSIGN_TIMEOUT: "55s"
  BIFROST_SIGNER_PARTY_TIMEOUT: "50s"
  <<: *disabled-chains
  BIFROST_CHAINS_XMR_DISABLED: "false"
  XMR_DAEMON_URL: *xmr-daemon-url
  BIFROST_CHAINS_XMR_CHAIN_NETWORK: "mainnet"
  BIFROST_CHAINS_XMR_DISABLE_TLS: "true"
  BIFROST_CHAINS_XMR_BLOCK_SCANNER_START_BLOCK_HEIGHT: "0"

x-frost-env: &frost-env
  XMR_FROST_LISTEN_ADDR: "0.0.0.0:8283"
  XMR_DAEMON_URL: *xmr-daemon-url
  XMR_FROST_DAEMON_DISABLE_TLS: "true"
  XMR_FROST_DATA_DIR: "/var/lib/xmr-frost"
  XMR_FROST_CHAIN_NETWORK: "mainnet"
  XMR_FROST_MAX_SIGN_SCAN_LAG_BLOCKS: "32"
  XMR_FROST_RATE_LIMIT_GLOBAL_RPS: "500"
  XMR_FROST_RATE_LIMIT_GLOBAL_BURST: "5000"
  XMR_FROST_RATE_LIMIT_PER_IP_RPS: "500"
  XMR_FROST_RATE_LIMIT_PER_IP_BURST: "5000"

x-frost-healthcheck: &frost-healthcheck
  test: ["CMD", "curl", "-sf", "http://localhost:8283/health"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "256m"
    max-file: "3"

services:

  # ================================ Monero mainnet ================================

  monero-daemon:
    image: sethsimmons/simple-monerod:v0.18.3.4
    restart: unless-stopped
    command:
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --restricted-rpc
      - --prune-blockchain
      - --sync-pruned-blocks
      - --bootstrap-daemon-address=nodes.hashvault.pro:18081
      - --log-level=0
    volumes:
      - monero-daemon:/home/monero/.bitmonero
    ports:
      - "18081:18081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Content-Type: application/json",
             "-d", '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}',
             "http://localhost:18081/json_rpc"]
      interval: 60s
      timeout: 10s
      retries: 9999
      start_period: 120s

  # ================================ FROST signers =================================

  xmr-frost-signer: &frost-signer
    build:
      context: ../../
      dockerfile: build/docker/xmr-frost-signer/Dockerfile
    image: thornode-xmr-frost-signer:latest
    restart: unless-stopped
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog fossil"
    volumes:
      - xmr-frost-data:/var/lib/xmr-frost
    networks:
      default:
        aliases:
          - xmr-frost-signer-dog
    ports:
      - "8283:8283"
    healthcheck: *frost-healthcheck
    logging: *logging

  xmr-frost-signer-cat:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat crawl"
    volumes:
      - xmr-frost-data-cat:/var/lib/xmr-frost
    ports: []

  xmr-frost-signer-fox:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox filter"
    volumes:
      - xmr-frost-data-fox:/var/lib/xmr-frost
    ports: []

  xmr-frost-signer-goat:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat answer"
    volumes:
      - xmr-frost-data-goat:/var/lib/xmr-frost
    ports: []

  xmr-frost-signer-whale:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale whale away"
    volumes:
      - xmr-frost-data-whale:/var/lib/xmr-frost
    ports: []

  xmr-frost-signer-wolf:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf wolf analyst"
    volumes:
      - xmr-frost-data-wolf:/var/lib/xmr-frost
    ports: []

  xmr-frost-signer-eagle:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle eagle bitter"
    volumes:
      - xmr-frost-data-eagle:/var/lib/xmr-frost
    ports: []

  # ================================ THORNodes =====================================

  thornode:
    build:
      context: ../../
      dockerfile: ./build/docker/Dockerfile
      args:
        TAG: chainnet
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode
    environment:
      <<: *thorchain-env
      SEED: thornode
      SIGNER_SEED_PHRASE: "dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog fossil"
    ports:
      - "27147:27147"
      - "1317:1317"
      - "50051:50051"
      - "9090:9090"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode:/root/.thornode
    networks:
      default:
        aliases:
          - thornode-dog
    entrypoint: /docker/scripts/genesis.sh
    command: ["thornode", "start"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-cat:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-cat
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-cat
      SEEDS: thornode,thornode-fox
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat crawl"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-cat:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-fox:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-fox
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-fox
      SEEDS: thornode,thornode-cat
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox filter"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-fox:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-goat:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-goat
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-goat
      SEEDS: thornode,thornode-cat,thornode-fox
      AUTO_BOND: "true"
      SIGNER_SEED_PHRASE: "goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat goat answer"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-goat:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-whale:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-whale
    depends_on:
      thornode:
        condition: service_healthy
