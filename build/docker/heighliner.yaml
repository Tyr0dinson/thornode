# Configuration file for building production-grade docker image with heighliner
- name: thorchain
  dockerfile: cosmos
  pre-build: |
    apk --no-cache add findutils protoc
  build-target: |
    make install
    mv build/scripts /scripts
  binaries:
    - /go/bin/thornode
    - /go/bin/bifrost
    - /go/bin/recover-keyshare-backup
  directories:
    - /scripts
