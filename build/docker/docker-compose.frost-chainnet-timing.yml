  bifrost-node02: {}
  bifrost-node03: {}
  bifrost-node04: {}
  bifrost-node05: {}
  bifrost-node06: {}
  bifrost-node07: {}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "512m"
    max-file: "4"

services:
  bitcoin:
    profiles:
      - local-bitcoin
    user: root
    image: registry.gitlab.com/thorchain/devops/node-launcher:bitcoin-daemon-26.2
    restart: unless-stopped
    environment:
      BLOCK_TIME: "1"
      BTC_MASTER_ADDR: "bcrt1qf4l5dlqhaujgkxxqmug4stfvmvt58vx2h44c39"
    ports:
      - "18443:18443"
      - "18444:18444"
    entrypoint: "/scripts/entrypoint-mock.sh"
    logging: *logging

  thornode:
    build:
      context: ../../
      dockerfile: ./build/docker/Dockerfile
      args:
        TAG: chainnet
    image: thornode:frost-chainnet
    restart: unless-stopped
    hostname: thornode
    environment:
      NET: "chainnet"
      CHAIN_ID: "thorchain"
      SIGNER_NAME: "thorchain"
      SIGNER_PASSWD: "password"
      THORNODE_GRPC_ENABLE: "true"
      THOR_COSMOS_EBIFROST_ADDRESS: "0.0.0.0:50051"
      THOR_BLOCK_TIME: "6s"
      SKIP_EVM_DEPLOY: "true"
      PORT_RPC: "27147"
      PORT_API: "1317"
      THOR_SEED_NODES_ENDPOINT: ""
      THOR_CHAINNET_DESIRED_VALIDATOR_SET: "6"
      THOR_CHAINNET_ASGARD_SIZE: "6"
      THOR_CHAINNET_NUMBER_OF_NEW_NODES_PER_CHURN: "5"
