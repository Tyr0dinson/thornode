swagger: '2.0'
info:
  title: Thorchain - gRPC Gateway docs
  description: A REST interface for state queries
  version: 1.0.0
paths:
  /thorchain/balance/module/{name}:
    get:
      operationId: BalanceModule
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              name:
                type: string
              address:
                type: string
                format: byte
              coins:
                type: array
                items:
                  type: object
                  properties:
                    denom:
                      type: string
                    amount:
                      type: string
                  description: >-
                    Coin defines a token with a denomination and an amount.


                    NOTE: The amount field is an Int which implements the custom
                    method

                    signatures required by gogoproto.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: name
          in: path
          required: true
          type: string
      tags:
        - Query
  /thorchain/ban/{address}:
    get:
      operationId: Ban
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              node_address:
                type: string
                format: byte
              block_height:
                type: string
                format: int64
              signers:
                type: array
                items:
                  type: string
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: address
          in: path
          required: true
          type: string
      tags:
        - Query
  /thorchain/block:
    get:
      operationId: Block
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              id:
                type: object
                properties:
                  hash:
                    type: string
                  parts:
                    type: object
                    properties:
                      total:
                        type: string
                        format: int64
                      hash:
                        type: string
              header:
                type: object
                properties:
                  version:
                    type: object
                    properties:
                      block:
                        type: string
                      app:
                        type: string
                  chain_id:
                    type: string
                  height:
                    type: string
                    format: int64
                  time:
                    type: string
                  last_block_id:
                    type: object
                    properties:
                      hash:
                        type: string
                      parts:
                        type: object
                        properties:
                          total:
                            type: string
                            format: int64
                          hash:
                            type: string
                  last_commit_hash:
                    type: string
                  data_hash:
                    type: string
                  validators_hash:
                    type: string
                  next_validators_hash:
                    type: string
                  consensus_hash:
                    type: string
                  app_hash:
                    type: string
                  last_results_hash:
                    type: string
                  evidence_hash:
                    type: string
                  proposer_address:
                    type: string
              begin_block_events:
                type: array
                items:
                  type: object
                  properties:
                    block_events:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          value:
                            type: string
              end_block_events:
                type: array
                items:
                  type: object
                  properties:
                    block_events:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          value:
                            type: string
              txs:
                type: array
                items:
                  type: object
                  properties:
                    hash:
                      type: string
                    tx:
                      type: string
                      format: byte
                    result:
                      type: object
                      properties:
                        code:
                          type: string
                          format: int64
                        data:
                          type: string
                        log:
                          type: string
                        info:
                          type: string
                        gas_wanted:
                          type: string
                        gas_used:
                          type: string
                        events:
                          type: object
                          properties:
                            block_events:
                              type: array
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  value:
                                    type: string
                        codespace:
                          type: string
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
