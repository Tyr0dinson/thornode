  - .| ${OUT_AMOUNT} > ${IN_AMOUNT} * 95/100 # Full inbound amount, minus outbound fee.
  - .[0].max_gas[0].amount == "${OUT_GAS_AMOUNT=10500}"
  - .[0].memo == "REFUND:${IN_TXID}"
