  amount: 10000000
asserts:
  - .inbound_address == "{{ addr_btc_dog }}"
  - .expected_amount_deposit|tonumber == 9924870
  - .dust_threshold|tonumber == 10000
  - .fees.liquidity|tonumber == 98880
  - .fees.outbound|tonumber == 2010
  - .fees.slippage_bps|tonumber == 98
  - .fees.total|tonumber == 100890
  - .fees.total_bps|tonumber == 100
  - (.fees.total|tonumber) == (.fees.liquidity|tonumber)+(.fees.outbound|tonumber)
---
########################################################################################
# streaming savers deposit
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_pig }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "10000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "+:BTC/BTC"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
