{{ template "default-state.yaml" }}
---
{{ template "btc-pool-state-multiple-vaults.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# swap below dust threshold
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "20000000"
    asset: "rune"
memo: "=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# should not leave anything in queues
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/scheduled
asserts:
  - .|length == 0
---
########################################################################################
# outbound with 2 outputs, 1 below dust threshold
########################################################################################
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "-:BTC.BTC:5001"
---
type: create-blocks
count: 1
---
########################################################################################
# confirmation that withdraw emit_asset greater than outbound-plus-fee
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .|[..|select(.type?=="withdraw")] | length == 1
  - .|[..|select(.type?=="scheduled_outbound")] | length == 1
  - .|[..|select(.type?=="fee" and (.coins | contains("BTC.BTC")))] | length == 1
  - ..|select(.type?=="withdraw").emit_asset == "${WITHDRAW=50010000}"
  - ..|select(.type?=="scheduled_outbound").coin_amount == "${OUTBOUND=49975500}"
  - ..|select(.type?=="fee" and (.coins | contains("BTC.BTC"))).coins == "${FEE=14000} BTC.BTC"
  - ${WITHDRAW} - ${OUTBOUND} - ${FEE} == ${VAULT_SWALLOWED=20500}
  ##
  - ${VAULT_SWALLOWED} - ${FEE} == ${DROPPED_OUTBOUND=6500}
  - ${DROPPED_OUTBOUND} < 10000 # (The dust threshold.)
  
---
########################################################################################
# all outbound items should have over dust
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/scheduled
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 1
  - .[0]|.coin.amount|tonumber == ${WITHDRAW} - ${FEE} - ${VAULT_SWALLOWED}
---
########################################################################################
# vault will have more than pool
########################################################################################
type: fail-export-invariants
