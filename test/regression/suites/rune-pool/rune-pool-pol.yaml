{{ template "default-state.yaml" }}
---
{{ template "btc-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 1
---
########################################################################################
# Enable POL and RUNEPool
########################################################################################
type: tx-mimir
key: MaxSynthPerPoolDepth
value: 5000
signer: {{ addr_thor_dog }}
sequence: 0
---
type: tx-mimir
key: POLMaxNetworkDeposit
value: 1000000000
signer: {{ addr_thor_dog }}
sequence: 1
---
type: tx-mimir
key: POLTargetSynthPerPoolDepth
value: 2500
signer: {{ addr_thor_dog }}
sequence: 2
---
type: tx-mimir
key: POLMaxPoolMovement
value: 5000 # .5%
signer: {{ addr_thor_dog }}
sequence: 3
---
type: tx-mimir
key: POLBuffer
value: 1000
signer: {{ addr_thor_dog }}
sequence: 4
---
type: tx-mimir
key: POL-BTC-BTC
value: 1
signer: {{ addr_thor_dog }}
sequence: 5
---
type: tx-mimir
key: RUNEPoolEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 6
---
# effectively disable emissions to avoid skew for math checks
type: tx-mimir
key: EmissionCurve
value: 1000000000000
signer: {{ addr_thor_dog }}
sequence: 7
---
type: create-blocks
count: 1
---
########################################################################################
# Mint Synth to Trigger POL Add
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "200000000000"
    asset: "rune"
memo: "=:BTC/BTC"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "100000000000"
    asset: "rune"
memo: "=:BTC/BTC"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == ${POL_DEPOSIT=1975087646}
  - .pol.rune_deposited|tonumber == ${POL_DEPOSIT}
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.pnl|tonumber == -2911570
  - .runepool.reserve_units|tonumber == ${POL_DEPOSIT}
---
########################################################################################
# Ensure Max Deposit is Respected
########################################################################################
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == ${POL_DEPOSIT}
  - .pol.rune_deposited|tonumber == ${POL_DEPOSIT}
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.value|tonumber == ${POL_VALUE=1972176076}
  - .pol.pnl|tonumber == ${POL_PNL=-2911570}
  - .runepool.reserve_units|tonumber == ${POL_DEPOSIT}
  - .runepool.pool_units|tonumber == 0
  - .runepool.pending_pool_units|tonumber == 0
---
########################################################################################
# RUNEPool deposit acquires POL ownership from reserve
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "${POL_VALUE}"
    asset: "rune"
memo: "pool+"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount == "${POL_VALUE}"
  - .last_deposit_height == 5
  - .units|tonumber == ${POL_DEPOSIT}
  - .value|tonumber == ${POL_VALUE}
  - .pnl|tonumber == 0 # provider entered after loss incurred
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == ${POL_DEPOSIT}
  - .pol.rune_deposited|tonumber == ${POL_DEPOSIT}
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.value|tonumber == ${POL_VALUE}
  - .pol.pnl|tonumber == ${POL_PNL}
  - .runepool.reserve_units|tonumber == 0
  - .runepool.pool_units|tonumber == ${POL_DEPOSIT}
  - .runepool.pending_pool_units|tonumber == 0
---
########################################################################################
# RUNEPool withdraw releases POL ownership to reserve
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "0"
    asset: "rune"
memo: "pool-:10000"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount == "${POL_VALUE}"
  - .withdraw_amount == "${POL_VALUE}"
  - .units|tonumber == 0
  - .last_deposit_height == 5
  - .last_withdraw_height == 6
  - .value|tonumber == 0
  - .pnl|tonumber == 0
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == ${POL_DEPOSIT}
  - .pol.rune_deposited|tonumber == ${POL_DEPOSIT}
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.value|tonumber == ${POL_VALUE}
  - .pol.pnl|tonumber == ${POL_PNL}
  - .runepool.reserve_units|tonumber == ${POL_DEPOSIT}
  - .runepool.pool_units|tonumber == 0
  - .runepool.pending_pool_units|tonumber == 0
---
########################################################################################
# Excess RUNEPool deposit remains pending
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "${POL_VALUE}"
    asset: "rune"
memo: "pool+"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "${POL_VALUE}"
    asset: "rune"
memo: "pool+"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount|tonumber == 3*${POL_VALUE}
  - .withdraw_amount|tonumber == ${POL_VALUE}
  - .last_deposit_height == 8
  - .value|tonumber == 2*${POL_VALUE}
  - .pnl|tonumber == 0
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == ${POL_DEPOSIT}
  - .pol.rune_deposited|tonumber == ${POL_DEPOSIT}
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.value|tonumber == ${POL_VALUE}
  - .pol.pnl|tonumber == ${POL_PNL}
  - .runepool.reserve_units|tonumber == 0
  - .runepool.pool_units|tonumber == ${POL_DEPOSIT}
  - .runepool.pending_pool_units|tonumber == ${POL_DEPOSIT}
---
########################################################################################
# Increasing POL deploys from RUNEPool
########################################################################################
type: tx-mimir
key: POLMaxNetworkDeposit
value: 2000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount|tonumber == 3*${POL_VALUE}
  - .withdraw_amount|tonumber == ${POL_VALUE}
  - .units|tonumber == 2*${POL_DEPOSIT}
  - .last_deposit_height == 8
  - .value|tonumber == 2*${POL_VALUE}-907291
  - .pnl|tonumber == -907291 # incurred loss from POL deposit
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == ${POL_DEPOSIT}+${POL_DEPOSIT_2=1984963084}
  - .pol.rune_deposited|tonumber == ${POL_DEPOSIT}+${POL_DEPOSIT_2}
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.value|tonumber == ${POL_VALUE}+${POL_DEPOSIT_2}-910232
  - .pol.pnl|tonumber == ${POL_PNL}-910232
  - .runepool.reserve_units|tonumber == ${RESERVE_UNITS=12805886} # reserve entered too
  - .runepool.pool_units|tonumber == 2*${POL_DEPOSIT} # fully deployed all pending
  - .runepool.pending_pool_units|tonumber == 0
---
########################################################################################
# RUNEPool withdraw releases POL ownership to reserve
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "0"
    asset: "rune"
memo: "pool-:5000"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount|tonumber == 3*${POL_VALUE}
  - .withdraw_amount|tonumber == 2*${POL_VALUE}-907290/2
  - .units|tonumber == ${POL_DEPOSIT}
  - .last_deposit_height == 8
  - .last_withdraw_height == 10
  - .value|tonumber == ${POL_VALUE}-907290/2 # half of loss realized on withdraw
  - .pnl|tonumber == -907290
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == 2*${POL_DEPOSIT}+9875438
  - .pol.rune_deposited|tonumber == 2*${POL_DEPOSIT}+9875438
  - .pol.rune_withdrawn|tonumber == 0
  - .pol.value|tonumber == ${POL_VALUE}+${POL_DEPOSIT_2}-910232
  - .pol.pnl|tonumber == ${POL_PNL}-910232
  - .runepool.reserve_units|tonumber == ${RESERVE_UNITS}+${POL_DEPOSIT}
  - .runepool.pool_units|tonumber == ${POL_DEPOSIT}
  - .runepool.pending_pool_units|tonumber == 0
---
########################################################################################
# Burn synth to trigger POL withdraw
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "49999332"
    asset: "btc/btc"
memo: "=:RUNE"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "24489285"
    asset: "btc/btc"
memo: "=:RUNE"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.current_deposit|tonumber == 2*${POL_DEPOSIT}+9875438-1081622244
  - .pol.rune_deposited|tonumber == 2*${POL_DEPOSIT}+9875438
  - .pol.rune_withdrawn|tonumber == 1081622244
  - .pol.value|tonumber == ${POL_VALUE}+${POL_DEPOSIT_2}-910232-1619315894
  - .pol.pnl|tonumber == ${POL_PNL}-910232-537693650
  - .runepool.reserve_units|tonumber == ${RESERVE_UNITS}+${POL_DEPOSIT}-1253887245
  - .runepool.pool_units|tonumber == ${POL_DEPOSIT}
  - .runepool.pending_pool_units|tonumber == 0
---
########################################################################################
# Drain reserve POL first
########################################################################################
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .runepool.reserve_units|tonumber == 0
---
########################################################################################
# Drain RUNEPool POL eventually
########################################################################################
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .runepool.reserve_units|tonumber == 0
  - .runepool.pool_units|tonumber == 0
  - .runepool.pending_pool_units|tonumber == ${POL_DEPOSIT}
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount|tonumber == 3*${POL_VALUE}
  - .withdraw_amount|tonumber == 2*${POL_VALUE}-907290/2
  - .units|tonumber == ${POL_DEPOSIT}
  - .last_deposit_height == 8
  - .last_withdraw_height == 10
  - .value|tonumber == ${POL_VALUE}-270719352
  - .pnl|tonumber == -270719352-907290/2
---
########################################################################################
# RUNEPool withdraw remaining from pending
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "0"
    asset: "rune"
memo: "pool-:10000"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.value|tonumber == 0
  - .pol.pnl|tonumber == -550554816
  - .runepool.reserve_units|tonumber == 0
  - .runepool.pool_units|tonumber == 0
  - .runepool.pending_pool_units|tonumber == 0
---
type: check
endpoint: http://localhost:1317/thorchain/rune_provider/{{ addr_thor_fox }}
asserts:
  - .rune_address == "{{ addr_thor_fox }}"
  - .deposit_amount|tonumber == 3*${POL_VALUE}
  - .withdraw_amount|tonumber == 3*${POL_VALUE}-271172997
  - .units|tonumber == 0
  - .last_deposit_height == 8
  - .last_withdraw_height == 15
  - .value|tonumber == 0
  - .pnl|tonumber == -270719352-907290/2
