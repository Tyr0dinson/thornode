########################################################################################
# Opt-in chain security — liquidity cap regression test.
#
# Setup: 5 active validators with two Asgard vaults.
#   Vault 1 (dog pubkey): dog, cat, pig → BTC + ETH
#   Vault 2 (cat pubkey): frog, goat → ETH only
#   frog & goat have supported_chains=[ETH]; dog, cat, pig support all chains.
#
# BTC has 3/5 = 0.60 support → below 2/3 → liquidity cap applies.
# Vault 1 holds 1 BTC + 10 ETH → RUNE value = 200B nRUNE.
# ChainLiquidityRunePerValidator set to 60B nRUNE → cap = 3 × 60B = 180B < 200B.
#
# Tests:
#   1. Set mimirs: ChainLiquidityRunePerValidator=60000000000, TradeAccountsEnabled=1
#   2. Verify inbound_addresses shows cap applied for BTC
#   3. Add-liquidity BTC rejected (cap exceeded)
#   4. Secured deposit BTC rejected (cap exceeded)
#   5. Trade deposit BTC rejected (cap exceeded)
#   6. Swap RUNE→BTC rejected (cap exceeded)
#   7. Existing pool untouched
#   8. Withdrawal from BTC pool succeeds
########################################################################################
type: state
genesis:
  initial_height: "0"
  app_state:
    auth:
      accounts:
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "0"
            address: {{ addr_module_transfer }}
            pub_key: ~
            sequence: "0"
          name: transfer
          permissions:
            - minter
            - burner
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "1"
            address: {{ addr_module_asgard }}
            pub_key: ~
            sequence: "0"
          name: asgard
          permissions: []
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "2"
            address: {{ addr_module_thorchain }}
            pub_key: ~
            sequence: "0"
          name: thorchain
          permissions:
            - minter
            - burner
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "3"
            address: {{ addr_module_reserve }}
            pub_key: ~
            sequence: "0"
          name: reserve
          permissions: []
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "4"
            address: {{ addr_module_fee_collector }}
            pub_key: ~
            sequence: "0"
          name: fee_collector
          permissions: []
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "5"
            address: {{ addr_module_bond }}
            pub_key: ~
            sequence: "0"
          name: bond
          permissions: []
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_dog }}
          pub_key: null
          account_number: "6"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_cat }}
          pub_key: null
          account_number: "7"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_fox }}
          pub_key: null
          account_number: "8"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_pig }}
          pub_key: null
          account_number: "9"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_frog }}
          pub_key: null
          account_number: "10"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_goat }}
          pub_key: null
          account_number: "11"
          sequence: "0"
    bank:
      balances:
        - address: {{ addr_thor_dog }}
          coins:
            - denom: rune
              amount: "5000000000000"
        - address: {{ addr_thor_cat }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_fox }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_pig }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_frog }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_goat }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_module_reserve }}
          coins:
            - amount: "35000000000000"
              denom: rune
        - address: {{ addr_module_bond }}
          coins:
            - amount: "12500000000000"
              denom: rune
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "200000000000"
              denom: rune
      params:
        default_send_enabled: false
    transfer:
      params:
        send_enabled: false
    thorchain:
      node_accounts:
        - active_block_height: "0"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_dog }}
          bond_address: {{ addr_thor_dog }}
          pub_key_set:
            secp256k1: {{ pubkey_dog }}
          signer_membership:
            - tthorpub1addwnpepqfshsq2y6ejy2ysxmq4gj8n8mzuzyulk9wh4n946jv5w2vpwdn2yuyp6sp4
          status: Active
          validator_cons_pub_key: tthorcpub1zcjduepqq75h7uy6qhesh9d3a9tuk0mzrnc46u8rye44ze6peua3zmpfh23q8z37sz
          version: {{ version }}
        - active_block_height: "0"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_cat }}
          bond_address: {{ addr_thor_cat }}
          pub_key_set:
            secp256k1: {{ pubkey_cat }}
          signer_membership:
            - tthorpub1addwnpepqfshsq2y6ejy2ysxmq4gj8n8mzuzyulk9wh4n946jv5w2vpwdn2yuyp6sp4
          status: Active
          validator_cons_pub_key: {{ cons_pubkey_cat }}
          version: {{ version }}
        - active_block_height: "0"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_pig }}
          bond_address: {{ addr_thor_pig }}
          pub_key_set:
            secp256k1: {{ pubkey_pig }}
          signer_membership:
            - tthorpub1addwnpepqfshsq2y6ejy2ysxmq4gj8n8mzuzyulk9wh4n946jv5w2vpwdn2yuyp6sp4
          status: Active
          validator_cons_pub_key: {{ cons_pubkey_pig }}
          version: {{ version }}
        - active_block_height: "0"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_frog }}
          bond_address: {{ addr_thor_frog }}
          pub_key_set:
            secp256k1: {{ pubkey_frog }}
          signer_membership:
            - {{ pubkey_cat }}
          supported_chains:
            - ETH
          status: Active
          validator_cons_pub_key: {{ cons_pubkey_frog }}
          version: {{ version }}
        - active_block_height: "0"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_goat }}
          bond_address: {{ addr_thor_goat }}
          pub_key_set:
            secp256k1: {{ pubkey_goat }}
          signer_membership:
            - {{ pubkey_cat }}
          supported_chains:
            - ETH
          status: Active
          validator_cons_pub_key: {{ cons_pubkey_goat }}
          version: {{ version }}
      liquidity_providers:
        - asset: BTC.BTC
          asset_address: {{ addr_btc_fox }}
          asset_deposit_value: "100000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_fox }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
        - asset: ETH.ETH
          asset_address: {{ addr_eth_fox }}
          asset_deposit_value: "1000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_fox }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
      pools:
        - LP_units: "100000000000"
          asset: BTC.BTC
          balance_asset: "100000000"
          balance_rune: "100000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
        - LP_units: "100000000000"
          asset: ETH.ETH
          balance_asset: "1000000000"
          balance_rune: "100000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
      network_fees:
        - chain: BTC
          transaction_fee_rate: "7"
          transaction_size: "1000"
        - chain: ETH
          transaction_fee_rate: "80"
          transaction_size: "80000"
      vaults:
        - block_height: "0"
          chains:
            - THOR
            - BTC
            - ETH
          coins:
            - amount: "100000000"
              asset: BTC.BTC
              decimals: "8"
            - amount: "1000000000"
              asset: ETH.ETH
              decimals: "8"
          inbound_tx_count: "2"
          membership:
            - {{ pubkey_dog }}
            - {{ pubkey_cat }}
            - {{ pubkey_pig }}
          pub_key: tthorpub1addwnpepqfshsq2y6ejy2ysxmq4gj8n8mzuzyulk9wh4n946jv5w2vpwdn2yuyp6sp4
          status: ActiveVault
          type: AsgardVault
        - block_height: "0"
          chains:
            - THOR
            - ETH
          coins:
            - amount: "0"
              asset: ETH.ETH
              decimals: "8"
          membership:
            - {{ pubkey_frog }}
            - {{ pubkey_goat }}
          pub_key: {{ pubkey_cat }}
          status: ActiveVault
          type: AsgardVault
---
type: create-blocks
count: 1
---
########################################################################################
# Set mimirs: ChainLiquidityRunePerValidator=60000000000, TradeAccountsEnabled=1.
# Need 3/5 validators for node mimir consensus.
########################################################################################
type: tx-mimir
signer: {{ addr_thor_dog }}
key: ChainLiquidityRunePerValidator
value: 60000000000
---
type: tx-mimir
signer: {{ addr_thor_cat }}
key: ChainLiquidityRunePerValidator
value: 60000000000
---
type: tx-mimir
signer: {{ addr_thor_pig }}
key: ChainLiquidityRunePerValidator
value: 60000000000
---
type: create-blocks
count: 1
---
type: tx-mimir
signer: {{ addr_thor_dog }}
key: TradeAccountsEnabled
value: 1
---
type: tx-mimir
signer: {{ addr_thor_cat }}
key: TradeAccountsEnabled
value: 1
---
type: tx-mimir
signer: {{ addr_thor_pig }}
key: TradeAccountsEnabled
value: 1
---
type: create-blocks
count: 1
---
########################################################################################
# Verify mimir values took effect and cap is applied on BTC.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .CHAINLIQUIDITYRUNEPERVALIDATOR == 60000000000
  - .TRADEACCOUNTSENABLED == 1
---
type: check
endpoint: http://localhost:1317/thorchain/inbound_addresses
asserts:
  - '[.[] | select(.chain == "BTC")] | length == 1'
  - '[.[] | select(.chain == "BTC")][0].liquidity_cap_applied == true'
  - '[.[] | select(.chain == "BTC")][0].supporting_validators == 3'
---
########################################################################################
# Record pool state before rejection tests.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .LP_units == "100000000000"
  - .volume_rune == "0"
  - .volume_asset == "0"
---
########################################################################################
# Test 1: Add-liquidity BTC rejected (cap exceeded).
# Observe inbound BTC with +: memo from all 3 vault members.
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "5000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "+:BTC.BTC"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: tx-observed-in
signer: {{ addr_thor_cat }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "5000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "+:BTC.BTC"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: tx-observed-in
signer: {{ addr_thor_pig }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "5000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "+:BTC.BTC"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
skip_invariants: true
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .|[..|select(.type? == "refund")][0].reason | contains("liquidity cap exceeded")
---
