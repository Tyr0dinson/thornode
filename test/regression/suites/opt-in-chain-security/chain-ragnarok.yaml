########################################################################################
# Opt-in chain security chain-ragnarok regression test.
#
# Setup: 6 active validators.
#   Vault 1 (dog pubkey): dog, cat → BTC + ETH (bond=2.4T each)
#   Vault 2 (cat pubkey): pig, frog, goat, hawk → ETH only (bond=2.5T each)
#   dog & cat support all chains; pig, frog, goat, hawk support ETH only.
#   dog & cat have lower bonds so both churn marks (old + low bond) land on them,
#   preserving the ETH-only partition at 4 nodes.
#
# Tests:
#   1. Set ChurnInterval=10 via mimir
#   2. Churn at block 10 → BTC partition has 2 nodes (< MinNodeChainSupport=4)
#      → auto-ragnarok BTC chain
#   3. MsgLeave for dog rejected (node in vault for ragnaroking chain)
#   4. Set RAGNAROK-BTC-BTC mimir → pool drain completes at next FundMigrationInterval
#   5. MsgLeave for dog succeeds after ragnarok completes
########################################################################################
type: state
genesis:
  initial_height: "0"
  app_state:
    auth:
      accounts:
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "0"
            address: {{ addr_module_transfer }}
            pub_key: ~
            sequence: "0"
          name: transfer
          permissions:
            - minter
            - burner
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "1"
            address: {{ addr_module_asgard }}
            pub_key: ~
            sequence: "0"
          name: asgard
          permissions: []
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "2"
            address: {{ addr_module_thorchain }}
            pub_key: ~
            sequence: "0"
          name: thorchain
          permissions:
            - minter
            - burner
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "3"
            address: {{ addr_module_reserve }}
            pub_key: ~
            sequence: "0"
          name: reserve
          permissions: []
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "4"
            address: {{ addr_module_fee_collector }}
            pub_key: ~
            sequence: "0"
          name: fee_collector
          permissions: []
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "5"
            address: {{ addr_module_bond }}
            pub_key: ~
            sequence: "0"
          name: bond
          permissions: []
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_dog }}
          pub_key: null
          account_number: "6"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_cat }}
          pub_key: null
          account_number: "7"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_fox }}
          pub_key: null
          account_number: "8"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_pig }}
          pub_key: null
          account_number: "9"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_frog }}
          pub_key: null
          account_number: "10"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_goat }}
          pub_key: null
          account_number: "11"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_hawk }}
          pub_key: null
          account_number: "12"
          sequence: "0"
    bank:
      balances:
        - address: {{ addr_thor_dog }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_cat }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_fox }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_pig }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_frog }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_goat }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_thor_hawk }}
          coins:
            - denom: rune
              amount: "2500000000000"
        - address: {{ addr_module_reserve }}
          coins:
            - amount: "35000000000000"
              denom: rune
        - address: {{ addr_module_bond }}
          coins:
            - amount: "14800000000000"
              denom: rune
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "200000000000"
              denom: rune
      params:
        default_send_enabled: false
    transfer:
      params:
        send_enabled: false
    thorchain:
      node_accounts:
        - active_block_height: "0"
          bond: "2400000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_dog }}
          bond_address: {{ addr_thor_dog }}
          pub_key_set:
            secp256k1: {{ pubkey_dog }}
          signer_membership:
            - {{ pubkey_dog }}
          status: Active
          status_since: "0"
          validator_cons_pub_key: tthorcpub1zcjduepqq75h7uy6qhesh9d3a9tuk0mzrnc46u8rye44ze6peua3zmpfh23q8z37sz
          version: {{ version }}
        - active_block_height: "0"
          bond: "2400000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_cat }}
          bond_address: {{ addr_thor_cat }}
          pub_key_set:
            secp256k1: {{ pubkey_cat }}
          signer_membership:
            - {{ pubkey_dog }}
          status: Active
          status_since: "0"
          validator_cons_pub_key: {{ cons_pubkey_cat }}
          version: {{ version }}
        - active_block_height: "1"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_pig }}
          bond_address: {{ addr_thor_pig }}
          pub_key_set:
            secp256k1: {{ pubkey_pig }}
          signer_membership:
            - {{ pubkey_cat }}
          supported_chains:
            - ETH
          status: Active
          status_since: "1"
          validator_cons_pub_key: {{ cons_pubkey_pig }}
          version: {{ version }}
        - active_block_height: "1"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_frog }}
          bond_address: {{ addr_thor_frog }}
          pub_key_set:
            secp256k1: {{ pubkey_frog }}
          signer_membership:
            - {{ pubkey_cat }}
          supported_chains:
            - ETH
          status: Active
          status_since: "1"
          validator_cons_pub_key: {{ cons_pubkey_frog }}
          version: {{ version }}
        - active_block_height: "1"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_goat }}
          bond_address: {{ addr_thor_goat }}
          pub_key_set:
            secp256k1: {{ pubkey_goat }}
          signer_membership:
            - {{ pubkey_cat }}
          supported_chains:
            - ETH
          status: Active
          status_since: "1"
          validator_cons_pub_key: {{ cons_pubkey_goat }}
          version: {{ version }}
        - active_block_height: "1"
          bond: "2500000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_hawk }}
          bond_address: {{ addr_thor_hawk }}
          pub_key_set:
            secp256k1: {{ pubkey_hawk }}
          signer_membership:
            - {{ pubkey_cat }}
          supported_chains:
            - ETH
          status: Active
          status_since: "1"
          validator_cons_pub_key: {{ cons_pubkey_hawk }}
          version: {{ version }}
      liquidity_providers:
        - asset: BTC.BTC
          asset_address: {{ addr_btc_fox }}
          asset_deposit_value: "100000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_fox }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
        - asset: ETH.ETH
          asset_address: {{ addr_eth_fox }}
          asset_deposit_value: "1000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_fox }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
      pools:
        - LP_units: "100000000000"
          asset: BTC.BTC
          balance_asset: "100000000"
          balance_rune: "100000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
        - LP_units: "100000000000"
          asset: ETH.ETH
          balance_asset: "1000000000"
          balance_rune: "100000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
      network_fees:
        - chain: BTC
          transaction_fee_rate: "7"
          transaction_size: "1000"
        - chain: ETH
          transaction_fee_rate: "80"
          transaction_size: "80000"
      vaults:
        - block_height: "0"
          chains:
            - THOR
            - BTC
            - ETH
          coins:
            - amount: "100000000"
              asset: BTC.BTC
              decimals: "8"
            - amount: "1000000000"
              asset: ETH.ETH
              decimals: "8"
          inbound_tx_count: "2"
          membership:
            - {{ pubkey_dog }}
            - {{ pubkey_cat }}
          pub_key: {{ pubkey_dog }}
          status: ActiveVault
          type: AsgardVault
        - block_height: "0"
          chains:
            - THOR
            - ETH
          coins:
            - amount: "0"
              asset: ETH.ETH
              decimals: "8"
          membership:
            - {{ pubkey_pig }}
            - {{ pubkey_frog }}
            - {{ pubkey_goat }}
            - {{ pubkey_hawk }}
          pub_key: {{ pubkey_cat }}
          status: ActiveVault
          type: AsgardVault
---
type: create-blocks
count: 1
---
########################################################################################
# Set ChurnInterval=10 and MinNodeChainSupport=4 via mimir (operational mimirs,
# need supermajority: 4 of 6 active).
########################################################################################
type: tx-mimir
key: "ChurnInterval"
value: 10
signer: {{ addr_thor_dog }}
---
type: tx-mimir
key: "ChurnInterval"
value: 10
signer: {{ addr_thor_cat }}
---
type: tx-mimir
key: "ChurnInterval"
value: 10
signer: {{ addr_thor_pig }}
---
type: tx-mimir
key: "ChurnInterval"
value: 10
signer: {{ addr_thor_frog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: "MinNodeChainSupport"
value: 4
signer: {{ addr_thor_dog }}
---
type: tx-mimir
key: "MinNodeChainSupport"
value: 4
signer: {{ addr_thor_cat }}
---
type: tx-mimir
key: "MinNodeChainSupport"
value: 4
signer: {{ addr_thor_pig }}
---
type: tx-mimir
key: "MinNodeChainSupport"
value: 4
signer: {{ addr_thor_frog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Verify initial state: dog supports all chains, hawk supports ETH only.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .supports_all_chains == true
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_hawk }}
asserts:
  - .supports_all_chains == false
  - .supported_chains | length == 1
  - .supported_chains[0] == "ETH"
---
########################################################################################
# Verify operational mimirs were applied: ChurnInterval=10, MinNodeChainSupport=4.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .CHURNINTERVAL == 10
  - .MINNODECHAINSUPPORT == 4
---
########################################################################################
# Advance to block 10: churn triggers (lastChurnHeight=0 + ChurnInterval=10 = 10).
# BTC partition: dog, cat = 2 < MinNodeChainSupport(4) → auto-ragnarok BTC.
# ETH partition: 4 nodes >= 4 → viable, ETH survives.
########################################################################################
type: create-blocks
count: 8
skip_invariants: true
---
########################################################################################
# Verify BTC auto-ragnarok: pool staged, chain halted.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .status == "Staged"
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .HALTBTCCHAIN != null
  - .HALTBTCCHAIN > 0
---
########################################################################################
# Verify ETH pool unaffected.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .status == "Available"
---
########################################################################################
# MsgLeave for dog: should FAIL (dog is in vault 1 which has BTC, a ragnaroking chain).
########################################################################################
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - amount: "0"
    asset: "rune"
memo: "LEAVE:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
skip_invariants: true
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .txs[] | select(.result.code != 0) | .result.log | contains("ragnaroking chain")
---
########################################################################################
# Verify dog did NOT request to leave.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .requested_to_leave == false
---
########################################################################################
# Set RAGNAROK-BTC-BTC mimir to trigger pool drain via checkPoolRagnarok.
# (autoRagnarokUncoveredChains sets PoolRagnarokStart but not the RAGNAROK mimir,
#  so checkPoolRagnarok needs the mimir to process the drain.)
########################################################################################
type: tx-mimir
key: "RAGNAROK-BTC-BTC"
value: 1
signer: {{ addr_thor_dog }}
---
type: tx-mimir
key: "RAGNAROK-BTC-BTC"
value: 1
signer: {{ addr_thor_cat }}
---
type: tx-mimir
key: "RAGNAROK-BTC-BTC"
value: 1
signer: {{ addr_thor_pig }}
---
type: tx-mimir
key: "RAGNAROK-BTC-BTC"
value: 1
signer: {{ addr_thor_frog }}
---
type: create-blocks
count: 1
skip_invariants: true
---
########################################################################################
# Advance to block 15 (next FundMigrationInterval=15 multiple).
# checkPoolRagnarok runs, drains BTC.BTC pool, suspends it, deletes PoolRagnarokStart.
########################################################################################
type: create-blocks
count: 3
skip_invariants: true
---
########################################################################################
# Verify BTC pool ragnarok complete: pool suspended.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .status == "Suspended"
---
########################################################################################
# MsgLeave for dog: should SUCCEED now (PoolRagnarokStart deleted after drain).
########################################################################################
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - amount: "0"
    asset: "rune"
memo: "LEAVE:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
skip_invariants: true
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .txs[] | select(.result.code == 0)
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .requested_to_leave == true
---
########################################################################################
# Verify ETH pool still unaffected throughout.
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .status == "Available"
---
type: fail-export-invariants
