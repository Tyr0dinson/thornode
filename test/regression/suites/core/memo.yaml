{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# successful swap passes data through on outbound memo
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "5000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10500"
          asset: "BTC.BTC"
      memo: "=:ETH.ETH:{{ addr_eth_fox }}|hello world"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 1
  - .[0]|.in_hash == "{{ observe_txid 1 }}"
  - .[0]|.memo == "OUT:{{ observe_txid 1 }}|hello world"
  - .[0]|.coin.amount == "${OUT_AMOUNT=40861780}"
---
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: ETH
      from_address: {{ addr_eth_dog }}
      to_address: {{ addr_eth_fox }}
      coins:
        - amount: "${OUT_AMOUNT}"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "960000"
          asset: "ETH.ETH"
      memo: "OUT:{{ observe_txid 1 }}|hello world"
    block_height: 2
    finalise_height: 2
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
########################################################################################
# refund also passes data through on outbound memo
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 3 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "5000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10500"
          asset: "BTC.BTC"
      memo: "=:ETH.BAR:{{ addr_eth_fox }}|hello world"
    block_height: 3
    finalise_height: 3
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 1
  - .[0]|.in_hash == "{{ observe_txid 3 }}"
  - .[0]|.memo == "REFUND:{{ observe_txid 3 }}|hello wo"
  - .[0]|.memo|length == 80 # memo is truncated to chain-specific max
  - .[0]|.coin.amount == "${OUT_AMOUNT=4993000}"
---
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 4 }}"
      chain: BTC
      from_address: {{ addr_btc_dog }}
      to_address: {{ addr_btc_fox }}
      coins:
        - amount: "${OUT_AMOUNT}"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10500"
          asset: "BTC.BTC"
      memo: "REFUND:{{ observe_txid 3 }}|hello wo" # observation with truncated memo
    block_height: 4
    finalise_height: 4
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
########################################################################################
# test creating a memoless txn
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "0"
    asset: "rune"
memo: "reference:ETH:10464C8CDFF11B4AF1057FD48DC23C183E9864AA266C4B2E8B69032B6756A48C:=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/memo/ETH/10001
asserts:
  - .chain == "ETH"
  - .memo == "=:BTC.BTC:{{ addr_btc_fox }}"
  - .reference == "10001"
  - .height == "6"
  - .reference_hash == "10464C8CDFF11B4AF1057FD48DC23C183E9864AA266C4B2E8B69032B6756A48C"
  - .registration_hash == "{{ native_txid -1 }}"
  - .registered_by == "{{ addr_thor_fox }}"
---
type: check
endpoint: http://localhost:1317/thorchain/memohash/10464C8CDFF11B4AF1057FD48DC23C183E9864AA266C4B2E8B69032B6756A48C
asserts:
  - .chain == "ETH"
  - .memo == "=:BTC.BTC:{{ addr_btc_fox }}"
  - .reference == "10001"
  - .height == "6"
  - .reference_hash == "10464C8CDFF11B4AF1057FD48DC23C183E9864AA266C4B2E8B69032B6756A48C"
  - .registration_hash == "{{ native_txid -1 }}"
  - .registered_by == "{{ addr_thor_fox }}"
---
########################################################################################
# test that memo is utilized by direct reference
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
