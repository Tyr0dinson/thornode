########################################################################################
# test lookup by hash of the registration tx
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/memo/{{ native_txid -5 }}
asserts:
  - .asset == "ETH.ETH"
  - .memo == "=:BTC.BTC:{{ addr_btc_fox }}"
  - .reference == "10001"
  - .height == "7"
  - .registration_hash == "{{ native_txid -5 }}"
  - .registered_by == "{{ addr_thor_fox }}"
---
########################################################################################
# test registering a reference memo for a different asset creates a new entry
########################################################################################
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "reference:BTC.BTC:=:ETH.ETH:{{ addr_eth_cat }}"
---
type: create-blocks
count: 1
---
# since reference hash functionality was removed, we just verify a new memo was created
# with the next available reference number
type: check
endpoint: http://localhost:1317/thorchain/memo/BTC.BTC/10001
asserts:
  - .asset == "BTC.BTC"
  - .memo == "=:ETH.ETH:{{ addr_eth_cat }}"
  - .reference == "10001"
  - .registration_hash == "{{ native_txid -1 }}"
  - .registered_by == "{{ addr_thor_cat }}"
