{{ template "default-state.yaml" }}
---
{{ template "btc-eth-usdc-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
description: eth, btc, and usdc pools should exist
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 3
---
type: check
description: supply should be 503M
endpoint: http://localhost:1317/cosmos/bank/v1beta1/supply
asserts:
  - .supply[]|select(.denom == "rune")|.amount|tonumber == 503000e8
---
#######################################################################################
# enable lending
#######################################################################################
---
type: tx-mimir
signer: {{ addr_thor_dog }}
key: TorAnchor-ETH-USDC-0X9999999999999999999999999999999999999999
value: 1
---
type: create-blocks
count: 1
---
type: check
description: tor anchor mimir should be set
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - ."TORANCHOR-ETH-USDC-0X9999999999999999999999999999999999999999" == 1
---
type: check
description: derived pools should not be created
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 3
---
type: tx-mimir
signer: {{ addr_thor_dog }}
key: DerivedDepthBasisPts
value: 10000
---
type: create-blocks
count: 1
---
type: check
description: derived depth basis points mimir should be set
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .DERIVEDDEPTHBASISPTS == 10000
---
type: check
description: derived pools should not be created
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 3
---
type: create-blocks
count: 1
---
type: check
description: derived pools should be created (eth and btc only)
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 5
---
########################################################################################
# open loan btc -> rune
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "500000" # 0.5% of pool
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "LOAN+:THOR.RUNE:{{ addr_thor_fox }}:1"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
description: borrower should be recorded
endpoint: http://localhost:1317/thorchain/pool/btc.btc/borrowers
asserts:
  - .|length == 1
  - .[0]|.collateral_up == "495049"
  - .[0]|.debt_up == "490140000"
  - .[0]|.collateral_down == "0"
  - .[0]|.debt_down == "0"
  - .[0]|.owner == "{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Rune price falls relative to asset
# add swap rune to btc 
########################################################################################
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "50000000000"
    asset: "rune"
memo: "=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "50000000000"
    asset: "rune"
memo: "=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "50000000000"
    asset: "rune"
memo: "=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "50000000000"
    asset: "rune"
memo: "=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "50000000000"
    asset: "rune"
memo: "=:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Close Loan with RUNE
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "1000000000"
    asset: "rune"
memo: "LOAN-:BTC.BTC:{{ addr_btc_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Check Rune Supply
########################################################################################
type: check
description: supply should more than 500M
endpoint: http://localhost:1317/cosmos/bank/v1beta1/supply
asserts:
  - "false"
  # - .supply[]|select(.denom == "rune")|.amount|tonumber > 500000e8
