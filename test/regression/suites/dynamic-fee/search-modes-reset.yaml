  - .pairs[0].dynamic_bps|tonumber == 8
  - '[.pairs[0].probes[].bps|tonumber] == [1]'
---
########################################################################################
# The global floor applies on a pair the thorname has never traded: GUSD's own
# slip for 100 RUNE is ~6.6 bps, so the 8 bps floor sets the fee, and it accrues
# into the same "*|*" record. That record is measured on the pairs it traded
# this epoch, GUSD only, where fox is the whole flow: the epoch is recorded but
# is not a measurement, so the search stays on the ceiling.
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.GUSD-0X056FD409E1D7A124BD7017459DFEA2F387B6D5CD:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
