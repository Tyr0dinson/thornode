########################################################################################
# ADR-026 dynamic L1 minimum fee, end to end:
#
#   1. per-pair mode (whitelist 1): the bracket search tests the floor, the
#      ceiling, then halves towards the best value, converges and hands off to
#      the +/-step controller, which can step down from the ceiling;
#   2. the signal divides the affiliate's fees by other swappers' volume;
#   3. only the largest affiliate in a memo counts: listing a larger
#      non-enrolled affiliate charges and credits nothing;
#   4. a span below the liquidity gate rolls, and is sealed anyway once it has
#      run L1DynamicFeeMaxEpochBlocks;
#   5. switching to global mode (2) wipes the thorname's state at once, then
#      keeps one "*|*" record, measured on the pairs it traded, whose floor
#      applies on every L1 pair;
#   6. global monitor (4) wipes state again and only collects history;
#   7. removal (0) wipes everything.
#
# Every epoch has an affiliate swap (fox, via "dyn") and a plain swap of the
# same size (cat) on the USDC pool, so other swappers are half the pool's flow.
# The pool is ~5.2M RUNE deep, so a 100 RUNE swap slips ~0.2 bps and the 1-8 bps
# dynamic floor sets the affiliate's fee. Swap sizes are fixed, so revenue rises
# with the fee and the search converges on the ceiling: tests 1, 8, 4, 6, 7 -> 8.
#
# Epochs are 5 blocks and every swap pair is followed by exactly 5 blocks, so
# each pair lands in its own epoch and is sealed by exactly one boundary, which
# never falls on the swaps' own block.
########################################################################################
{{ template "default-state.yaml" }}
---
{{ template "eth-usdc-gusd-mainnet-state.yaml" }}
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "1000000001"
    asset: "rune"
memo: "~:dyn:THOR:{{ addr_thor_cat }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/dyn
asserts:
  - .owner == "{{ addr_thor_cat }}"
---
# Each mimir is signed by dog; a block between them keeps their account
# sequences from colliding. L1DynamicFeeProbeEpochs (1) and
# L1DynamicFeeMinOtherFlowBPS (10%) stay at their defaults.
type: tx-mimir
key: L1DynamicFeeEnabled
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: L1DynamicFeeEpochBlocks
value: 5
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: L1DynamicFeeCeilingBPS
value: 8
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Light liquidity gate: one swap and $50 of affiliate volume.
type: tx-mimir
key: L1DynamicFeeMinSwaps
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: L1DynamicFeeMinVolumeUSD
value: 50
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# A span below the gate is sealed anyway after 15 blocks (three epochs).
type: tx-mimir
key: L1DynamicFeeMaxEpochBlocks
value: 15
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Pin RUNE at $1 so volume and fees convert to TOR without anchor pools.
type: tx-mimir
key: DollarsPerRune
value: 100000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: DYNAMICFEE-WHITELIST-DYN
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .whitelist_state|tonumber == 1
  - .pairs|length == 0
---
# Align so every swap lands one block after an epoch boundary (height 11, 16,
# ...): a swap on a boundary block would seal in the block it executes.
type: create-blocks
count: 1
---
########################################################################################
# Search epoch 1: the cold record charges the floor (1 bps), then jumps to the
# ceiling.
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees_current
asserts:
  - .entries|length == 1
  - .entries[0].pair == "ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48|THOR.RUNE"
  - .entries[0].swap_count|tonumber == 1
  - .entries[0].volume_tor == "10000000000"
  # Both swaps' volume is pool volume; the affiliate's half is its own.
  - .entries[0].pool_volume_tor == "20000000000"
  - .entries[0].own_pool_volume_tor == "10000000000"
  - .entries[0].fees_tor|tonumber > 0
---
type: create-blocks
count: 4
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs|length == 1
  - .pairs[0].phase == "search"
  - .pairs[0].dynamic_bps|tonumber == 8
  - '[.pairs[0].probes[].bps|tonumber] == [1]'
  - .pairs[0].history|length == 1
  - .pairs[0].history[0].own_pool_volume_tor == "10000000000"
  # The first span runs from the record's creation at its first swap to the
  # boundary; later spans run seal to seal, one 5-block epoch each.
  - .pairs[0].history[0].blocks|tonumber == 3
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees
asserts:
  - .entries|length == 1
  - .entries[0].phase == "search"
  - .entries[0].whitelist_state|tonumber == 1
---
########################################################################################
# Search epochs 2-4: 8 beats the floor, then 4 and 6 lose to it, halving the
# gap below 8.
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs[0].dynamic_bps|tonumber == 4
  - '[.pairs[0].probes[].bps|tonumber] == [1, 8]'
  - (.pairs[0].probes[1].signal|tonumber) > (.pairs[0].probes[0].signal|tonumber)
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs[0].dynamic_bps|tonumber == 6
  - '[.pairs[0].probes[].bps|tonumber] == [1, 8, 4]'
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs[0].dynamic_bps|tonumber == 7
  - '[.pairs[0].probes[].bps|tonumber] == [1, 8, 4, 6]'
---
########################################################################################
# Search epoch 5: 7 is the last untested value beside 8. 8 still wins, so the
# search converges there: history is cleared for the +/-step controller and the
# probes stay visible.
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs[0].phase == "track"
  - .pairs[0].dynamic_bps|tonumber == 8
  - .pairs[0].history|length == 0
  - '[.pairs[0].probes[].bps|tonumber] == [1, 8, 4, 6, 7]'
---
########################################################################################
# Tracking: the +/-step controller starts with a cold-start probe. At the
# ceiling it cannot probe up, so it probes down to 7 rather than sitting at 8.
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn:10"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs[0].phase == "track"
  - .pairs[0].dynamic_bps|tonumber == 7
  - .pairs[0].history|length == 1
  - .pairs[0].history[0].bps_at_close|tonumber == 8
  - .pairs[0].history[0].blocks|tonumber == 5
  # The swap was charged the 8 bps floor: ~8x the 1 bps epoch.
  - .pairs[0].history[0].fees_tor|tonumber > 7900000
  - .pairs[0].history[0].fees_tor|tonumber < 8100000
---
########################################################################################
# Only the largest affiliate counts. Listing cat's plain address at a larger
# bps than dyn means the swap pays the static minimum and nothing is credited
# to dyn, even though dyn is enrolled.
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}::dyn/{{ addr_thor_cat }}:10/20"
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:ETH.USDC-0XA0B86991C6218B36C1D19D4A2E9EB0CE3606EB48:{{ addr_eth_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees_current
asserts:
  - .entries|length == 0
---
type: create-blocks
count: 4
---
type: check
