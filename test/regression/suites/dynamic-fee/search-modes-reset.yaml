  - .pairs[0].history[1].pool_volume_tor == .pairs[0].history[1].own_pool_volume_tor
  - .pairs[0].dynamic_bps|tonumber == 8
  # No probe for 8 yet: the GUSD epoch had no outside flow to measure against.
  - '[.pairs[0].probes[].bps|tonumber] == [1]'
---
