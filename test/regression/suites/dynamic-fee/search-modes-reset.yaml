  - .entries[0].span_blocks|tonumber == 11
---
# No more affiliate swaps. At the next boundary the span has run 15 blocks,
# the cap, so it is sealed with what it has, gate or not.
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .pairs[0].history|length == 2
  - .pairs[0].history[1].blocks|tonumber == 15
  - .pairs[0].history[1].swap_count|tonumber == 1
  - .pairs[0].history[1].volume_tor == "1000000000"
  # Revenue fell after the step down; the controller's second cold-start probe
  # goes back up.
  - .pairs[0].dynamic_bps|tonumber == 8
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees_current
asserts:
  - .entries|length == 0
---
########################################################################################
# Switch to global mode. The change of whitelist value wipes the thorname's
