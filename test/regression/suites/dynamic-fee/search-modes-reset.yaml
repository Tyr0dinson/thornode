########################################################################################
type: tx-mimir
key: DYNAMICFEE-WHITELIST-DYN
value: 2
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/dynamic_l1_fees/dyn
asserts:
  - .whitelist_state|tonumber == 2
  - .pairs|length == 0
---
# Global mode accrues into one "*|*" accumulator, measured on the pairs it
