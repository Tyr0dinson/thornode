# TCY claiming swap: every distribution cycle (BLOCKS_PER_YEAR=1825 -> every 5
# blocks) the claiming module's RUNE is swapped to TCY with a streaming swap,
# and the TCY must land back in the claiming module.
type: env
key: BLOCKS_PER_YEAR
value: "1825"
---
{{ template "default-state.yaml" }}
---
type: state
genesis:
  initial_height: "0"
  app_state:
    bank:
      balances:
        - address: {{ addr_module_tcy_claim }}
          coins:
            - amount: "${INIT_CLAIMING_RUNE=2500000000000}"
              denom: rune
        - address: {{ addr_thor_dog }}
          coins:
            - amount: "${INIT_DOG_TCY=400000000000000}"
              denom: tcy
            - amount: "${INIT_DOG_RUNE=25000004000000}"
              denom: rune
        - address: {{ addr_thor_fish }}
          coins:
            - amount: "${INIT_FISH_RUNE=10800000000}"
              denom: rune
            - amount: "${INIT_FISH_TCY=1000000000}"
              denom: tcy
    auth:
      accounts:
        - "@type": /cosmos.auth.v1beta1.ModuleAccount
          base_account:
            account_number: "0"
            address: {{ addr_module_tcy_claim }}
            pub_key: ~
            sequence: "0"
          name: tcy_claim
          permissions: []
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_dog }}
          pub_key: null
          account_number: "1"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_fish }}
          pub_key: null
          account_number: "2"
          sequence: "0"
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 1
  - .balances[]|select(.denom == "rune")|.amount|tonumber == ${INIT_CLAIMING_RUNE}
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_dog }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "rune")|.amount|tonumber == ${INIT_DOG_RUNE}
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == ${INIT_DOG_TCY}
---
# Create TCY/RUNE pool
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - amount: "${INIT_DOG_TCY}"
    asset: "tcy"
memo: "ADD:THOR.TCY:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - amount: "${INIT_DOG_RUNE_MINUS_FEES=25000000000000}"
    asset: "rune"
memo: "ADD:THOR.TCY:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_dog }}
asserts:
  - .balances|length == 0
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 1
  - .balances[]|select(.denom == "rune")|.amount|tonumber == ${INIT_CLAIMING_RUNE}
---
type: check
endpoint: http://localhost:1317/thorchain/pool/THOR.TCY
asserts:
  - .status == "Available"
  - .balance_asset == "${INIT_DOG_TCY}"
  - .balance_rune == "${INIT_DOG_RUNE_MINUS_FEES}"
  - .pool_units == "25000000000000"
  - .LP_units == "25000000000000"
---
# Configure claiming swap parameters via mimir (one tx-mimir per signer per
# block); unhalt last so the first claiming swap uses these stream parameters
type: tx-mimir
key: TCYClaimingSwapQuantity
value: 2
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: TCYClaimingSwapInterval
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: TCYClaimingSwapHalt
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .TCYCLAIMINGSWAPHALT == 0
  - .TCYCLAIMINGSWAPQUANTITY == 2
  - .TCYCLAIMINGSWAPINTERVAL == 1
---
type: create-blocks
count: 3
---
# The distribution at height 10 moves the claiming RUNE to Asgard and queues
# a streaming swap that pays TCY back to the claiming module
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/swaps/streaming
asserts:
  - length == 1
  - .[0].source_asset == "THOR.RUNE"
  - .[0].target_asset == "THOR.TCY"
  - .[0].destination == "{{ addr_module_tcy_claim }}"
  - .[0].deposit == "${INIT_CLAIMING_RUNE}"
  - .[0].quantity == 2
  - .[0].interval == 1
---
type: create-blocks
count: 3
---
# The stream completed: the claiming module holds the swapped TCY plus the TCY
# pool's liquidity fee (in RUNE), which is routed to the claiming module.
type: check
endpoint: http://localhost:1317/thorchain/swaps/streaming
asserts:
  - length == 0
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == 34744723897057
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 121887610511
---
# No claimer records exist in this suite, so all TCY in the claim module is protocol-owned.
type: check
endpoint: http://localhost:1317/thorchain/tcy_protocol_owned
asserts:
  - .amount|tonumber == 34744723897057
---
type: check
endpoint: http://localhost:1317/thorchain/pool/THOR.TCY
asserts:
  - .status == "Available"
  - .balance_asset == "365255276102943"
  - .balance_rune == "27378112389489"
---
# The next distribution (height 15) swaps the accrued liquidity fee as well
type: create-blocks
count: 5
---
type: check
endpoint: http://localhost:1317/thorchain/swaps/streaming
asserts:
  - length == 0
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == 36360052587386
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 271020408
---
# Swap RUNE -> TCY and verify fees goes to Claiming module
type: tx-deposit
signer: {{ addr_thor_fish }}
coins:
  - amount: "${INIT_FISH_RUNE_MIN_FEES=10000000000}"
    asset: "rune"
memo: "SWAP:THOR.TCY:{{ addr_thor_fish }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 274656807
---
# RUNE swap fees accumulating in the claim module don't change protocol-owned TCY.
type: check
endpoint: http://localhost:1317/thorchain/tcy_protocol_owned
asserts:
  - .amount|tonumber == 36360052587386
---
# Swap TCY -> RUNE and verify fees goes to Claiming module
type: tx-deposit
signer: {{ addr_thor_fish }}
coins:
  - amount: "${INIT_FISH_TCY}"
    asset: "tcy"
memo: "SWAP:THOR.RUNE:{{ addr_thor_fish }}"
---
type: create-blocks
count: 1
---
# The distribution at height 20 sweeps the accrued swap fees into the next
# claiming swap in the same block
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_tcy_claim }}
asserts:
  - .balances|length == 1
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == 36360052587386
---
type: check
endpoint: http://localhost:1317/thorchain/swaps/streaming
asserts:
  - length == 1
  - .[0].destination == "{{ addr_module_tcy_claim }}"
  - .[0].deposit == "274657015"
---
# Swap RUNE -> TCY with affiliate fees
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_pig }}
asserts:
  - .balances|length == 0
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fish }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == 132137892648
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 871678082
---
type: tx-deposit
signer: {{ addr_thor_fish }}
coins:
  - amount: "500000000"
    asset: "rune"
memo: "SWAP:THOR.TCY:{{ addr_thor_fish }}::{{ addr_thor_pig }}:100"
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_pig }}
asserts:
  - .balances|length == 1
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 5000098
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fish }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == 138678518290
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 369678082
---
# Swap TCY -> RUNE with affiliate fees
type: tx-deposit
signer: {{ addr_thor_fish }}
coins:
  - amount: "5000000000"
    asset: "tcy"
memo: "SWAP:THOR.RUNE:{{ addr_thor_fish }}::{{ addr_thor_pig }}:100"
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_pig }}
asserts:
  - .balances|length == 1
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 8784110
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fish }}
asserts:
  - .balances|length == 2
  - .balances[]|select(.denom == "tcy")|.amount|tonumber == 133678518290
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 742295245
