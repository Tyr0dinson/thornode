# Note that a final withdraw cannot be done asymmetrically,
# for logged reason "fail to withdraw: cannot withdraw 100% of only one side of the pool".
{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: tx-mimir
signer: {{ addr_thor_dog }}
key: MaxOutboundFeeMultiplierBasisPoints
value: 30000 # To match Mainnet, outbound fee of 3x the expected gas cost
sequence: 0
---
type: create-blocks
count: 1
#########################################################################
---
type: check
description: confirm vault coins
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .|length == 1 # Only one vault
  - .[0].coins|length == 2 # Only two coin types
  - .[0].coins[]|select(.asset == "BTC.BTC")|.amount == "100000000"
  - .[0].coins[]|select(.asset == "ETH.ETH")|.amount == "1000000000"
---
type: check
description: confirm BTC.BTC pool state
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .LP_units == "100000000000"
  - .balance_asset == "100000000" # Same as vault balance
  - .balance_rune == "100001065448" # Higher due to block rewards
  - .status == "Available"
---
type: check
description: confirm ETH.ETH pool state
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .LP_units == "100000000000"
  - .balance_asset == "1000000000" # Same as vault balance
  - .balance_rune == "100001065448" # Higher due to block rewards
  - .status == "Available"
---
type: check
description: confirm Pool Module RUNE balance is the sum of the pools' RUNE balances
endpoint: http://localhost:1317/thorchain/balance/module/asgard
asserts:
 - .coins[]|select(.denom == "rune")|.amount == "200002130896"
---
# Full symmetrical withdraws
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "-:BTC.BTC:10000"
sequence: 0
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "-:ETH.ETH:10000"
sequence: 1
---
type: create-blocks
count: 1
#########################################################################
---
type: check
description: check that there are no scheduled queue (asset) outbounds
endpoint: http://localhost:1317/thorchain/queue/scheduled
asserts:
  - .|length == 0
---
type: check
description: check details of the (asset) queued outbounds
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 2
  - .[]|select(.chain == "BTC")|.coin.amount == "99979000"
  - .[]|select(.chain == "BTC")|.coin.asset == "BTC.BTC"
  - .[]|select(.chain == "BTC")|.max_gas[0].amount == "10500" # 1.5x estimated gas cost
  - .[]|select(.chain == "BTC")|.max_gas[0].asset == "BTC.BTC"
  - .[]|select(.chain == "ETH")|.coin.amount == "998080000"
  - .[]|select(.chain == "ETH")|.coin.asset == "ETH.ETH"
  - .[]|select(.chain == "ETH")|.max_gas[0].amount == "960000" # 1.5x estimated gas cost
  - .[]|select(.chain == "ETH")|.coin.asset == "ETH.ETH"
---
type: check
description: check BTC.BTC pool state
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .LP_units == "0"
  - .balance_asset == "21000" # 3x estimated gas cost
  - .balance_rune == "0"
  - .status == "Available" # Gas asset pools start empty and Available and remain Available even if they return to being empty.
# Note that the outbound's coin amount and the pool's remaining balance_asset sum to the pool's initial balance_asset, as it should be.
---
type: check
description: check ETH.ETH pool state
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .LP_units == "0"
  - .balance_asset == "1920000" # 3x estimated gas cost
  - .balance_rune == "0"
  - .status == "Available"
# Note that the outbound's coin amount and the pool's remaining balance_asset sum to the pool's initial balance_asset, as it should be.
---
type: check
description: confirm Pool Module RUNE balance is the sum of the pools' RUNE balances
endpoint: http://localhost:1317/thorchain/balance/module/asgard
asserts:
 - .coins|length == 0 # The 'rune' balance is 0 as expected, so it is not displayed.
---
type: check
description: confirm vault coins are unchanged
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .|length == 1 # Only one vault
  - .[0].coins|length == 2 # Only two coin types
  - .[0].coins[]|select(.asset == "BTC.BTC")|.amount == "100000000"
  - .[0].coins[]|select(.asset == "ETH.ETH")|.amount == "1000000000"
---
type: check
description: check the expected fee amounts
endpoint: http://localhost:1317/thorchain/inbound_addresses
asserts:
  - .[]|select(.chain == "BTC")|.outbound_fee == "21000"
  - .[]|select(.chain == "ETH")|.outbound_fee == "1920000"
---
type: check
description: check the actual fee event amounts
endpoint: http://localhost:1317/thorchain/blockevents
asserts:
  - .|[.tx[]|select(.type == "fee")]|length == 4 # Four fee events total (expecting two THOR.RUNE, one BTC.BTC, one ETH.ETH)
  - .|[.tx[]|select((.type == "fee") and (.coins == "2000000 THOR.RUNE"))]|length == 2
  - .|[.tx[]|select((.type == "fee") and (.coins == "21000 BTC.BTC"))]|length == 1
  - .|[.tx[]|select((.type == "fee") and (.coins == "1920000 ETH.ETH"))]|length == 1
  - .|[.tx[]|select(.type == "outbound")]|length == 2
  - .|[.tx[]|select((.type == "outbound") and (.coin == "99999065448 THOR.RUNE"))]|length == 2
  - .|[.tx[]|select(.type == "scheduled_outbound")]|length == 2
  - .|[.tx[]|select((.type == "scheduled_outbound") and (.coin_asset == "BTC.BTC") and (.coin_amount == "99979000"))]|length == 1
  - .|[.tx[]|select((.type == "scheduled_outbound") and (.coin_asset == "ETH.ETH") and (.coin_amount == "998080000"))]|length == 1
---
# Asset txout observations
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_dog }}
      to_address: {{ addr_btc_cat }}
      coins:
        - amount: "99979000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "7000" # 1x expected gas cost
          asset: "BTC.BTC"
      memo: "OUT:{{ native_txid 2 }}" # native_txid 1 was the tx-mimir at the start, while native_txid 2 was cat's first withdraw
    block_height: 3
    finalise_height: 3
    observed_pub_key: {{ pubkey_dog }}
sequence: 1
---
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: ETH
      from_address: {{ addr_eth_dog }}
      to_address: {{ addr_eth_cat }}
      coins:
        - amount: "998080000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "640000" # 1x expected gas cost
          asset: "ETH.ETH"
      memo: "OUT:{{ native_txid 3 }}"
    block_height: 3
    finalise_height: 3
    observed_pub_key: {{ pubkey_dog }}
sequence: 2
---
type: create-blocks
count: 1
#########################################################################
---
type: check
description: confirm the outbound queue is now empty
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
description: check the outbound and gas events
endpoint: http://localhost:1317/thorchain/blockevents
asserts:
  - .|[.tx[]|select(.type == "outbound")]|length == 2
  - .|[.tx[]|select((.type == "outbound") and (.coin == "99979000 BTC.BTC"))]|length == 1
  - .|[.tx[]|select((.type == "outbound") and (.coin == "998080000 ETH.ETH"))]|length == 1
  - .|[.end[]|select(.type == "gas")]|length == 2
  - .end[]|select((.type == "gas") and (.asset == "BTC.BTC"))|.asset_amt == "7000"
  - .end[]|select((.type == "gas") and (.asset == "ETH.ETH"))|.asset_amt == "640000"
---
type: check
description: confirm the vault coins
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .|length == 1 # Only one vault
  - .[0].coins|length == 2 # Only two coin types
  - .[0].coins[]|select(.asset == "BTC.BTC")|.amount == "14000" # Since 1x gas cost, 2x left of the 3x fee withheld
  - .[0].coins[]|select(.asset == "ETH.ETH")|.amount == "1280000" # Likewise
---
type: check
description: confirm BTC.BTC pool state
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .LP_units == "0"
  - .balance_asset == "14000" # Gas correctly deducted, the reaminder equalling the vault balance
  - .balance_rune == "0"
  - .status == "Available"
---
type: check
description: confirm ETH.ETH pool state
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .LP_units == "0"
  - .balance_asset == "1280000" # Gas correctly deducted, the reaminder equalling the vault balance
  - .balance_rune == "0"
  - .status == "Available"
---
type: check
description: confirm Pool Module RUNE balance is the sum of the pools' RUNE balances
endpoint: http://localhost:1317/thorchain/balance/module/asgard
asserts:
 - .coins|length == 0 # The 'rune' balance is 0 as expected, so it is not displayed.
---
# Pending symmetrical add liquidity (both directions first add)
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 3 }}'
    chain: BTC
    from_address: {{ addr_btc_cat }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "100000000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "+:BTC.BTC:{{ addr_thor_cat }}"
  block_height: 4
  finalise_height: 4
  observed_pub_key: {{ pubkey_dog }}
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "100000000000"
    asset: "rune"
memo: "+:ETH.ETH:{{ addr_eth_cat }}"
---
type: create-blocks
count: 1
#########################################################################
---
type: check
description: confirm BTC.BTC pool state
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .LP_units == "0"
  - .balance_asset == "14000"
  - .balance_rune == "0"
  - .pending_inbound_asset == "100000000"
  - .pending_inbound_rune == "0"
---
type: check
description: confirm ETH.ETH pool state
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .LP_units == "0"
  - .balance_asset == "1280000"
  - .balance_rune == "0"
  - .pending_inbound_asset == "0"
  - .pending_inbound_rune == "100000000000"
---
# Add liquidity completion
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "100000000000"
    asset: "rune"
memo: "+:BTC.BTC:{{ addr_btc_cat }}"
---
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 4 }}'
    chain: ETH
    from_address: {{ addr_eth_cat }}
    to_address: {{ addr_eth_dog }}
    coins:
      - amount: "1000000000"
        asset: "ETH.ETH"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "ETH.ETH"
    memo: "+:ETH.ETH:{{ addr_thor_cat }}"
  block_height: 4
  finalise_height: 4
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
#########################################################################
---
type: check
description: confirm BTC.BTC pool state
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .LP_units == "100000000000"
  - .balance_asset == "100014000"
  - .balance_rune == "100000532724" # Higher due to block rewards
  - .pending_inbound_asset == "0"
  - .pending_inbound_rune == "0"
---
type: check
description: confirm ETH.ETH pool state
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .LP_units == "100000000000"
  - .balance_asset == "1001280000"
  - .balance_rune == "100000532724" # Higher due to block rewards
  - .pending_inbound_asset == "0"
  - .pending_inbound_rune == "0"
---
type: check
description: confirm liquidity provider BTC.BTC position
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC/liquidity_provider/{{ addr_thor_cat }}
asserts:
  - .units == "100000000000"
  - .pending_asset == "0"
  - .pending_rune == "0"
  - .asset_deposit_value == "100014000"
  - .rune_deposit_value == "100000000000"
---
type: check
description: confirm liquidity provider ETH.ETH position
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH/liquidity_provider/{{ addr_thor_cat }}
asserts:
  - .units == "100000000000"
  - .pending_asset == "0"
  - .pending_rune == "0"
  - .asset_deposit_value == "1001280000"
  - .rune_deposit_value == "100000000000"
---
type: check
description: confirm vault coins
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .|length == 1 # Only one vault
  - .[0].coins|length == 2 # Only two coin types
  - .[0].coins[]|select(.asset == "BTC.BTC")|.amount == "100014000"
  - .[0].coins[]|select(.asset == "ETH.ETH")|.amount == "1001280000"
---
type: check
description: confirm Pool Module RUNE balance is the sum of the pools' RUNE balances
endpoint: http://localhost:1317/thorchain/balance/module/asgard
asserts:
 - .coins[]|select(.denom == "rune")|.amount == "200001065448"
