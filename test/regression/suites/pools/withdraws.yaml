{{ template "default-state.yaml" }}
---
{{ template "btc-eth-usdc-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# Nonsense withdraw attempt
########################################################################################
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "200000000"
    asset: "rune"
memo: "-:ETH.nonsense:10000"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .|[..|select(.log?)] | length == 1
  - ..|select(.log?).log | contains("pool (ETH.NONSENSE) doesn't exist")
  # handler_withdraw failed validation
---
########################################################################################
# Withdraw half the USDC position as USDC
########################################################################################
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "200000000"
    asset: "rune"
memo: "-:ETH.USDC:5000:ETH.USDC"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .|[..|select(.log?)] | length == 1
  - ..|select(.log?).log | contains("withdrawal asset must be empty, rune, or pool asset")
  # TODO (#1573): Withdrawal asset should accept fuzzy matching like pool asset (creating an outbound rather than a refund).
  # ( https://gitlab.com/thorchain/thornode/-/blob/v1.132.0/x/thorchain/handler.go#L317-319 )
