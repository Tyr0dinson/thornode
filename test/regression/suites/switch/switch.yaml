{{ template "default-state.yaml" }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: EnableSwitch-GAIA-KUJI
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - ."ENABLESWITCH-GAIA-KUJI" == 0
---
########################################################################################
# switch KUJI
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: GAIA
      from_address: {{ addr_gaia_fox }}
      to_address: {{ addr_gaia_dog }}
      coins:
        - amount: "10000000"
          asset: "GAIA.KUJI"
          decimals: 6
      gas:
        - amount: "10000"
          asset: "GAIA.ATOM"
      memo: "switch:{{ addr_thor_fox }}"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances|length == 2
  - .balances[1].denom == "thor.kuji"
  - .balances[1].amount|tonumber == 10000000
