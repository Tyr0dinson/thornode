{{ template "default-state.yaml" }}
---
{{ template "btc-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 1
  - .[0]|.balance_rune|tonumber == 100001087646
---
type: tx-mimir
key: RUNEPoolEnabled
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: POLMaxNetworkDeposit
value: 100000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# swap rune to btc synth
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "=:BTC/BTC"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.rune_deposited|tonumber == 10000000000
---
type: check
endpoint: http://localhost:1317/thorchain/quote/swap
params:
  from_asset: BTC.BTC
  to_asset: THOR.RUNE
  amount: 5000000
  destination: {{ addr_thor_fox }}
asserts:
  - .expected_amount_out|tonumber == 5439789627
---
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: '{{ observe_txid 1 }}'
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "5000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "=:BTC/BTC:{{ addr_thor_fox }}"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/runepool
asserts:
  - .pol.rune_deposited|tonumber ==  15999573064