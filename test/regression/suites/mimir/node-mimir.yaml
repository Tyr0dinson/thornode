---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .REGRESSIONTEST == 1
---
########################################################################################
# 2/3 nodes should override admin
########################################################################################
type: tx-mimir
key: RegressionTest
value: 2
signer: {{ addr_thor_fox }}
---
type: tx-mimir
key: RegressionTest
value: 2
signer: {{ addr_thor_frog }}
---
type: tx-mimir
key: RegressionTest
value: 2
signer: {{ addr_thor_goat }}
---
