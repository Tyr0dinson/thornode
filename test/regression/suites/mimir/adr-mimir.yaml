{{ template "5-validators-btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# Bond dog as a standby node with a full key set, IP and version, so its preflight check
# reaches the ADR vote gate. The 5 template validators only have a secp256k1 key, so
# their preflight always stops earlier at "has not registered their pubkey set".
########################################################################################
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - amount: "10000000000"
    asset: "rune"
memo: "bond:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
---
type: tx-set-node-keys
signer: {{ addr_thor_dog }}
pub_key_set: { "secp256k1": {{ pubkey_dog }}, "ed25519": {{ pubkey_dog_eddsa }} }
validator_cons_pub_key: {{ cons_pubkey_dog }}
---
type: create-blocks
count: 1
---
type: tx-set-ip-address
signer: {{ addr_thor_dog }}
ip_address: "10.0.0.1"
---
type: create-blocks
count: 1
---
type: tx-version
signer: {{ addr_thor_dog }}
version: "9.999.0"
---
type: create-blocks
count: 1
---
# baseline: no ADR vote pending, so the standby node is ready to churn in
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .status == "Standby"
  - .preflight_status.status == "Ready"
  - .preflight_status.reason == "OK"
  - .total_bond == "9994000000"
---
# the operator-facing endpoint agrees: nothing is pending yet
type: check
endpoint: http://localhost:1317/thorchain/mimir/votes_required
asserts:
  - .mimirs|length == 0
  # the gogo gateway marshals int64 as a JSON string
  - .active_node_count == "5"
---
########################################################################################
# a standby node cannot open an ADR key no active node has voted on, so cheap standby
# accounts cannot mint unbounded ADR state
########################################################################################
type: tx-mimir
key: ADR99Spam
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir/nodes_all
asserts:
  - .mimirs == null
---
########################################################################################
# 1/5 is below the 1/3+1 trigger, voting is not required yet
########################################################################################
type: tx-mimir
key: ADR42Test
value: 2
signer: {{ addr_thor_cat }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .preflight_status.reason == "OK"
---
########################################################################################
# 2/5 crosses 1/3+1, so voting is required and the standby non-voter cannot churn in
########################################################################################
type: tx-mimir
key: ADR42Test
value: 2
signer: {{ addr_thor_fox }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .preflight_status.status == "Standby"
  - '.preflight_status.reason == "node account has not voted on required mimir: ADR42TEST"'
---
# the same pending set is what operators are shown, so node-status.sh cannot display a
# set that differs from the one being enforced
type: check
endpoint: http://localhost:1317/thorchain/mimir/votes_required
asserts:
  - .mimirs|length == 1
  - .mimirs[0].key == "ADR42TEST"
  - .mimirs[0].votes == "2"
  - .active_node_count == "5"
---
# the mimir itself is not set without a supermajority
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .ADR42TEST == null
---
########################################################################################
# a standby node may vote on an ADR mimir, which clears its churn-in gate
########################################################################################
type: tx-mimir
key: ADR42Test
value: 2
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .preflight_status.status == "Ready"
  - .preflight_status.reason == "OK"
  # StandbyMimirCost (10 RUNE) deducted from bond, not the 0.02 RUNE native tx fee
  - .total_bond == "8994000000"
---
# node-status.sh diffs votes_required against this endpoint to decide what to warn about,
# so the node_mimirs field name and shape are part of that contract
type: check
endpoint: http://localhost:1317/thorchain/mimir/node/{{ addr_thor_dog }}
asserts:
  - .node_mimirs|length == 1
  - .node_mimirs[0].key == "ADR42TEST"
---
# the standby vote is recorded but does not count toward the supermajority
type: check
endpoint: http://localhost:1317/thorchain/mimir/node/{{ addr_thor_dog }}
asserts:
  - .node_mimirs|length == 1
  - .node_mimirs[0].key == "ADR42TEST"
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .ADR42TEST == null
---
########################################################################################
# 4/5 active (>= 2/3) on the same value sets the mimir
########################################################################################
type: tx-mimir
key: ADR42Test
value: 2
signer: {{ addr_thor_pig }}
---
type: tx-mimir
key: ADR42Test
value: 2
signer: {{ addr_thor_frog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .ADR42TEST == 2
---
# supermajority formed, so the requirement clears and operators stop being nagged
type: check
endpoint: http://localhost:1317/thorchain/mimir/votes_required
asserts:
  - .mimirs|length == 0
---
########################################################################################
# ADR mimirs are economic, not operational: all five votes are retained
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/mimir/nodes_all
asserts:
  - .mimirs|length == 5
