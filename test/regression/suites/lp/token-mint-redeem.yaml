{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "lp+:BTC.BTC:1000:{{ addr_thor_cat }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .[0].asset == "BTC.BTC"
  - .[0].pool_units == "100000000000"
  - .[0].LP_units == "99999999000"
  - .[0].bank_units == "1000"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC/liquidity_providers
asserts:
  - .[0].asset == "BTC.BTC"
  - .[0].units == "99999999000"
