{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
# Create initial NAMI pool and balances needed by this test
type: state
genesis:
  app_state:
    bank:
      balances:
        # Give fox some NAMI to pay native gas and send
        - address: {{ addr_thor_fox }}
          coins:
            - amount: "400000"
              denom: thor.nami
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "1000000000"
              denom: thor.nami
            - amount: "10200000000000"
              denom: rune
    thorchain:
      pools:
        - LP_units: "100000000000"
          asset: THOR.NAMI
          # Depth ratio tuned so 0.02 RUNE ~ 200 NAMI (BalanceAsset/BalanceRune ~= 1/10000)
          balance_asset: "1000000000"
          balance_rune: "10000000000000"
          decimals: "6"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
---
type: create-blocks
count: 1
---
# ensure no premium initially (0% added bps)
type: tx-mimir
key: AltNativeTxFeeAddedBps
value: 0
signer: {{ addr_thor_dog }}
sequence: 0
---
type: tx-mimir
key: AltNativeTxFeeSwapThresholdBps
value: 0
signer: {{ addr_thor_dog }}
sequence: 1
---
type: create-blocks
count: 1
---
# save cat rune balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom=="rune")|.amount|tonumber == ${CAT_BAL=2500000000000}
  - '[.balances[]|select(.denom=="thor.nami")]|length == 0' # no NAMI
---
# send away all fox rune - ensure no rune balance
type: tx-send
from_address: {{ addr_thor_fox }}
to_address: {{ addr_thor_cat }}
amount:
  - amount: "2499998000000"
    denom: "rune"
---
type: create-blocks
count: 1
---
# save fox NAMI balance and check it has no rune
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom=="rune")]|length == 0' # no rune
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${FOX_NAMI_BAL=400000}
---
# save reserve rune balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_module_reserve }}
asserts:
  - .balances[]|select(.denom=="rune")|.amount|tonumber == ${RES_BAL=35000002670468}
---
type: create-blocks
count: 1
---
########################################################################################
# send NAMI - pay fee in NAMI
########################################################################################
type: tx-send
from_address: {{ addr_thor_fox }}
to_address: {{ addr_thor_cat }}
amount:
  - amount: "${SEND_AMT=15000}"
    denom: "thor.nami"
---
type: create-blocks
count: 1
---
# verify cat NAMI balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${SEND_AMT} # amount sent/received
---
# verify fox rune and NAMI balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom=="rune")]|length == 0' # no rune
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${FOX_NAMI_BAL} - ${SEND_AMT} - ${GAS_IN_NAMI=201} # previous balance - sent amount - gas in NAMI (pool ratio 10:1)
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${FOX_NAMI_BAL=384799}
---
# verify reserve rune fee via end-block events (0.02 RUNE)
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - ${GAS=2000000}
  - ${GAS_LOWER=1980000} == ${GAS} * 99 / 100  # 1% precision
  - ${GAS_UPPER=2020000} == ${GAS} * 101 / 100 # 1% precision
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_LOWER}
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_UPPER}
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0]) as $alt_fee_swap | ($root.end_block_events | map(select(.type == "coin_received" and .receiver == "{{ addr_module_reserve }}" and (.amount | sub("rune$";"") | tonumber) == ($alt_fee_swap.emit_asset | sub(" THOR.RUNE$";"") | tonumber)))) | length == 1'
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].id) as $alt_fee_tx_id | ($root.end_block_events | map(select(.type == "fee" and .tx_id == $alt_fee_tx_id and (.coins | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_LOWER} and (.coins | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_UPPER}))) | length == 1'
---
########################################################################################
# swap NAMI to RUNE - pay fee in NAMI
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "${SWAP_AMT=15000}"
    asset: "THOR.NAMI"
memo: "=:r:{{ addr_thor_cat }}"
---
type: create-blocks
count: 1
---
# verify cat rune balance (increased)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom=="rune")|.amount|tonumber > ${CAT_BAL}
---
# verify fox rune and NAMI balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom=="rune")]|length == 0' # no rune
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${FOX_NAMI_BAL} - ${SWAP_AMT} - ${GAS_IN_NAMI} # previous balance - swap amount - gas in NAMI
---
# verify reserve rune fee via end-block events (0.02 RUNE)
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_LOWER}
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_UPPER}
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0]) as $alt_fee_swap | ($root.end_block_events | map(select(.type == "coin_received" and .receiver == "{{ addr_module_reserve }}" and (.amount | sub("rune$";"") | tonumber) == ($alt_fee_swap.emit_asset | sub(" THOR.RUNE$";"") | tonumber)))) | length == 1'
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].id) as $alt_fee_tx_id | ($root.end_block_events | map(select(.type == "fee" and .tx_id == $alt_fee_tx_id and (.coins | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_LOWER} and (.coins | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_UPPER}))) | length == 1'
---
########################################################################################
# Add premium 100% fee for using native gas fee
########################################################################################
type: tx-mimir
key: AltNativeTxFeeAddedBps
value: ${PREMIUM=10000} #100%
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# capture fox NAMI balance after first section to use as new baseline
# save fox NAMI balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${FOX_NAMI_BAL=369598}
---
########################################################################################
# swap NAMI to RUNE - pay fee in NAMI
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "${SWAP_AMT=15000}"
    asset: "THOR.NAMI"
memo: "=:r:{{ addr_thor_cat }}"
---
type: create-blocks
count: 1
---
# verify cat rune balance (increased)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom=="rune")|.amount|tonumber > ${CAT_BAL}
---
# verify fox rune and NAMI balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom=="rune")]|length == 0' # no rune
  - .balances[]|select(.denom=="thor.nami")|.amount|tonumber == ${FOX_NAMI_BAL} - ${SWAP_AMT} - ${GAS_IN_NAMI} * (10000 + ${PREMIUM}) / 10000 # previous balance - swap amount - gas in NAMI with premium bps
---
# verify reserve rune fee via end-block events with premium
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - ${GAS_PREMIUM=4000000} == ${GAS} * (10000 + ${PREMIUM}) / 10000
  - ${GAS_PREMIUM_LOWER=3960000} == ${GAS_PREMIUM} * 99 / 100  # 1% precision
  - ${GAS_PREMIUM_UPPER=4040000} == ${GAS_PREMIUM} * 101 / 100 # 1% precision
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_PREMIUM_LOWER}
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_PREMIUM_UPPER}
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0]) as $alt_fee_swap | ($root.end_block_events | map(select(.type == "coin_received" and .receiver == "{{ addr_module_reserve }}" and (.amount | sub("rune$";"") | tonumber) == ($alt_fee_swap.emit_asset | sub(" THOR.RUNE$";"") | tonumber)))) | length == 1'
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].id) as $alt_fee_tx_id | ($root.end_block_events | map(select(.type == "fee" and .tx_id == $alt_fee_tx_id and (.coins | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_PREMIUM_LOWER} and (.coins | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_PREMIUM_UPPER}))) | length == 1'
