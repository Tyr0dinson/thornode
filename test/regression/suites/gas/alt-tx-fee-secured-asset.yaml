{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
# ensure no premium initially (0% added bps)
type: tx-mimir
key: AltNativeTxFeeAddedBps
value: 0
signer: {{ addr_thor_dog }}
sequence: 0
---
type: tx-mimir
key: AltNativeTxFeeSwapThresholdBps
value: 0
signer: {{ addr_thor_dog }}
sequence: 1
---
type: create-blocks
count: 1
---
# save cat rune balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom=="rune")|.amount|tonumber == ${CAT_BAL=2500000000000}
---
# send away all fox rune - ensure no rune balance
type: tx-send
from_address: {{ addr_thor_fox }}
to_address: {{ addr_thor_cat }}
amount:
  - amount: "2499998000000"
    denom: "rune"
---
type: create-blocks
count: 1
---
########################################################################################
# verify fox rune balance is zero
########################################################################################
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom=="rune")]|length == 0' # no rune
---
########################################################################################
# deposit btc secured asset
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "10000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "secure+:{{ addr_thor_fox }}"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/securedasset/BTC-BTC
asserts:
  - .asset == "BTC-BTC"
  - .supply|tonumber == 10000000
  - .depth|tonumber == 10000000
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom=="btc-btc")|.amount|tonumber == 10000000
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - .txs|length == 1
  - '[.txs[0].result.events[]|select(.type == "secured_asset_deposit")]|length == 1'
  - .txs[0].result.events[]|select(.type == "secured_asset_deposit")|.asset == "BTC-BTC"
  - .txs[0].result.events[]|select(.type == "secured_asset_deposit")|.amount == "10000000"
  - .txs[0].result.events[]|select(.type == "secured_asset_deposit")|.rune_address == "{{ addr_thor_fox }}"
  - .txs[0].result.events[]|select(.type == "secured_asset_deposit")|.asset_address == "{{ addr_btc_fox }}"
---
########################################################################################
# swap secured asset BTC-BTC to rune - pay fee in BTC-BTC
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "${SWAP_AMT=1000000}"
    asset: "BTC-BTC"
memo: "=:r:{{ addr_thor_cat }}"
---
type: create-blocks
count: 1
---
# verify cat rune balance increased
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom=="rune")|.amount|tonumber > ${CAT_BAL}
---
# verify fox rune balance is zero
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom=="rune")]|length == 0' # no rune
---
## verify reserve rune fee via events (0.02 RUNE)
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - ${GAS=2000000}
# use 5% precision - secured asset swaps skew the pool price so the BTC->RUNE rate is now worse therefore we need such tolerance
  - ${GAS_LOWER=1900000} == ${GAS} * 95 / 100
  - ${GAS_UPPER=2100000} == ${GAS} * 105 / 100
# verify the fee swap end_block event amount stays within tolerance
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_LOWER}
  - (.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].emit_asset | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_UPPER}
# verify that a coin_received event exists to the Reserve for the native tx fee (within tolerance)
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0]) as $alt_fee_swap | ($root.end_block_events | map(select(.type == "coin_received" and .receiver == "{{ addr_module_reserve }}" and (.amount | sub("rune$";"") | tonumber) == ($alt_fee_swap.emit_asset | sub(" THOR.RUNE$";"") | tonumber)))) | length == 1'
# verify the matching fee end_block event amount
  - '. as $root | ($root.end_block_events | map(select(.type == "swap" and .memo == "ALT-NATIVE-FEE-SWAP")) | .[0].id) as $alt_fee_tx_id | ($root.end_block_events | map(select(.type == "fee" and .tx_id == $alt_fee_tx_id and (.coins | sub(" THOR.RUNE$";"") | tonumber) >= ${GAS_LOWER} and (.coins | sub(" THOR.RUNE$";"") | tonumber) <= ${GAS_UPPER}))) | length == 1'
