{{ template "default-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# new non-active node
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "1000000000000"
memo: "BOND:{{ addr_thor_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_fox }}
asserts:
  - .status == "Whitelisted"
  - .total_bond == "1000000000000"
---
########################################################################################
# rotate with coins fails
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "1"
memo: "ROTATE:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.code == 6
  - .tx_response.raw_log | test("coin amount must be zero")
---
########################################################################################
# rotate without node address fails
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "0"
memo: "ROTATE"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.code == 99
  - .tx_response.raw_log | test("invalid memo")
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "0"
memo: "ROTATE:"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.code == 99
  - .tx_response.raw_log | test("invalid memo")
---
########################################################################################
# rotate with non-THORChain address fails
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "0"
memo: "ROTATE:{{ addr_gaia_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.code == 99
  - .tx_response.raw_log | test("invalid memo")
---
########################################################################################
# node operator should still be unchanged
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_fox }}
asserts:
  - .node_operator_address == "{{ addr_thor_fox }}"
  - .total_bond == "1000000000000"
---
########################################################################################
# rotate fails if halted
########################################################################################
type: tx-mimir
signer: {{ addr_thor_dog }}
key: "HaltRotate"
value: 1
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "0"
memo: "ROTATE:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.code == 99
  - .tx_response.raw_log | test("rotate is halted")
---
type: tx-mimir
signer: {{ addr_thor_dog }}
key: "HaltRotate"
value: 0
---
type: create-blocks
count: 1
---
########################################################################################
# successful rotate
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "0"
memo: "ROTATE:{{ addr_thor_dog }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_fox }}
asserts:
  - .node_operator_address == "{{ addr_thor_dog }}"
  - .total_bond == "1000000000000"
  - (.total_bond|tonumber) == ([.bond_providers.providers[].bond|tonumber]|add)
  - .bond_providers.providers|length == 1
  - .bond_providers.providers[0].bond_address == "{{ addr_thor_dog }}"
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.events[]|select(.type=="rotate").attributes[]|select(.key=="signer").value == "{{ addr_thor_fox }}"
  - .tx_response.events[]|select(.type=="rotate").attributes[]|select(.key=="node_address").value == "{{ addr_thor_fox }}"
  - .tx_response.events[]|select(.type=="rotate").attributes[]|select(.key=="operator_address").value == "{{ addr_thor_dog }}"
---
########################################################################################
# old operator can no longer control node
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - asset: rune
    amount: "100000000"
memo: "BOND:{{ addr_thor_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/tx/v1beta1/txs/{{ native_txid -1 }}
asserts:
  - .tx_response.code == 6
  - .tx_response.raw_log | test("bond address is not valid for node account")
---
########################################################################################
# new operator controls node
########################################################################################
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - asset: rune
    amount: "100000000"
memo: "BOND:{{ addr_thor_fox }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_fox }}
asserts:
  - .total_bond == "1000100000000"
---
########################################################################################
# all nodes operated by dog
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - '[.[]|select(.node_operator_address=="{{ addr_thor_dog }}")]|length == 2'
  - length == 2
---
########################################################################################
# rotate all nodes to cat - only standby "fox" should be rotated
########################################################################################
type: tx-deposit
signer: {{ addr_thor_dog }}
coins:
  - asset: rune
    amount: "0"
memo: "ROTATE:{{ addr_thor_cat }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - '[.[]|select(.node_operator_address=="{{ addr_thor_cat }}")]|length == 1'
  - length == 2
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .node_operator_address == "{{ addr_thor_dog }}"
  - .bond_providers.providers == null
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_fox }}
asserts:
  - .node_operator_address == "{{ addr_thor_cat }}"
  - .bond_providers.providers|length == 1
  - .bond_providers.providers[0].bond_address == "{{ addr_thor_cat }}"
