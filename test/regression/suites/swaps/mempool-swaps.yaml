{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
# These mempool regressions still rely on pig/goat existing as funded THOR accounts,
# but that funding now needs to live in the suite instead of the shared default template.
type: state
genesis:
  app_state:
    auth:
      accounts:
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_pig }}
          pub_key: null
          account_number: "9"
          sequence: "0"
        - "@type": /cosmos.auth.v1beta1.BaseAccount
          address: {{ addr_thor_goat }}
          pub_key: null
          account_number: "10"
          sequence: "0"
    bank:
      balances:
        - address: {{ addr_thor_pig }}
          coins:
            - amount: "2500000000000"
              denom: rune
        - address: {{ addr_thor_goat }}
          coins:
            - amount: "2500000000000"
              denom: rune
---
type: create-blocks
count: 1
---
########################################################################################
# Test Mempool Swap Optimization Feature with TOR Cap
########################################################################################
# Set DollarsPerRune so TOR calculation works (1 RUNE = $1 for simplicity)
type: tx-mimir
key: DollarsPerRune
value: 100000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Enable the mempool swaps feature with a 3,000 TOR cap (enough for about 3 BTC).
# With 1 BTC ~ 1,000 RUNE and DollarsPerRune = 1, 1 BTC = 1,000 TOR.
type: tx-mimir
key: MempoolSwapCapTOR
value: 300000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Enable advanced swap queue
type: tx-mimir
key: EnableAdvSwapQueue
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Disable per-pool cap
type: tx-mimir
key: MempoolSwapPoolCapBPS
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Verify mimirs are enabled
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .MEMPOOLSWAPCAPTOR == 300000000000
  - .DOLLARSPERRUNE == 100000000
  - .ENABLEADVSWAPQUEUE == 1
  - .MEMPOOLSWAPPOOLCAPBPS == 0
---
# Verify initial mempool swap usage is 0
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
########################################################################################
# Scenario 1: Mempool Swap Execution with Usage Tracking
########################################################################################
# Submit an inbound with BTC inclusion height 4 and finality height 7.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"  # 1.0 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_fox }}"
    block_height: 4
    finalise_height: 7  # Will finalize 3 blocks later
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify the exact TOR reservation made at speculative admission.
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "${MEMPOOL_USAGE=100002663624}"
---
# Allow an extra block after advanced-queue execution so the staged settlement
# is stable before it is inspected.
type: create-blocks
count: 1
---
# With staged queue approach, outbounds are NOT in the queue until finalized
# Verify queue is empty (outbound is staged, not in real queue)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify outbound is in staged queue
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.chain == "ETH"
  - .staged_outbound_items[0].tx_out_item.to_address == "{{ addr_eth_fox }}"
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 1 }}"
  - .staged_outbound_items[0].tx_out_item.coin.asset == "ETH.ETH"
  # Speculative settlement stages the gross output. The outbound fee is applied
  # only when finality materializes the real outbound.
  - .staged_outbound_items[0].tx_out_item.coin.amount == "${STAGED_AMOUNT_1=160000000}"
  - .staged_outbound_items[0].scheduled_height|tonumber > 0
  - .staged_outbound_items[0].staged_height|tonumber > 0
---
# Irreversible accounting and clout remain deferred while the inbound is not final.
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .volume_rune == "0"
  - .volume_asset == "0"
  - .rolling_pool_liquidity_fee_rune == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .volume_rune == "0"
  - .volume_asset == "0"
  - .rolling_pool_liquidity_fee_rune == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/clout/swap/{{ addr_btc_fox }}
asserts:
  - .score == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/clout/swap/{{ addr_eth_fox }}
asserts:
  - .score == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/mempool_swaps
asserts:
  - .broken == false
---
########################################################################################
# Scenario 2: Cap Enforcement - Second Swap Should Wait When Cap Exceeded
########################################################################################
# Set a very small cap to test enforcement (100 TOR - less than current usage)
type: tx-mimir
key: MempoolSwapCapTOR
value: 10000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Verify cap was lowered
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .MEMPOOLSWAPCAPTOR == 10000000000
---
# Send another swap that should NOT be processed via mempool (cap exceeded)
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 10 }}"
      chain: BTC
      from_address: {{ addr_btc_cat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"  # 1.0 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_cat }}"
    block_height: 6
    finalise_height: 10  # Will finalize later
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# The second swap was rejected from speculative admission and waits for finality.
# It must not create an outbound, staged item, advanced-queue item, or reservation.
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 1 }}"
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '.|map(select(.tx.id == "{{ observe_txid 10 }}"))|length == 0'
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "${MEMPOOL_USAGE}"
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/mempool_swaps
asserts:
  - .broken == false
---
########################################################################################
# Scenario 3: Finalization Releases Capacity
########################################################################################
# Restore a larger cap so we can test capacity release
type: tx-mimir
key: MempoolSwapCapTOR
value: 200000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Re-observe the first transaction as finalized
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_fox }}"
    block_height: 8
    finalise_height: 8  # NOW finalized (block_height == finalise_height)
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify first outbound is now in queue (moved from staging on finalization)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 1
  - .[0].in_hash == "{{ observe_txid 1 }}"
  - .[0].chain == "ETH"
  - .[0].to_address == "{{ addr_eth_fox }}"
  - .[0].coin.asset == "ETH.ETH"
  - .[0].coin.amount == "${OUT_AMOUNT_1=159360000}"
---
# Verify staged queue is empty (item was moved to real queue)
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
# Verify mempool swap usage was released back to zero.
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
# Finality applies the previously deferred accounting and clout.
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .volume_rune|tonumber > 0
  - .volume_asset|tonumber > 0
  - .rolling_pool_liquidity_fee_rune|tonumber > 0
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .volume_rune|tonumber > 0
  - .volume_asset|tonumber > 0
  - .rolling_pool_liquidity_fee_rune|tonumber > 0
---
type: check
endpoint: http://localhost:1317/thorchain/clout/swap/{{ addr_btc_fox }}
asserts:
  - .score|tonumber > 0
---
type: check
endpoint: http://localhost:1317/thorchain/clout/swap/{{ addr_eth_fox }}
asserts:
  - .score|tonumber > 0
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/mempool_swaps
asserts:
  - .broken == false
---
# Clean up - observe the first outbound
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: ETH
      from_address: {{ addr_eth_dog }}
      to_address: {{ addr_eth_fox }}
      coins:
        - amount: "${OUT_AMOUNT_1}"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "960000"
          asset: "ETH.ETH"
          decimals: 8
      memo: "OUT:{{ observe_txid 1 }}"
    block_height: 9
    finalise_height: 9
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify the outbound was observed and processed (queue should be empty now)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
########################################################################################
# Scenario 4: Finalized Fallback Executes the Cap-Blocked Swap
########################################################################################
# Re-observe the second swap as finalized. It was never admitted speculatively,
# so it now follows the ordinary finalized execution path.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 10 }}"
      chain: BTC
      from_address: {{ addr_btc_cat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"  # 1.0 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_cat }}"
    block_height: 10
    finalise_height: 10  # NOW finalized
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify second swap now created an outbound (finalized)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 1
  - .[0].chain == "ETH"
  - .[0].to_address == "{{ addr_eth_cat }}"
  - .[0].in_hash == "{{ observe_txid 10 }}"
  - .[0].coin.asset == "ETH.ETH"
  - .[0].coin.amount == "${OUT_AMOUNT_2=85851813}"
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
# Clean up - observe the second outbound
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 11 }}"
      chain: ETH
      from_address: {{ addr_eth_dog }}
      to_address: {{ addr_eth_cat }}
      coins:
        - amount: "${OUT_AMOUNT_2}"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "960000"
          asset: "ETH.ETH"
          decimals: 8
      memo: "OUT:{{ observe_txid 10 }}"
    block_height: 11
    finalise_height: 11
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify queue is empty after cleanup
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/mempool_swaps
asserts:
  - .broken == false
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/asgard
asserts:
  - .broken == false
