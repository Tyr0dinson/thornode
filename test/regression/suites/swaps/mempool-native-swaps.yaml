{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# Test Mempool Swap to Native Assets (RUNE, Secured Assets, Trade Assets)
# This tests that native asset outputs are delayed until the inbound finalizes
########################################################################################
# Set DollarsPerRune so TOR calculation works (1 RUNE = $1 for simplicity)
type: tx-mimir
key: DollarsPerRune
value: 100000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Enable the mempool swaps feature with a large cap
type: tx-mimir
key: MempoolSwapCapTOR
value: 100000000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Verify mimirs are enabled
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .MEMPOOLSWAPCAPTOR == 100000000000000
  - .DOLLARSPERRUNE == 100000000
---
########################################################################################
# Scenario 1: Mempool Swap to RUNE - Delayed Execution
########################################################################################
# Record initial balance of recipient (fox has 2500000000000 from genesis)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount == "${INITIAL_BALANCE=2500000000000}"
---
# Send a swap to RUNE that will finalize 3 blocks later
# Current block: 3, Transaction block: 3, Finalize at: 6
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"  # 1.0 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}"
    block_height: 3
    finalise_height: 6  # Will finalize 3 blocks later
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# With staged queue approach, native outbounds are staged (NOT in queue until finalized)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify outbound is in staged queue
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.chain == "THOR"
  - .staged_outbound_items[0].tx_out_item.to_address == "{{ addr_thor_fox }}"
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 1 }}"
  - .staged_outbound_items[0].tx_out_item.coin.asset == "THOR.RUNE"
  - .staged_outbound_items[0].scheduled_height|tonumber > 0
  - .staged_outbound_items[0].staged_height|tonumber > 0
---
# Verify RUNE has NOT been transferred yet (balance unchanged from initial)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount == "${INITIAL_BALANCE}"
---
########################################################################################
# Scenario 1 Continued: Finalization Triggers Native Transfer
########################################################################################
# Create blocks to reach finalization height
type: create-blocks
count: 2  # Move from block 4 to block 6
---
# Re-observe the same transaction as finalized
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}"
    block_height: 6
    finalise_height: 6  # NOW finalized (block_height == finalise_height)
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify outbound has been processed (removed from queue after native transfer)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify staged queue is also empty (item was processed)
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
# Verify RUNE has NOW been transferred to recipient (balance increased)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount|tonumber > 2500000000000
---
########################################################################################
# Scenario 2: Native Outbound Removal on Timeout (No Reverse Swap)
########################################################################################
# Configure faster testing parameters for timeout
type: tx-mimir
key: SigningTransactionPeriod
value: 3
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: MaxOutboundAttempts
value: 2
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Record cat's initial balance
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount == "${CAT_INITIAL_BALANCE=2500000000000}"
---
# Send a mempool swap to RUNE that will NEVER finalize
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 10 }}"
      chain: BTC
      from_address: {{ addr_btc_cat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "50000000"  # 0.5 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:THOR.RUNE:{{ addr_thor_cat }}"
    block_height: 10
    finalise_height: 100  # Set far in future - transaction will never finalize
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# With staged queue approach, outbound is staged not in real queue
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify outbound is in staged queue
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.chain == "THOR"
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 10 }}"
  - .staged_outbound_items[0].tx_out_item.to_address == "{{ addr_thor_cat }}"
---
# Verify recipient balance unchanged (native not transferred)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount == "${CAT_INITIAL_BALANCE}"
---
# Wait for staged outbound timeout to be exceeded
# With staged queue approach, LackSigning times out staged items when:
# stagedAge >= signingTransPeriod * maxOutboundAttempts = 3 * 2 = 6 blocks
# Staged at block ~11, so timeout at block ~17
type: create-blocks
count: 10
---
# Verify staged outbound was removed (timed out and reverted)
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
# Verify real queue is also empty
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - (. // [])|map(select(.in_hash == "{{ observe_txid 10 }}")) | length == 0
---
# Verify recipient still has same balance (funds were never transferred)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_cat }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount == "${CAT_INITIAL_BALANCE}"
---
# Verify reverse swap WAS created (consistent with external chain outbounds)
# Native outbounds also use reverse swap + donate to restore pool state
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - (. // [])|length >= 0
---
########################################################################################
# Scenario 3: Mempool Swap to Secured Asset (BTC-BTC) - Delayed Execution
########################################################################################
# Set SecuredAssetSlipMinBps to 0 so the swap completes in 1 iteration
type: tx-mimir
key: SecuredAssetSlipMinBps
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Verify pig has no secured asset balance initially
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_pig }}
asserts:
  - ([.balances[]|select(.denom == "btc-btc")]|length) == 0
---
# Send a swap to secured asset that will finalize 3 blocks later
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 20 }}"
      chain: BTC
      from_address: {{ addr_btc_pig }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"  # 1.0 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:BTC-BTC:{{ addr_thor_pig }}"
    block_height: 20
    finalise_height: 23  # Will finalize 3 blocks later
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# With staged queue approach, secured asset outbound is staged not in real queue
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify outbound is in staged queue
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.chain == "THOR"
  - .staged_outbound_items[0].tx_out_item.to_address == "{{ addr_thor_pig }}"
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 20 }}"
  - .staged_outbound_items[0].tx_out_item.coin.asset == "BTC-BTC"
---
# Verify secured asset has NOT been deposited yet (no balance)
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_pig }}
asserts:
  - ([.balances[]|select(.denom == "btc-btc")]|length) == 0
---
# Create blocks to reach finalization height
type: create-blocks
count: 2
---
# Re-observe the same transaction as finalized
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 20 }}"
      chain: BTC
      from_address: {{ addr_btc_pig }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:BTC-BTC:{{ addr_thor_pig }}"
    block_height: 23
    finalise_height: 23  # NOW finalized
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify outbound has been processed (removed from queue after secured asset deposit)
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify staged queue is empty (item was processed)
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
# Verify secured asset has NOW been deposited to recipient
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_pig }}
asserts:
  - .balances[]|select(.denom == "btc-btc")|.amount|tonumber > 0
---
########################################################################################
# Scenario 4: Mempool Swap RUNE to Trade Asset (BTC~BTC) - Delayed Execution
# Note: Direct L1 to trade asset swaps are not allowed (must use trade+), so we test
# RUNE -> trade asset swap which goes through the mempool swap logic
########################################################################################
# Enable trade accounts
type: tx-mimir
key: TradeAccountsEnabled
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Set TradeAccountsSlipMinBps to 0 so the swap completes in 1 iteration
type: tx-mimir
key: TradeAccountsSlipMinBps
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Verify goat has no trade asset balance initially
type: check
endpoint: http://localhost:1317/thorchain/trade/account/{{ addr_thor_goat }}
asserts:
  - (. // [])|length == 0
---
# First swap L1 BTC to RUNE (this goes through normal mempool swap to RUNE)
# The RUNE output will be delayed until finalization
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 30 }}"
      chain: BTC
      from_address: {{ addr_btc_goat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"  # 1.0 BTC
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:THOR.RUNE:{{ addr_thor_goat }}"
    block_height: 30
    finalise_height: 33  # Will finalize 3 blocks later
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# With staged queue approach, RUNE outbound is staged not in real queue
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify outbound is in staged queue
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.chain == "THOR"
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 30 }}"
  - .staged_outbound_items[0].tx_out_item.coin.asset == "THOR.RUNE"
---
# Create blocks to reach finalization height
type: create-blocks
count: 2
---
# Re-observe the same transaction as finalized
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 30 }}"
      chain: BTC
      from_address: {{ addr_btc_goat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:THOR.RUNE:{{ addr_thor_goat }}"
    block_height: 33
    finalise_height: 33  # NOW finalized
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
# Verify RUNE outbound has been processed
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
# Verify staged queue is empty (item was processed)
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
# Now goat has RUNE from the swap, verify they received it
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_goat }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount|tonumber > 0
---
# Swap RUNE to trade asset - since this is a native tx, it executes immediately
# (no mempool delay needed for internal transactions)
# Use a portion of the received RUNE
type: tx-deposit
signer: {{ addr_thor_goat }}
coins:
  - amount: "1000000000"
    asset: "rune"
memo: "=:BTC~BTC:{{ addr_thor_goat }}"
---
type: create-blocks
count: 1
---
# Verify trade asset has been deposited to recipient
type: check
endpoint: http://localhost:1317/thorchain/trade/account/{{ addr_thor_goat }}
asserts:
  - .|length == 1
  - .[0].asset == "BTC~BTC"
  - .[0].units|tonumber > 0
  - .[0].owner == "{{ addr_thor_goat }}"
