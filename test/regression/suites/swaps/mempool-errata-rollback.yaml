{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# Enable deterministic mempool-swap admission and advanced-queue execution.
########################################################################################
type: tx-mimir
key: DollarsPerRune
value: 100000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: MempoolSwapCapTOR
value: 100000000000000
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: MempoolSwapPoolCapBPS
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: EnableAdvSwapQueue
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .DOLLARSPERRUNE == 100000000
  - .MEMPOOLSWAPCAPTOR == 100000000000000
  - .MEMPOOLSWAPPOOLCAPBPS == 0
  - .ENABLEADVSWAPQUEUE == 1
---
# Pin the state that every rollback below must restore. Block rewards change RUNE
# depths, so only the asset-side depths are compared exactly.
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset == "${BTC_ASSET_DEPTH=100000000}"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .balance_asset == "${ETH_ASSET_DEPTH=1000000000}"
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[]|.coins[]|select(.asset == "BTC.BTC")|.amount == "${ASGARD_BTC=100000000}"
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
########################################################################################
# Scenario 1: errata after speculative settlement must remove the staged outbound,
# restore both pools atomically, release capacity, and leave the unfinalized vault alone.
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_fox }}"
    block_height: 6
    finalise_height: 100
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - .staged_outbound_items|length == 1
  - .staged_outbound_items[0].tx_out_item.in_hash == "{{ observe_txid 1 }}"
  - .staged_outbound_items[0].tx_out_item.chain == "ETH"
  - .staged_outbound_items[0].tx_out_item.to_address == "{{ addr_eth_fox }}"
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap/details/{{ observe_txid 1 }}
status: 400
asserts:
  - .message|contains("not found in any queue")
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor|tonumber > 0
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset|tonumber > ${BTC_ASSET_DEPTH}
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .balance_asset|tonumber < ${ETH_ASSET_DEPTH}
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[]|.coins[]|select(.asset == "BTC.BTC")|.amount == "${ASGARD_BTC}"
---
type: tx-errata-tx
signer: {{ addr_thor_dog }}
tx_id: "{{ observe_txid 1 }}"
chain: BTC
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/tx/details/{{ observe_txid 1 }}
asserts:
  - .reverted == true
  - (.updated_vault // false) == false
  - (.actions // [])|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset == "${BTC_ASSET_DEPTH}"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .balance_asset == "${ETH_ASSET_DEPTH}"
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[]|.coins[]|select(.asset == "BTC.BTC")|.amount == "${ASGARD_BTC}"
---
# The lifecycle rollback is emitted by the errata DeliverTx. It must not fall
# through to the ordinary errata accounting path.
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - '[.txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 1 }}")]|length == 1'
  - .txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 1 }}")|.block_height == "7"
  - .txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 1 }}")|.source_asset == "BTC.BTC"
  - .txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 1 }}")|.source_amount == "100000000"
  - '[.txs[].result.events[]|select(.type == "security" and .msg == "mempool swap rolled back")]|length == 1'
  - '[.txs[].result.events[]|select(.type == "errata")]|length == 0'
---
# A later finalized replay of the reverted observation must not recreate queue,
# capacity, pool, or vault state.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_fox }}"
    block_height: 6
    finalise_height: 6
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/tx/details/{{ observe_txid 1 }}
asserts:
  - .reverted == true
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset == "${BTC_ASSET_DEPTH}"
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .balance_asset == "${ETH_ASSET_DEPTH}"
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[]|.coins[]|select(.asset == "BTC.BTC")|.amount == "${ASGARD_BTC}"
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - '[.txs[].result.events[]|select(.type == "swap" or .type == "mempool_swap_reverted" or .type == "security" or .type == "errata")]|length == 0'
---
########################################################################################
# Scenario 2: finality arriving while a stream is active leaves a zero-reservation
# lifecycle tombstone. Errata must still stop the stream, reverse its progress,
# and debit the finalized inbound from Asgard exactly once.
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: BTC
      from_address: {{ addr_btc_cat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_cat }}:0/1/10"
    block_height: 9
    finalise_height: 100
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap/details/{{ observe_txid 2 }}
asserts:
  - .status == "queued"
  - .queue_type == "advanced"
  - .swap.state.count == 1
  - .swap.state.quantity == 10
  - .swap.state.failed_swaps|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor|tonumber > 0
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[]|.coins[]|select(.asset == "BTC.BTC")|.amount == "${ASGARD_BTC}"
---
# Finalize before the stream settles. Capacity is released and the inbound is
# credited, but the advanced queue remains owned by the finalized tombstone.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: BTC
      from_address: {{ addr_btc_cat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "100000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      memo: "=:ETH.ETH:{{ addr_eth_cat }}:0/1/10"
    block_height: 9
    finalise_height: 9
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap/details/{{ observe_txid 2 }}
asserts:
  - .status == "queued"
  - .queue_type == "advanced"
  - .swap.state.count >= 1
  - .swap.state.count < .swap.state.quantity
  - .swap.state.quantity == 10
  - .swap.state.failed_swaps|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/staged
asserts:
  - (.staged_outbound_items // [])|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/network
asserts:
  - .mempool_swap_usage_tor == "0"
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[]|.coins[]|select(.asset == "BTC.BTC")|.amount == "200000000"
---
# Finality applies deferred accounting, but the partially executed stream still
# owns real speculative pool movement that errata must reverse.
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset|tonumber > ${BTC_ASSET_DEPTH}
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ETH.ETH
asserts:
  - .balance_asset|tonumber < ${ETH_ASSET_DEPTH}
---
type: check
endpoint: http://localhost:1317/thorchain/tx/details/{{ observe_txid 2 }}
asserts:
  - (.reverted // false) == false
  - .updated_vault == true
  - (.actions // [])|length == 0
