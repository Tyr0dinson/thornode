asserts:
  - '[.txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 2 }}")]|length == 1'
  - .txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 2 }}")|.block_height == "11"
  - .txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 2 }}")|.source_asset == "BTC.BTC"
  - .txs[].result.events[]|select(.type == "mempool_swap_reverted" and .tx_id == "{{ observe_txid 2 }}")|.source_amount == "100000000"
