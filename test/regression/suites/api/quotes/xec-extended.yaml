{{ template "default-state.yaml" }}
---
type: state
genesis:
  app_state:
    bank:
      balances:
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "200000000000"
              denom: rune
    thorchain:
      liquidity_providers:
        - asset: XEC.XEC
          asset_address: {{ addr_xec_cat }}
          asset_deposit_value: "1000000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
        - asset: XMR.XMR
          asset_address: {{ addr_xmr_cat }}
          asset_deposit_value: "1000000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
      pools:
        - LP_units: "100000000000"
          asset: XEC.XEC
          balance_asset: "1000000000000"
          balance_rune: "100000000000"
          decimals: "2"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
        - LP_units: "100000000000"
          asset: XMR.XMR
          balance_asset: "1000000000000"
          balance_rune: "100000000000"
          decimals: "12"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
      network_fees:
        - chain: XEC
          transaction_fee_rate: "2"
          transaction_size: "1500"
        - chain: XMR
          transaction_fee_rate: "10000"
          transaction_size: "5000"
      vaults:
        - block_height: "0"
          chains:
            - THOR
            - XEC
            - XMR
          coins:
            - amount: "1000000000000"
              asset: XEC.XEC
              decimals: "2"
            - amount: "1000000000000"
              asset: XMR.XMR
              decimals: "12"
          inbound_tx_count: "1"
          membership:
            - {{ pubkey_dog }}
          pub_key: {{ pubkey_dog }}
          pub_key_eddsa: {{ pubkey_dog_eddsa }}
          pub_key_frost: {{ pubkey_dog_eddsa }}
          status: ActiveVault
          type: AsgardVault
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 2
---
# Without extended mode, the XMR destination makes the memo too long for XEC.
type: check
endpoint: http://localhost:1317/thorchain/quote/swap
params:
  from_asset: XEC.XEC
  to_asset: XMR.XMR
  amount: 50000000000
  destination: {{ addr_xmr_fox }}
status: 400
asserts:
  - .message|contains("generated memo too long for source chain")
---
# Extended mode returns an OP_RETURN plus native-unit continuation outputs.
type: check
endpoint: http://localhost:1317/thorchain/quote/swap
params:
  from_asset: XEC.XEC
  to_asset: XMR.XMR
  amount: 50000000000
  destination: {{ addr_xmr_fox }}
  extended: true
asserts:
  - .expected_amount_out|tonumber > 0
  - .memo|startswith("=:")
  - .vout|length >= 2
  - .vout[0].type == "op_return"
  - .vout[1].type == "address"
  - .vout[1].data|startswith("q")
  - .vout[1].data|contains(":")|not
  - .vout[1].amount == 546
