{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 2
---
########################################################################################
# Enable intents with specific slide configuration
# IntentPriceSlideBlocks = 10 for easier testing
# IntentTTLBlocks = 100 to ensure match height isn't capped
########################################################################################
type: tx-mimir
key: IntentsEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 0
---
type: tx-mimir
key: IntentPriceSlideBlocks
value: 10
signer: {{ addr_thor_dog }}
sequence: 1
---
type: tx-mimir
key: IntentTTLBlocks
value: 100
signer: {{ addr_thor_dog }}
sequence: 2
---
type: create-blocks
count: 1
---
########################################################################################
# Create an intent with a price range - swap ETH for BTC
# high = 2400000 (0.024 BTC), low = 1200000 (0.012 BTC)
# This gives a range of 1200000 for testing price sliding
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 1 }}'
    chain: ETH
    from_address: {{ addr_eth_fox }}
    to_address: {{ addr_eth_dog }}
    coins:
      - amount: "100000000"
        asset: "ETH.ETH"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "ETH.ETH"
    memo: "IO:BTC.BTC:2400000:1200000:{{ addr_btc_fox }}"
  block_height: 2
  finalise_height: 2
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Check intent was created with price range
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ observe_txid 1 }}
asserts:
  - .intent.tx_id == "{{ observe_txid 1 }}"
  - .intent.status == "IntentActive"
  - .intent.high_target == "2400000"
  - .intent.low_target == "1200000"
---
########################################################################################
# Submit solve at midpoint: 1800000 (halfway between 1200000 and 2400000)
# Expected delay calculation:
# delay = (high - offered) * slide_blocks / (high - low)
# delay = (2400000 - 1800000) * 10 / (2400000 - 1200000)
# delay = 600000 * 10 / 1200000 = 5 blocks
# match_height = current_height + 5
# Solver sends from BTC chain, specifies ETH destination for source asset
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 2 }}'
    chain: BTC
    from_address: {{ addr_btc_cat }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "1800000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "IS:{{ observe_txid 1 }}:{{ addr_eth_cat }}"
  block_height: 3
  finalise_height: 3
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Check solve was created with delayed match height
# Current block is 4, solve submitted at block 4, expected match at block 4 + 5 = 9
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ observe_txid 1 }}
asserts:
  - .intent.status == "IntentActive"
  - .solves | length == 1
  - .solves[0].match_height == "9"
---
########################################################################################
# Advance 4 blocks - should still be waiting (block 8)
########################################################################################
type: create-blocks
count: 4
---
########################################################################################
# Check intent is still active (not yet at match height 9)
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ observe_txid 1 }}
asserts:
  - .intent.status == "IntentActive"
---
########################################################################################
# Advance 1 more block to reach match height (block 9)
########################################################################################
type: create-blocks
count: 1
---
########################################################################################
# Check intent was completed at match height
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ observe_txid 1 }}
asserts:
  - .intent.status == "IntentCompleted"
---
########################################################################################
# Check outbound queue has the swaps scheduled
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length >= 1
---
########################################################################################
# Observe solver's outbound (cat gets ETH source)
# Amount: source (100M) - protocol fee - outbound gas
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 3 }}'
    chain: ETH
    from_address: {{ addr_eth_dog }}
    to_address: {{ addr_eth_cat }}
    coins:
      - amount: "99260000"
        asset: "ETH.ETH"
        decimals: 8
    gas:
      - amount: "960000"
        asset: "ETH.ETH"
    memo: "OUT:{{ observe_txid 2 }}"
  block_height: 10
  finalise_height: 10
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Observe user's outbound (fox gets BTC target)
# Amount: solve amount (1800000) - outbound gas
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 4 }}'
    chain: BTC
    from_address: {{ addr_btc_dog }}
    to_address: {{ addr_btc_fox }}
    coins:
      - amount: "1793000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "OUT:{{ observe_txid 1 }}"
  block_height: 11
  finalise_height: 11
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Verify outbound queue is now empty
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
########################################################################################
# Verify intents list is empty
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intents
asserts:
  - .intents | length == 0
