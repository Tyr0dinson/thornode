type: env
key: TRADE_ACCOUNTS_SLIP_MIN_BPS
value: "50"
---
{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 2
---
########################################################################################
# Enable intents and trade accounts
########################################################################################
type: tx-mimir
key: IntentsEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 0
---
type: tx-mimir
key: TradeAccountsEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 1
---
type: create-blocks
count: 1
---
########################################################################################
# Deposit BTC to get BTC~BTC trade asset for fox (intent creator)
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 1 }}'
    chain: BTC
    from_address: {{ addr_btc_fox }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "10000000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "trade+:{{ addr_thor_fox }}"
  block_height: 2
  finalise_height: 2
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Check fox has BTC~BTC trade asset
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/trade/account/{{ addr_thor_fox }}
asserts:
  - .|length == 1
  - .[0].asset == "BTC~BTC"
  - .[0].units|tonumber == 10000000
---
########################################################################################
# Create an intent using trade assets
# Fox wants to swap BTC~BTC trade for RUNE
# One side must be fee-chargeable (RUNE is native, so fee-chargeable)
# Format: IO:TARGET_ASSET:HIGH_TARGET:LOW_TARGET:TARGET_ADDR
# native_txid counts: 1=IntentsEnabled, 2=TradeAccountsEnabled, 3=observed-in BTC, 4=tx-deposit intent
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "5000000"
    asset: "BTC~BTC"
memo: "IO:THOR.RUNE:500000000:500000000:{{ addr_thor_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Check the intent was created
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ native_txid 4 }}
asserts:
  - .intent.tx_id == "{{ native_txid 4 }}"
  - .intent.source.asset == "BTC~BTC"
  - .intent.source.amount == "5000000"
  - .intent.target_asset == "THOR.RUNE"
  - .intent.status == "IntentActive"
---
########################################################################################
# Solver (cat) sends RUNE to solve the intent
# Format: IS:INTENT_TX_HASH
# Sending 500000000 RUNE which meets the high target for immediate execution
########################################################################################
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "500000000"
    asset: "THOR.RUNE"
memo: "IS:{{ native_txid 4 }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Check intent was completed (match_height = current_height for immediate execution)
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ native_txid 4 }}
asserts:
  - .intent.status == "IntentCompleted"
---
########################################################################################
# Verify fox received RUNE (target asset)
# Fox started with 2500000000000 RUNE and should have received ~500000000 (minus fees)
########################################################################################
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - '[.balances[]|select(.denom == "rune")]|length == 1'
  - '[.balances[]|select(.denom == "rune")]|.[0].amount|tonumber >= 2500400000000'
---
########################################################################################
# Verify cat received BTC~BTC trade (source asset)
# Cat should have received 5000000 BTC~BTC (minus any fees)
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/trade/account/{{ addr_thor_cat }}
asserts:
  - .|length >= 1
  - '[.[]|select(.asset == "BTC~BTC")]|length == 1'
  - '[.[]|select(.asset == "BTC~BTC")]|.[0].units|tonumber >= 4900000'
---
########################################################################################
# Verify intents list is empty
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intents
asserts:
  - .intents | length == 0
