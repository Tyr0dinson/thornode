{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 2
---
########################################################################################
# Enable intents
########################################################################################
type: tx-mimir
key: IntentsEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 0
---
type: create-blocks
count: 1
---
########################################################################################
# Create an intent using RUNE as source
# User (fox) wants to swap RUNE for ETH
# Format: IO:TARGET_ASSET:HIGH_TARGET:LOW_TARGET:TARGET_ADDR
# native_txid 2 will be the intent tx (after mimir tx which is native_txid 1)
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "1000000000"
    asset: "rune"
memo: "IO:ETH.ETH:100000000:80000000:{{ addr_eth_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Check the intent was created
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ native_txid 2 }}
asserts:
  - .intent.tx_id == "{{ native_txid 2 }}"
  - .intent.source.asset == "THOR.RUNE"
  - .intent.source.amount == "1000000000"
  - .intent.target_asset == "ETH.ETH"
  - .intent.status == "IntentActive"
---
########################################################################################
# Let the intent expire
# IntentTTLBlocks is 5 in mocknet
# Since RUNE is a native asset, it should be refunded directly (no auction)
########################################################################################
type: create-blocks
count: 5
---
########################################################################################
# Check that intent status changed to IntentExpired (refunded directly)
# Native assets (RUNE) are refunded immediately instead of going to auction
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ native_txid 2 }}
asserts:
  - .intent.status == "IntentExpired"
---
########################################################################################
# Verify no auction was created (native assets skip auction)
# The endpoint returns not found when no auction exists
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/auction/{{ native_txid 2 }}
status: 404
asserts:
  - .code|tonumber == 5
  - .message|contains("auction not found")
---
########################################################################################
# For RUNE source intents that expire, the full amount is refunded to owner
# These are native transfers, not external chain outbounds, so we verify
# by checking that the outbound queue has no pending external outbounds
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - (. == null) or (. | length == 0)
---
type: create-blocks
count: 1
---
########################################################################################
# Verify intents list is empty (intent has been processed)
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intents
asserts:
  - (.intents == null) or (.intents | length == 0)
