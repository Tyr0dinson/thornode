{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 2
---
########################################################################################
# Enable intents with specific configuration for testing competing solves
########################################################################################
type: tx-mimir
key: IntentsEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 0
---
type: tx-mimir
key: IntentPriceSlideBlocks
value: 100
signer: {{ addr_thor_dog }}
sequence: 1
---
type: create-blocks
count: 1
---
########################################################################################
# Create an intent - swap ETH for BTC
# high=1200000, low=1200000 for immediate execution
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 1 }}'
    chain: ETH
    from_address: {{ addr_eth_fox }}
    to_address: {{ addr_eth_dog }}
    coins:
      - amount: "100000000"
        asset: "ETH.ETH"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "ETH.ETH"
    memo: "IO:BTC.BTC:1200000:1200000:{{ addr_btc_fox }}"
  block_height: 2
  finalise_height: 2
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Check intent was created with high=low for immediate execution
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ observe_txid 1 }}
asserts:
  - .intent.tx_id == "{{ observe_txid 1 }}"
  - .intent.status == "IntentActive"
  - .intent.high_target == "1200000"
  - .intent.low_target == "1200000"
---
########################################################################################
# Submit BOTH solves in the SAME block to ensure they both arrive before execution
# Cat offers 1200000, Pig offers 1205000 (higher but within 1x BTC gas fee)
# BTC gas fee = TransactionSize(1000) * TransactionFeeRate(7) = 7000 sats
# Since diff (5000) <= gasFee (7000), both are treated as equal candidates.
# Cat wins by lowest txid tiebreaker (txid 02 < txid 03).
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 2 }}'
    chain: BTC
    from_address: {{ addr_btc_cat }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "1200000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "IS:{{ observe_txid 1 }}:{{ addr_eth_cat }}"
  block_height: 3
  finalise_height: 3
  observed_pub_key: {{ pubkey_dog }}
- tx:
    id: '{{ observe_txid 3 }}'
    chain: BTC
    from_address: {{ addr_btc_pig }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "1205000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "IS:{{ observe_txid 1 }}:{{ addr_eth_pig }}"
  block_height: 3
  finalise_height: 3
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Check intent was completed - cat wins by deterministic tiebreaker
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ observe_txid 1 }}
asserts:
  - .intent.status == "IntentCompleted"
---
########################################################################################
# Check outbound queue has scheduled transactions
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length >= 2
---
########################################################################################
# Observe cat's outbound (winner gets ETH source at destination address)
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 4 }}'
    chain: ETH
    from_address: {{ addr_eth_dog }}
    to_address: {{ addr_eth_cat }}
    coins:
      - amount: "99260000"
        asset: "ETH.ETH"
        decimals: 8
    gas:
      - amount: "960000"
        asset: "ETH.ETH"
    memo: "OUT:{{ observe_txid 2 }}"
  block_height: 4
  finalise_height: 4
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Observe user's outbound (fox gets BTC target from cat's winning solve)
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 5 }}'
    chain: BTC
    from_address: {{ addr_btc_dog }}
    to_address: {{ addr_btc_fox }}
    coins:
      - amount: "1193000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "OUT:{{ observe_txid 1 }}"
  block_height: 6
  finalise_height: 6
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Observe pig's refund (losing solve gets refunded BTC)
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 6 }}'
    chain: BTC
    from_address: {{ addr_btc_dog }}
    to_address: {{ addr_btc_pig }}
    coins:
      - amount: "1198000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "REFUND:{{ observe_txid 3 }}"
  block_height: 7
  finalise_height: 7
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Verify outbound queue is now empty
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
########################################################################################
# Verify intents list is empty (completed intent should not be in active list)
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intents
asserts:
  - .intents | length == 0
