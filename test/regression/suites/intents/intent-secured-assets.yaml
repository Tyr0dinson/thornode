{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 2
---
########################################################################################
# Enable intents
########################################################################################
type: tx-mimir
key: IntentsEnabled
value: 1
signer: {{ addr_thor_dog }}
sequence: 0
---
type: create-blocks
count: 1
---
########################################################################################
# Deposit BTC to get BTC-BTC secured asset for fox
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 1 }}'
    chain: BTC
    from_address: {{ addr_btc_fox }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "10000000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "secure+:{{ addr_thor_fox }}"
  block_height: 2
  finalise_height: 2
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Check fox has BTC-BTC secured asset
########################################################################################
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances|length >= 1
  - '[.balances[]|select(.denom == "btc-btc")]|length == 1'
---
########################################################################################
# Create an intent using secured assets
# Fox wants to swap BTC-BTC secured for RUNE
# One side must be fee-chargeable (RUNE is native, so fee-chargeable)
# Format: IO:TARGET_ASSET:HIGH_TARGET:LOW_TARGET:TARGET_ADDR
# native_txid counts: 1=IntentsEnabled, 2=observed-in BTC, 3=tx-deposit intent
########################################################################################
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "5000000"
    asset: "BTC-BTC"
memo: "IO:THOR.RUNE:500000000:400000000:{{ addr_thor_fox }}"
---
type: create-blocks
count: 1
---
########################################################################################
# Check the intent was created
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ native_txid 3 }}
asserts:
  - .intent.tx_id == "{{ native_txid 3 }}"
  - .intent.source.asset == "BTC-BTC"
  - .intent.source.amount == "5000000"
  - .intent.target_asset == "THOR.RUNE"
  - .intent.status == "IntentActive"
---
########################################################################################
# Let the intent expire
# IntentTTLBlocks is 5 in mocknet
# Since BTC-BTC is a native secured asset, it should be refunded directly (no auction)
########################################################################################
type: create-blocks
count: 5
---
########################################################################################
# Check that intent status changed to IntentExpired (refunded directly)
# Native secured assets are refunded immediately instead of going to auction
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/{{ native_txid 3 }}
asserts:
  - .intent.status == "IntentExpired"
---
########################################################################################
# Verify no auction was created (native secured assets skip auction)
# The endpoint returns not found when no auction exists
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intent/auction/{{ native_txid 3 }}
status: 404
asserts:
  - .code|tonumber == 5
  - .message|contains("auction not found")
---
########################################################################################
# Verify fox's BTC-BTC secured asset was returned after intent expired
# (funds should be returned when intent expires without completion)
########################################################################################
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances|length >= 1
  - '[.balances[]|select(.denom == "btc-btc")]|length == 1'
---
########################################################################################
# Verify intents list is empty
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/intents
asserts:
  - .intents | length == 0
