{{ template "default-state.yaml" }}
---
{{ template "btc-pool-state.yaml" }}
---
type: state
genesis:
  app_state:
    thorchain:
      store_version: "128"
      node_accounts:
        - active_block_height: "0"
          bond: "5000000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_dog }}
          bond_address: {{ addr_thor_dog }}
          pub_key_set:
            secp256k1: "tthorpub1addwnpepqfshsq2y6ejy2ysxmq4gj8n8mzuzyulk9wh4n946jv5w2vpwdn2yuyp6sp4"
            ed25519: "tthorpub1zcjduepqfan43w2emjhfv45gspf98squqlnl2rcchc3e4dx7z2nxr27edflsy2e8ql"
          signer_membership: []
          status: Active
          # matches the priv_validator_key.json mounted in the test container
          validator_cons_pub_key: tthorcpub1zcjduepqq75h7uy6qhesh9d3a9tuk0mzrnc46u8rye44ze6peua3zmpfh23q8z37sz
          version: "1.129.0"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/version
asserts:
  - .|.current == "1.129.0"
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - 'has("RAGNAROK-BNB-BNB") | not'
  - 'has("RAGNAROK-BNB-BUSD-BD1") | not'
  - 'has("CONFMULTIPLIERBASISPOINTS") | not'
  - 'has("MAXCONFIRMATIONS") | not'
---
type: tx-version
version: "1.130.0"
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 2  # need to produce two blocks for migration to take place
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .|."RAGNAROK-BNB-BNB" == 1
  - .|."RAGNAROK-BNB-BUSD-BD1" == 1
  - .|."CONFMULTIPLIERBASISPOINTS" == 50000
  - .|."MAXCONFIRMATIONS" == 10
