{{ template "default-state.yaml" }}
---
{{ template "btc-pool-state.yaml" }}
---
type: state
genesis:
  app_state:
    thorchain:
      store_version: "129"
      node_accounts:
        - active_block_height: "0"
          bond: "5000000000000"
          ip_address: 1.1.1.1
          node_address: {{ addr_thor_dog }}
          bond_address: {{ addr_thor_dog }}
          pub_key_set:
            secp256k1: "tthorpub1addwnpepqfshsq2y6ejy2ysxmq4gj8n8mzuzyulk9wh4n946jv5w2vpwdn2yuyp6sp4"
            ed25519: "tthorpub1zcjduepqfan43w2emjhfv45gspf98squqlnl2rcchc3e4dx7z2nxr27edflsy2e8ql"
          signer_membership: []
          status: Active
          # matches the priv_validator_key.json mounted in the test container
          validator_cons_pub_key: tthorcpub1zcjduepqq75h7uy6qhesh9d3a9tuk0mzrnc46u8rye44ze6peua3zmpfh23q8z37sz
          version: "1.130.0"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/version
asserts:
  - .|.current == "1.130.0"
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/asgard
asserts:
  - .broken == false
---
type: tx-version
version: "1.131.0"
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 2  # need to produce 2 blocks for migration to take place
---
type: check
endpoint: http://localhost:1317/thorchain/version
asserts:
  - .|.current == "1.131.0"
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .[0].in_hash == "03CBF3901E5D1219A0268FCDED3F80F4B9712305BFAAE6445BFE7CF111CE5A1B"
  - .[0].coin.asset == "BTC.BTC"
  - .[0].coin.amount == "99986000"
  - .[0].to_address == "bc1qpfp573lvekn89yjc5jvlcspla4j3yr2hwmj6ga"
---
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 2 }}'
    chain: BTC
    from_address: {{ addr_btc_dog }}
    to_address: "bc1qpfp573lvekn89yjc5jvlcspla4j3yr2hwmj6ga"
    coins:
      - amount: "99986000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10500"
        asset: "BTC.BTC"
    memo: "REFUND:03CBF3901E5D1219A0268FCDED3F80F4B9712305BFAAE6445BFE7CF111CE5A1B"
  block_height: 2
  finalise_height: 2
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/asgard
asserts:
  - .broken == false
