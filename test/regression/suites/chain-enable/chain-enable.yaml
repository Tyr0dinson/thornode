{{ template "default-state.yaml" }}
---
type: create-blocks
count: 1
---
########################################################################################
# baseline: DOT is not served by any active vault, so it is not advertised
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/inbound_addresses
asserts:
  - '[.[]|select(.chain == "DOT")]|length == 0'
  - .|length == 15
---
########################################################################################
# operator intent alone is not enough - without a network fee there is no proof the
# network can actually observe the chain, so nothing is stamped
########################################################################################
type: tx-mimir
key: "EnableDOTChain"
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/thorchain/inbound_addresses
asserts:
  - '[.[]|select(.chain == "DOT")]|length == 0'
  - .|length == 15
---
########################################################################################
# a DOT inbound before activation is no-oped, not credited. The vault's DOT address is
# derivable from its pubkey and reachable long before the chain is advertised, so
# without this an attacker could stamp DOT onto every live vault with one dust tx -
# AddFunds appends the chain as a side effect of crediting.
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: DOT
      from_address: {{ addr_dot_fox }}
      to_address: {{ addr_dot_dog }}
      coins:
        - amount: "5000000"
          asset: "DOT.DOT"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "DOT.DOT"
      memo: "noop"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog_eddsa }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/vault/{{ pubkey_dog }}
asserts:
  - '[(.coins // [])[]|select(.asset=="DOT.DOT")]|length == 0'
  - '[.chains[]|select(. == "DOT")]|length == 0'
---
########################################################################################
# a network fee reaching consensus is the readiness proof: it means a supermajority
# of active nodes independently scanned DOT and agreed a rate
########################################################################################
type: tx-network-fee
signer: {{ addr_thor_dog }}
block_height: 1
chain: DOT
transaction_size: 1000
transaction_rate: 10
---
type: create-blocks
count: 2
---
########################################################################################
# DOT is now stamped onto the live vault and advertised - no churn happened
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/inbound_addresses
asserts:
  - '[.[]|select(.chain == "DOT")]|length == 1'
  # DOT is ed25519, so the address derives from the vault's eddsa key, not its secp key
  - '[.[]|select(.chain == "DOT")][0].pub_key == "{{ pubkey_dog_eddsa }}"'
  - '[.[]|select(.chain == "DOT")][0].address != ""'
  - '[.[]|select(.chain == "DOT")][0].halted == false'
  # the fee that gated activation is also what prices the first outbound
  - '[.[]|select(.chain == "DOT")][0].outbound_tx_size == "1000"'
  - '[.[]|select(.chain == "DOT")][0].observed_fee_rate == "10"'
  - .|length == 16
---
########################################################################################
# the vault itself carries the chain, and its chain set stays sorted so it matches the
# canonical form ConsensusChains produces at keygen
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - '[.[0].chains[]|select(. == "DOT")]|length == 1'
  - '.[0].chains == (.[0].chains|sort)'
---
########################################################################################
# lastblock now reports the chain too
########################################################################################
type: check
endpoint: http://localhost:1317/thorchain/lastblock/DOT
asserts:
  - '.[0].chain == "DOT"'
---
########################################################################################
# end to end: the same inbound that was no-oped before activation is now credited, so
# the chain is actually live and not merely advertised
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: DOT
      from_address: {{ addr_dot_fox }}
      to_address: {{ addr_dot_dog }}
      coins:
        - amount: "5000000"
          asset: "DOT.DOT"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "DOT.DOT"
      memo: "noop"
    block_height: 2
    finalise_height: 2
    observed_pub_key: {{ pubkey_dog_eddsa }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/vault/{{ pubkey_dog }}
asserts:
  - .coins[]|select(.asset=="DOT.DOT")|.amount|tonumber == 5000000
