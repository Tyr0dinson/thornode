{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: state
genesis:
  app_state:
    thorchain:
      mimirs:
        - key: DollarsPerRune
          value: "500000000"
        - key: SolvencyGateInbound-BTC
          value: "1"
---
type: create-blocks
count: 1
---
########################################################################################
# a finalised swap on a solvency-gated chain is credited but not executed
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
- tx:
    id: '{{ observe_txid 1 }}'
    chain: BTC
    from_address: {{ addr_btc_fox }}
    to_address: {{ addr_btc_dog }}
    coins:
      - amount: "5000000"
        asset: "BTC.BTC"
        decimals: 8
    gas:
      - amount: "10000"
        asset: "BTC.BTC"
    memo: "=:THOR.RUNE:{{ addr_thor_fox }}"
  block_height: 5
  finalise_height: 5
  observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/vaults/asgard
asserts:
  - .[0].coins[]|select(.asset == "BTC.BTC")|.amount == "105000000"
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 2500000000000
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset == "100000000"
---
########################################################################################
# a solvency report below the inbound's height does not release it
########################################################################################
type: tx-solvency
signer: {{ addr_thor_dog }}
chain: "BTC"
pub_key: {{ pubkey_dog }}
coins:
  - amount: "105000000"
    asset: "BTC.BTC"
    decimals: 8
Height: 4
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount|tonumber == 2500000000000
---
########################################################################################
# a solvent report at or above the inbound's height releases the swap
########################################################################################
type: tx-solvency
signer: {{ addr_thor_dog }}
chain: "BTC"
pub_key: {{ pubkey_dog }}
coins:
  - amount: "105000000"
    asset: "BTC.BTC"
    decimals: 8
Height: 6
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .["SOLVENCYHALTBTCCHAIN"] == null
---
type: check
endpoint: http://localhost:1317/cosmos/bank/v1beta1/balances/{{ addr_thor_fox }}
asserts:
  - .balances[]|select(.denom == "rune")|.amount|tonumber > 2500000000000
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .balance_asset == "105000000"
