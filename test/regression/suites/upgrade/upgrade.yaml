{{ template "5-validators-btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposals
asserts:
  - .|length == 0
---
type: tx-propose-upgrade
signer: {{ addr_thor_fox }}
name: v0.1.2
upgrade:
  height: 100
  info: "upgrade to version 0.1.2"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/auth/accounts/{{ addr_thor_fox }}
asserts:
  - .result.value.sequence == "1"
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposals
asserts:
  - .|length == 1
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposal/v0.1.2
asserts:
  - .name == "v0.1.2"
  - .height == 100
  - .info == "upgrade to version 0.1.2"
  - .approved == false
  - .approved_percent == "0.2"
  - .validators_to_quorum == 3
---
type: tx-approve-upgrade
signer: {{ addr_thor_cat }}
name: v0.1.2
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposal/v0.1.2
asserts:
  - .approved == false
  - .approved_percent == "0.4"
  - .validators_to_quorum == 2
---
type: check
endpoint: http://localhost:1317/cosmos/upgrade/v1beta1/current_plan
asserts:
- .plan == null
---
type: tx-approve-upgrade
signer: {{ addr_thor_pig }}
name: v0.1.2
---
type: tx-approve-upgrade
signer: {{ addr_thor_frog }}
name: v0.1.2
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposal/v0.1.2
asserts:
  - .approved == true
  - .approved_percent == "0.8"
  - .validators_to_quorum == 0
---
type: check
endpoint: http://localhost:1317/cosmos/upgrade/v1beta1/current_plan
asserts:
- .plan.name == "v0.1.2"
- .plan.info == "upgrade to version 0.1.2"
- .plan.height == "100"
---
# Propose different upgrade to ensure it cannot be scheduled over the current one
type: tx-propose-upgrade
signer: {{ addr_thor_pig }}
name: v0.1.2-expedited
upgrade:
  height: 90
  info: "upgrade to version 0.1.2"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/auth/accounts/{{ addr_thor_pig }}
asserts:
  - .result.value.sequence == "2"
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposals
asserts:
  - .|length == 2
---
type: tx-approve-upgrade
signer: {{ addr_thor_cat }}
name: v0.1.2-expedited
---
type: tx-approve-upgrade
signer: {{ addr_thor_fox }}
name: v0.1.2-expedited
---
# Should fail because v0.1.2 is already approved and scheduled
type: tx-approve-upgrade
signer: {{ addr_thor_frog }}
name: v0.1.2-expedited
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposal/v0.1.2-expedited
asserts:
  - .approved == false
  - .approved_percent == "0.6"
  - .validators_to_quorum == 1
---
# will bring v0.1.2 below quorum, clearing the upgrade
type: tx-reject-upgrade
signer: {{ addr_thor_frog }}
name: v0.1.2
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposal/v0.1.2
asserts:
  - .approved == false
  - .approved_percent == "0.6"
  - .validators_to_quorum == 1
---
# Should succeed now because another upgrade is not scheduled
type: tx-approve-upgrade
signer: {{ addr_thor_frog }}
name: v0.1.2-expedited
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/upgrade_proposal/v0.1.2-expedited
asserts:
  - .approved == true
  - .approved_percent == "0.8"
  - .validators_to_quorum == 0
---
type: check
endpoint: http://localhost:1317/cosmos/upgrade/v1beta1/current_plan
asserts:
- .plan.name == "v0.1.2-expedited"
- .plan.info == "upgrade to version 0.1.2"
- .plan.height == "90"