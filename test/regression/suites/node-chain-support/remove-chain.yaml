{{ template "1-active-validator-state.yaml" }}
---
type: create-blocks
count: 1
---
# Enable chain-aware consensus feature
type: tx-mimir
key: EnableNodeChainConsensus
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# Add BTC chain support
type: tx-add-node-chain-support
signer: {{ addr_thor_dog }}
chain: "BTC"
---
type: create-blocks
count: 1
---
# Add ETH chain support
type: tx-add-node-chain-support
signer: {{ addr_thor_dog }}
chain: "ETH"
---
type: create-blocks
count: 1
---
# Add AVAX chain support
type: tx-add-node-chain-support
signer: {{ addr_thor_dog }}
chain: "AVAX"
---
type: create-blocks
count: 1
---
# Verify all three chains are present
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .supported_chains|length == 3
  - .supported_chains|contains(["BTC"])
  - .supported_chains|contains(["ETH"])
  - .supported_chains|contains(["AVAX"])
---
# Remove BTC chain support
type: tx-remove-node-chain-support
signer: {{ addr_thor_dog }}
chain: "BTC"
---
type: create-blocks
count: 1
---
# Verify BTC was removed but ETH and AVAX remain
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .supported_chains|length == 2
  - .supported_chains|contains(["BTC"]) | not
  - .supported_chains|contains(["ETH"])
  - .supported_chains|contains(["AVAX"])
---
# Remove ETH chain support
type: tx-remove-node-chain-support
signer: {{ addr_thor_dog }}
chain: "ETH"
---
type: create-blocks
count: 1
---
# Verify only AVAX remains
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .supported_chains|length == 1
  - .supported_chains[0] == "AVAX"
