value: 1 # 0.0001%
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pol
asserts:
  - .current_deposit|tonumber == 101316383299
  - .rune_deposited|tonumber == 101324859897
  - .rune_withdrawn|tonumber == 8476598
---
type: tx-mimir
key: POLMaxPoolMovement
value: 500000 # 50%
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 2
---
