# Clear existing vaults before including this six-validator fixture.
type: state
genesis:
  app_state:
    thorchain:
      vaults:
        - block_height: "0"
          chains: [THOR, DASH, ETH]
          coins:
            - asset: DASH.DASH
              amount: "10000000000"
              decimals: "8"
            - asset: ETH.ETH
              amount: "1000000000"
              decimals: "8"
          inbound_tx_count: "2"
          membership:
            - {{ pubkey_cat }}
            - {{ pubkey_fox }}
            - {{ pubkey_pig }}
            - {{ pubkey_frog }}
            - {{ pubkey_goat }}
            - {{ pubkey_hawk }}
          pub_key: {{ pubkey_dog }}
          status: ActiveVault
          type: AsgardVault
