# Two ETH asgards, both signed by dog. The dog vault holds 15 ETH and the USDC;
# the cat vault holds 5 ETH and no tokens. cat owns all LP units, so a 60%
# withdraw asks for a 12 ETH outbound. It pays out to fox, because an outbound
# to a vault's own address is never sent from that vault.
# ETH MaxGas is 960000 (80 gwei x 80000 x 1.5).
type: state
genesis:
  app_state:
    bank:
      balances:
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "300000000000"
              denom: rune
    thorchain:
      liquidity_providers:
        - asset: ETH.ETH
          asset_address: {{ addr_eth_fox }}
          asset_deposit_value: "2000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "200000000000"
          units: "200000000000"
        - asset: ETH.USDC-0X9999999999999999999999999999999999999999
          asset_address: {{ addr_eth_fox }}
          asset_deposit_value: "100000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
      pools:
        - LP_units: "200000000000"
          asset: ETH.ETH
          balance_asset: "2000000000"
          balance_rune: "200000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
        - LP_units: "100000000000"
          asset: ETH.USDC-0X9999999999999999999999999999999999999999
          balance_asset: "100000000000"
          balance_rune: "100000000000"
          decimals: "6"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
      network_fees:
        - chain: ETH
          transaction_fee_rate: "80"
          transaction_size: "80000"
      vaults:
        - block_height: "0"
          chains:
            - THOR
            - ETH
          coins:
            - amount: "1500000000"
              asset: ETH.ETH
              decimals: "8"
            - amount: "100000000000"
              asset: ETH.USDC-0X9999999999999999999999999999999999999999
              decimals: "6"
          inbound_tx_count: "1"
          membership:
            - {{ pubkey_dog }}
          pub_key: {{ pubkey_dog }}
          status: ActiveVault
          type: AsgardVault
        - block_height: "0"
          chains:
            - THOR
            - ETH
          coins:
            - amount: "500000000"
              asset: ETH.ETH
              decimals: "8"
          inbound_tx_count: "1"
          membership:
            - {{ pubkey_dog }}
          pub_key: {{ pubkey_cat }}
          status: ActiveVault
          type: AsgardVault
