syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/x/thorchain/types";
option (gogoproto.goproto_stringer_all) = false;
option (gogoproto.stringer_all)         = false;
option (gogoproto.goproto_getters_all) = false;
  
import "thorchain/v1/common/common.proto";
import "gogoproto/gogo.proto";

enum ColdStatus {
  option (gogoproto.goproto_enum_stringer) = true;
  UnknownColdStatus = 0;
  DisabledColdStatus = 1;
  StandbyColdStatus = 2;
  ActiveColdStatus = 3;
}

enum ColdInterest {
  option (gogoproto.goproto_enum_stringer) = true;
  ColdUnknownInterest = 0;
  ColdPositiveInterest = 1;
  ColdNegativeInterest = 2;
}

message ColdAccount {
  bytes operator = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  common.Asset asset = 2 [(gogoproto.nullable) = false];
  string pub_key = 3 [(gogoproto.casttype) = "gitlab.com/thorchain/thornode/common.PubKey"];
  ColdStatus status = 4;
  int64 status_since = 5;
  string bond = 6 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Uint", (gogoproto.nullable) = false];
  int64 collateralization_ratio = 7;
  string pending_asset = 8 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Uint", (gogoproto.nullable) = false];
  ColdInterest interest = 9;
}
