syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/x/thorchain/types";

import "thorchain/v1/common/common.proto";
import "gogoproto/gogo.proto";

message ObservedTx {
  common.Tx tx = 1 [(gogoproto.nullable) = false];
  enum Status {
    incomplete = 0;
    done = 1;
    reverted = 2;
  }
  Status status = 2;
  repeated string out_hashes = 3 [(gogoproto.castrepeated) = "gitlab.com/thorchain/thornode/common.TxID"];
  int64 block_height = 4;
  repeated bytes signers = 5 [(gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  bytes observed_pub_key = 6 [(gogoproto.casttype) = "gitlab.com/thorchain/thornode/common.PubKey"];
  int64 keysign_ms = 7;
  int64 finalise_height = 8;
}
