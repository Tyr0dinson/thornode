syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/x/thorchain/types";

import "thorchain/v1/common/common.proto";
import "gogoproto/gogo.proto";

enum CompositeType {
  Static = 0;
  Dynamic = 1;
}

message Composite {
  string id = 1;
  string name = 2;
  CompositeType type = 3;
  repeated common.Coin holdings = 4 [(gogoproto.castrepeated) = "gitlab.com/thorchain/thornode/common.Coins", (gogoproto.nullable) = false];
}
