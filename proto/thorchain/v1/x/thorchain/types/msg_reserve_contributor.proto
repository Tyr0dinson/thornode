syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/x/thorchain/types";

import "thorchain/v1/common/common.proto";
import "gogoproto/gogo.proto";

message ReserveContributor {
  string address = 1 [(gogoproto.casttype) = "gitlab.com/thorchain/thornode/common.Address"];
  string amount = 2 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Uint", (gogoproto.nullable) = false];
}

message MsgReserveContributor {
  common.Tx tx = 1 [(gogoproto.nullable) = false];
  ReserveContributor contributor = 2 [(gogoproto.nullable) = false];
  bytes signer = 3  [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
}
