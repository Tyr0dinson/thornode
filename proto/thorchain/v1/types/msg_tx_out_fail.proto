syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "amino/amino.proto";
import "common/common.proto";
import "gogoproto/gogo.proto";

message MsgTxOutFail {
  option (amino.name) = "thorchain/TxOutFail";

  int64 height = 1;
  uint64 index = 2;

  // The inbound hash the outbound is paired with. Included to guard against
  // accidental mismatches when multiple items exist at the same height.
  string in_hash = 3 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "InHash"
  ];

  bool fatal = 4;
  string fail_reason = 5;

  bytes signer = 6 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

