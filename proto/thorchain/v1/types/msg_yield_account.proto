syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";

message MsgYieldAccountDeposit {
  common.Tx tx = 1 [(gogoproto.nullable) = false];
  string account_address = 2 [(gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.Address"];;
  common.Asset account_asset = 3 [(gogoproto.nullable) = false, (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"];
  string deposit_amount = 4 [(gogoproto.customtype) = "cosmossdk.io/math.Uint", (gogoproto.nullable) = false];
  bytes signer = 5  [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
}
