syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "types/type_export_ledger.proto";
import "gogoproto/gogo.proto";

option (gogoproto.marshaler_all) = true;

message QueryExportLedgerRequest{
  string asset = 1;
}

message QueryExportLedgerResponse{
  types.ExportLedger export = 1;
}

message QueryExportLedgersRequest{
  string asset = 1;
}

message QueryExportLedgersResponse{
  repeated types.ExportLedger exports = 1;
}
