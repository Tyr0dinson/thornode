syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";
import "amino/amino.proto";

message MsgRegisterMemo {
  option (amino.name) = "thorchain/MsgRegisterMemo";

  string memo = 1;
  string chain_id = 2;
  bytes signer = 3 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress", (amino.encoding) = "bech32"];
  string reference = 4; // User must provide 5-digit reference
}

message RegisteredMemo {
  string reference = 1;
  string memo = 2;
  int64 registered_at = 3;
  int64 expires_at = 4;
  string chain_id = 5;
  string status = 6;
  bytes signer = 7 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress", (amino.encoding) = "bech32"];
}
