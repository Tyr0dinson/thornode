syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";
import "amino/amino.proto";

message MsgRegisterMemo {
  option (amino.name) = "thorchain/MsgRegisterMemo";

  string memo = 1;
  int64 ttl = 2;
  string chain_id = 3;
  bytes signer = 4 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress", (amino.encoding) = "bech32"];
  
  // Memoless reference validation fields for precision and routing support:
  string amount = 5;           // For precision validation
  string destination = 6;      // For refund validation
  bool force_collision = 7;    // For collision testing
  repeated string tags = 8;    // For metadata/debugging
}

message RegisteredMemo {
  string reference = 1;
  string memo = 2;
  int64 registered_at = 3;
  int64 expires_at = 4;
  string chain_id = 5;
  string status = 6;
  bytes signer = 7 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress", (amino.encoding) = "bech32"];
}

message MemoCounter {
  string chain_id = 1;
  int64 counter = 2;
}