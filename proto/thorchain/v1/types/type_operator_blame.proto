syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";

// OperatorBlameRecord tracks blame statistics for a node operator
message OperatorBlameRecord {
  bytes operator_address = 1 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"
  ];
  int64 keygen_blame_count_total = 2;         // Total keygen blames (lifetime)
  int64 keysign_blame_count_total = 3;        // Total keysign blames (lifetime)
  int64 keygen_blame_count_since_churn = 4;   // Keygen blames since last successful keygen
  int64 keysign_blame_count_since_churn = 5;  // Keysign blames since last successful keygen
}
