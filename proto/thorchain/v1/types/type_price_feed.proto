syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "amino/amino.proto";
import "gogoproto/gogo.proto";

message PriceFeed {
  bytes node = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress", (amino.encoding) = "bech32"];
  int64 height = 2;
  string rates = 3;
}
