syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";
import "types/type_intent.proto";

option (gogoproto.marshaler_all) = true;

// QueryIntentRequest is the request type for querying a specific intent by transaction ID
message QueryIntentRequest {
  string tx_id = 1;
}

// QueryIntentResponse is the response type for a specific intent query
message QueryIntentResponse {
  Intent intent = 1 [ (gogoproto.nullable) = false ];
  repeated IntentSolve solves = 2 [ (gogoproto.nullable) = false ];
}

// QueryActiveIntentsRequest is the request type for querying all active intents
message QueryActiveIntentsRequest {}

// IntentWithSolves wraps an Intent with its associated solve bids
message IntentWithSolves {
  Intent intent = 1 [ (gogoproto.nullable) = false ];
  repeated IntentSolve solves = 2 [ (gogoproto.nullable) = false ];
}

// QueryActiveIntentsResponse is the response type for active intents query
message QueryActiveIntentsResponse {
  repeated IntentWithSolves intents = 1 [ (gogoproto.nullable) = false ];
}
