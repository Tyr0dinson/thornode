syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";

enum IntentStatus {
  IntentActive = 0;
  IntentCancelled = 1;
  IntentCompleted = 2;
  IntentExpired = 3;
  IntentAuctioning = 4;
}

enum IntentAuctionStatus {
  AuctionActive = 0;
  AuctionCompleted = 1;
  AuctionCancelled = 2;
}

message Intent {
  string tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "TxID"
  ];
  common.Coin source = 2 [ (gogoproto.nullable) = false ];
  string source_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  common.Asset target_asset = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"
  ];
  string target_address = 5
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  string high_target = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string low_target = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  int64 create_height = 9;
  int64 expiry_height = 10;
  IntentStatus status = 11;
  int64 min_fee_basis_points = 12;
  string affiliate_address = 13
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  int64 affiliate_basis_points = 14;
}

message IntentSolve {
  string solve_tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "SolveTxID"
  ];
  string intent_tx_id = 2 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  string solver_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  common.Coin target_coin = 4 [ (gogoproto.nullable) = false ];
  int64 submit_height = 6;
  int64 match_height = 7;
  // destination_address is where the solver wants to receive the intent's
  // source asset This allows cross-chain solving where the solver sends from
  // one chain and receives on another
  string destination_address = 8
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
}

message IntentSolveIndex {
  repeated string solve_tx_ids = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "SolveTxIDs"
  ];
}

message ActiveIntentIndex {
  repeated string active_intent_tx_ids = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "ActiveIntentTxIDs"
  ];
}

// IntentAuction represents an auction for an expired intent
message IntentAuction {
  string intent_tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  common.Coin auction_amount = 2 [ (gogoproto.nullable) = false ];
  common.Coin remaining_amount = 3 [ (gogoproto.nullable) = false ];
  common.Asset bid_asset = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"
  ];
  string min_bid = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  int64 start_height = 6;
  int64 expiry_height = 7;
  IntentAuctionStatus status = 8;
  string owner_address = 9
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  string winning_bid_tx_id = 10 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "WinningBidTxID"
  ];
  int64 original_expiry_height = 11;
}

// IntentAuctionBid represents a bid on an intent auction
message IntentAuctionBid {
  string bid_tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "BidTxID"
  ];
  string intent_tx_id = 2 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  string bidder_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  common.Coin bid_amount = 4 [ (gogoproto.nullable) = false ];
  int64 submit_height = 5;
}

// IntentAuctionBidIndex stores list of bid TxIDs for an auction
message IntentAuctionBidIndex {
  repeated string bid_tx_ids = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "BidTxIDs"
  ];
}

// ActiveAuctionIndex stores all active auction intent TxIDs
message ActiveAuctionIndex {
  repeated string active_auction_tx_ids = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "ActiveAuctionTxIDs"
  ];
}
