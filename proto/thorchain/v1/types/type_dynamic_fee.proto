syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";

message DynamicFeeEpochRecord {
  uint64 epoch = 1;
  string volume_tor = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string fees_tor = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  uint64 bps_at_close = 4;
  uint64 swap_count = 5;
  string pool_volume_tor = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  // own_pool_volume_tor is this thorname's own share of pool_volume_tor (its
  // swaps' volume, per leg). The signal divides by the rest of the pool's
  // volume, pool_volume_tor - own_pool_volume_tor.
  string own_pool_volume_tor = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
}

message DynamicFeeRecord {
  string thorname = 1;
  string pair_asset_a = 2;
  string pair_asset_b = 3;
  uint64 dynamic_bps = 4;
  uint64 last_active_epoch = 5;
  repeated DynamicFeeEpochRecord history = 6 [ (gogoproto.nullable) = false ];
  // search_done is false while the bracket search is still testing bps values
  // and true once it has converged and handed off to the +/-step controller.
  // The zero value is deliberate: a record written before the search existed
  // starts a search from its current dynamic_bps.
  bool search_done = 7;
  // probes holds one entry per bps value tested by the current search.
  repeated DynamicFeeProbe probes = 8 [ (gogoproto.nullable) = false ];
}

// DynamicFeeProbe is the measured fee signal at one tested bps value.
message DynamicFeeProbe {
  uint64 bps = 1;
  // Sum of the normalized fee signal over the sealed epochs measured at bps.
  string signal_sum = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  uint64 epochs = 3;
  // Sum of the squared per-epoch signals, for the epoch-to-epoch spread.
  string signal_sq_sum = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
}

message DynamicFeeAccumulator {
  string thorname = 1;
  string pair_asset_a = 2;
  string pair_asset_b = 3;
  string volume_tor = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string fees_tor = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  uint64 swap_count = 6;
  string pool_volume_tor = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string own_pool_volume_tor = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  // pairs lists the L1 pairs ("ASSETA|ASSETB") a global-mode accumulator has
  // been credited on. Its pool volume is summed over these pairs only.
  repeated string pairs = 9;
}

// DynamicFeePoolAccumulator tracks total swap volume across a pair (pool) for
// the in-progress epoch, regardless of affiliate. It is the denominator that
// normalizes each thorname's fee signal against market-wide activity.
message DynamicFeePoolAccumulator {
  string pair_asset_a = 1;
  string pair_asset_b = 2;
  string volume_tor = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
}
