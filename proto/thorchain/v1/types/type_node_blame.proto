syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";

// NodeBlameRecord tracks blame statistics for a node
message NodeBlameRecord {
  bytes node_address = 1
      [ (gogoproto.casttype) =
            "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
  int64 keygen_blame_count_total = 2;  // Total keygen blames (lifetime)
  int64 keysign_blame_count_total = 3; // Total keysign blames (lifetime)
  // Keygen blames since the last reset: success of a regular Asgard keygen
  // the node is a member of, or completion of a regular churn (all nodes).
  int64 keygen_blame_count_since_churn = 4;
  // Keysign blames since the last reset: success of a regular Asgard keygen
  // the node is a member of, or completion of a regular churn (all nodes).
  int64 keysign_blame_count_since_churn = 5;
}
