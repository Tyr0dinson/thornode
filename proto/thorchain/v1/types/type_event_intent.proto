syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";

message EventIntentOpen {
  string tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "TxID"
  ];
  common.Coin source = 2 [ (gogoproto.nullable) = false ];
  string source_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  common.Asset target_asset = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"
  ];
  string target_address = 5
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  string high_target = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string low_target = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  int64 expiry_height = 8;
  int64 min_fee_basis_points = 9;
}

message EventIntentCancel {
  string tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "TxID"
  ];
  common.Coin refund = 2 [ (gogoproto.nullable) = false ];
  string refund_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  bool abandoned = 4;
}

message EventIntentSolve {
  string solve_tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "SolveTxID"
  ];
  string intent_tx_id = 2 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  string solver_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  string target_amount_offered = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  int64 match_height = 5;
}

message EventIntentComplete {
  string intent_tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  string solve_tx_id = 2 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "SolveTxID"
  ];
  common.Coin source_sent = 3 [ (gogoproto.nullable) = false ];
  common.Coin target_received = 4 [ (gogoproto.nullable) = false ];
  common.Coin fee = 5 [ (gogoproto.nullable) = false ];
}

message EventIntentExpire {
  string tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "TxID"
  ];
  common.Coin refund = 2 [ (gogoproto.nullable) = false ];
  string refund_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  bool abandoned = 4;
}
