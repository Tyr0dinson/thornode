syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";
import "types/type_operator_blame.proto";

option (gogoproto.marshaler_all) = true;

message QueryOperatorBlameRequest {
  string address = 1;
  string height = 2;
}

message QueryOperatorBlameResponse {
  bytes operator_address = 1 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (gogoproto.jsontag) = "operator_address"
  ];
  int64 keygen_blame_count_total = 2 [ (gogoproto.jsontag) = "keygen_blame_count_total" ];
  int64 keysign_blame_count_total = 3 [ (gogoproto.jsontag) = "keysign_blame_count_total" ];
  int64 keygen_blame_count_since_churn = 4 [ (gogoproto.jsontag) = "keygen_blame_count_since_churn" ];
  int64 keysign_blame_count_since_churn = 5 [ (gogoproto.jsontag) = "keysign_blame_count_since_churn" ];
}

message QueryOperatorBlamesRequest {
  string height = 1;
}

message QueryOperatorBlamesResponse {
  repeated QueryOperatorBlameResponse blames = 1;
}
