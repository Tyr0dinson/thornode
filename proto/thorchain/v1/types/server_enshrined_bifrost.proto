syntax = "proto3";
package types;

import "types/msg_observed_txin_quorum.proto";

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/enshrined_bifrost";

// Create service with RPC method to send tx in quorum to thorchain
service EnshrinedBifrost {
    rpc TxInQuorum(MsgObservedTxInQuorum) returns (TxInQuorumResult);
}

// TxInQuorumResult is the return type for all current Msg Server messages
message TxInQuorumResult {}