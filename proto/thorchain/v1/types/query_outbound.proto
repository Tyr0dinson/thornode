syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";
import "common/common.proto";

option (gogoproto.marshaler_all) = true;

message QueryScheduledOutboundRequest { string height = 1; }

message QueryPendingOutboundRequest { string height = 1; }

message QueryStagedOutboundRequest {}

message QueryOutboundResponse { repeated QueryTxOutItem tx_out_items = 1; }

message QueryStagedOutboundResponse {
  repeated QueryStagedOutboundItem staged_outbound_items = 1;
}

// StagedOutboundItem contains a TxOutItem plus scheduling info for mempool swap
// outputs
message QueryStagedOutboundItem {
  QueryTxOutItem tx_out_item = 1;
  int64 scheduled_height =
      2; // Pre-computed target height (delay countdown starts at staging)
  int64 staged_height = 3; // Block height when this outbound was staged
}

// Fields are rearranged for querier response readability while preserving their
// field numbers.
message QueryTxOutItem {
  int64 height = 10;
  string vault_pub_key = 3;
  string in_hash = 8;
  string out_hash = 9;
  string chain = 1 [ (gogoproto.jsontag) = "chain" ];
  string to_address = 2 [ (gogoproto.jsontag) = "to_address" ];
  common.Coin coin = 4 [ (gogoproto.jsontag) = "coin" ];
  repeated common.Coin max_gas = 6 [
    (gogoproto.castrepeated) = "gitlab.com/thorchain/thornode/v3/common.Gas",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "max_gas"
  ];
  int64 gas_rate = 7;
  string memo = 5;
  string original_memo = 16;
  string aggregator = 12;
  string aggregator_target_asset = 13;
  string aggregator_target_limit = 14;
  // clout spent in RUNE for the outbound
  string clout_spent = 11;
  string vault_pub_key_eddsa = 15;
  string vault_pub_key_frost = 17;
  // whether the inbound transaction has been finalized (for mempool swap
  // optimization)
  bool inbound_finalized = 18 [ (gogoproto.jsontag) = "inbound_finalized" ];
}
