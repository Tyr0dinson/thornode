syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";
option (gogoproto.goproto_stringer_all) = false;
option (gogoproto.stringer_all) = false;
option (gogoproto.goproto_getters_all) = false;

import "common/common.proto";
import "types/type_tx_out.proto";
import "gogoproto/gogo.proto";

message ObservedTxVoter {
  string tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "TxID"
  ];
  common.ObservedTx tx = 2 [ (gogoproto.nullable) = false ];
  int64 height = 3;
  repeated common.ObservedTx txs = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) =
        "gitlab.com/thorchain/thornode/v3/common.ObservedTxs"
  ];
  repeated TxOutItem actions = 5 [ (gogoproto.nullable) = false ];
  repeated common.Tx out_txs = 6 [
    (gogoproto.castrepeated) = "gitlab.com/thorchain/thornode/v3/common.Txs",
    (gogoproto.nullable) = false
  ];
  int64 finalised_height = 7;
  bool updated_vault = 8;
  bool reverted = 9;
  int64 outbound_height = 10;
  int64 unfinalized_height = 11;
  // Nodes spared LackOfObservationPenalty at non-final consensus, or refunded
  // it within its flex window, because they observed the tx in the final tier.
  // Cleared at final consensus.
  repeated string excused_observers = 16;
  // latest_votes records, per signer, which entry of txs that signer filed most
  // recently at each finality level. An entry keeps the signatures it once held
  // forever, so without this a verdict the network has moved off of could be
  // tipped back over the supermajority line by a handful of nodes that never
  // observed it, and the vault's coin accounting oscillated at will. Both
  // consensus formation (GetTx/HasConsensus/HasFinalised) and the outbound
  // correction quorum count only each signer's current vote. Only AddLatest
  // (outbound observations) writes it, and only once a signer has signed a
  // second entry at a finality level, so inbound (Add-only) voters never
  // populate it and their consensus is unchanged.
  repeated ObservedTxVote latest_votes = 13 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "latest_votes,omitempty"
  ];
  // bounce_credit_floor is the highest external height of a Bounced verdict
  // that a correction to delivered has superseded. A later correction back to
  // Bounced (crediting the coins again) must be at a strictly greater height:
  // otherwise the superseded receipt's own late-sent attestations, from nodes
  // that had not yet filed it, could re-credit coins that left the vault once a
  // lower-height delivery had lowered the consensus height.
  int64 bounce_credit_floor = 15;
}

// ObservedTxVote is one signer's most recent observation of an outbound at one
// finality level, as an index into ObservedTxVoter.txs (which is append-only).
message ObservedTxVote {
  string signer = 1;
  int64 tx_index = 2;
}
