syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";
option (gogoproto.goproto_stringer_all) = false;
option (gogoproto.stringer_all) = false;
option (gogoproto.goproto_getters_all) = false;

import "common/common.proto";
import "types/type_tx_out.proto";
import "gogoproto/gogo.proto";

message ObservedTxVoter {
  string tx_id = 1 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "TxID"
  ];
  common.ObservedTx tx = 2 [ (gogoproto.nullable) = false ];
  int64 height = 3;
  repeated common.ObservedTx txs = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) =
        "gitlab.com/thorchain/thornode/v3/common.ObservedTxs"
  ];
  repeated TxOutItem actions = 5 [ (gogoproto.nullable) = false ];
  repeated common.Tx out_txs = 6 [
    (gogoproto.castrepeated) = "gitlab.com/thorchain/thornode/v3/common.Txs",
    (gogoproto.nullable) = false
  ];
  int64 finalised_height = 7;
  bool updated_vault = 8;
  bool reverted = 9;
  int64 outbound_height = 10;
  int64 unfinalized_height = 11;
  // Nodes spared LackOfObservationPenalty at non-final consensus, or refunded
  // it within its flex window, because they observed the tx in the final tier.
  // Cleared at final consensus.
  repeated string excused_observers = 16;
  // bounce_superseded records every consensus payload that a correction has
  // already moved away from, at the finality level it held. Attestations carry
  // no nonce and a superseded payload keeps its signers forever, so without
  // this a handful of nodes that never observed it could tip a stale payload
  // back over the supermajority line and oscillate the vault's coin accounting
  // at will. A correction is refused when its target is one of these; a
  // genuinely new observation (a reorg's new receipt differs in at least gas)
  // is a different payload and carries no stale signers, so it still applies.
  repeated common.ObservedTx bounce_superseded = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) =
        "gitlab.com/thorchain/thornode/v3/common.ObservedTxs"
  ];
}
