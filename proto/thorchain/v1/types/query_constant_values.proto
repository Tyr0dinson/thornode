syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";
import "types/type_block_time.proto";

option (gogoproto.marshaler_all) = true;

message QueryConstantValuesRequest { string height = 1; }

message QueryConstantValuesResponse {
  repeated Int64Constants int_64_values = 1;
  repeated BoolConstants bool_values = 2;
  repeated StringConstants string_values = 3;
  // the effective block time in milliseconds that the block-denominated
  // int_64_values are scaled to
  int64 block_time_ms = 4;
  // every change of the effective block time, oldest first; empty while it
  // never changed. With it, an outbound's age can be measured in wall-clock
  // time across changes, as THORNode does to reschedule it.
  repeated BlockTimeSegment block_time_history = 5
      [ (gogoproto.nullable) = false ];
}

message Int64Constants {
  string name = 1;
  int64 value = 2;
}

message BoolConstants {
  string name = 1;
  bool value = 2;
}

message StringConstants {
  string name = 1;
  string value = 2;
}
