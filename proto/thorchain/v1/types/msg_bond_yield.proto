syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";

message MsgBondYield {
  common.Tx tx_in = 1 [ (gogoproto.nullable) = false ];
  bytes node_address = 2
      [ (gogoproto.casttype) =
            "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
  string amount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  bool auto_claim = 4;
  uint64 auto_claim_bps = 5;
  common.Asset payout_asset = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"
  ];
  string payout_address = 7
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  bytes signer = 8 [ (gogoproto.casttype) =
                         "github.com/cosmos/cosmos-sdk/types.AccAddress" ];
}
