syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";

option (gogoproto.marshaler_all) = true;

message QueryAddrPubKeyRequest {
  string address = 1;
  string height = 2;
}

message QueryAddrPubKeyResponse {
  string pubkey = 1;
  bool found = 2;
}
