syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";
import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";

message MsgIntentOpen {
  option (amino.name) = "thorchain/MsgIntentOpen";
  option (cosmos.msg.v1.signer) = "signer";

  common.Tx tx = 1 [ (gogoproto.nullable) = false ];
  common.Asset target_asset = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"
  ];
  string target_address = 3
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  string high_target = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string low_target = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string affiliate_address = 6
      [ (gogoproto.casttype) =
            "gitlab.com/thorchain/thornode/v3/common.Address" ];
  string affiliate_basis_points = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  bytes signer = 8 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgIntentCancel {
  option (amino.name) = "thorchain/MsgIntentCancel";
  option (cosmos.msg.v1.signer) = "signer";

  common.Tx tx = 1 [ (gogoproto.nullable) = false ];
  string intent_tx_id = 2 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}

message MsgIntentSolve {
  option (amino.name) = "thorchain/MsgIntentSolve";
  option (cosmos.msg.v1.signer) = "signer";

  common.Tx tx = 1 [ (gogoproto.nullable) = false ];
  string intent_tx_id = 2 [
    (gogoproto.casttype) = "gitlab.com/thorchain/thornode/v3/common.TxID",
    (gogoproto.customname) = "IntentTxID"
  ];
  bytes signer = 3 [
    (gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress",
    (amino.encoding) = "bech32"
  ];
}
