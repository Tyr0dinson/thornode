syntax = "proto3";
package denom;

import "gogoproto/gogo.proto";

option go_package = "gitlab.com/thorchain/thornode/x/denom/types";

// GenesisState defines the denom module's genesis state.
message GenesisState {
  repeated GenesisDenom custom_denoms = 1 [
    (gogoproto.moretags) = "yaml:\"custom_denoms\"",
    (gogoproto.nullable) = false
  ];

  // whitelisted accounts that do not require paying creation fees
  repeated string no_fee_accounts = 3;
}

message GenesisDenom {
  option (gogoproto.equal) = true;

  string denom = 1 [ (gogoproto.moretags) = "yaml:\"denom\"" ];
  string admin = 2 [ (gogoproto.moretags) = "yaml:\"admin\"" ];
}