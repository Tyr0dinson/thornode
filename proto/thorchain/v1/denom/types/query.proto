syntax = "proto3";
package denom;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";

option go_package = "gitlab.com/thorchain/thornode/x/denom/types";

// Query defines the gRPC querier service.
service Query {
  rpc DenomAdmin(QueryDenomAdminRequest)
      returns (QueryDenomAdminResponse) {
    option (google.api.http).get =
        "/denoms/{denom}/admin";
  }

  rpc DenomsFromCreator(QueryDenomsFromCreatorRequest)
      returns (QueryDenomsFromCreatorResponse) {
    option (google.api.http).get =
        "/denoms/by_creator/{creator}";
  }
}

message QueryDenomAdminRequest {
  string denom = 1 [ (gogoproto.moretags) = "yaml:\"denom\"" ];
}
message QueryDenomAdminResponse {
  string admin = 1 [ (gogoproto.moretags) = "yaml:\"denom\"" ];
}

message QueryDenomsFromCreatorRequest {
  string creator = 1 [ (gogoproto.moretags) = "yaml:\"creator\"" ];
}
message QueryDenomsFromCreatorResponse {
  repeated string denoms = 1 [ (gogoproto.moretags) = "yaml:\"denoms\"" ];
}
