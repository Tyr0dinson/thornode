[package]
name = "xmr-frost-signer"
version = "0.1.0"
edition = "2021"
description = "FROST threshold signing sidecar for THORNode Monero integration"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# Monero/FROST ecosystem (serai)
# NOTE: The serai ecosystem crates are not fully published to crates.io.
# We use the mirror crates which track the serai repo releases.
# When serai publishes official crates, switch to those.
# For now, we define traits and types that match the serai API surface
# and leave the actual crypto implementation behind feature flags.

# Web server
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
bech32 = "0.9"

# Serai FROST/DKG ecosystem (local path to serai checkout)
dkg-pedpop = { path = "../../serai/crypto/dkg/pedpop" }
dalek-ff-group = { path = "../../serai/crypto/dalek-ff-group" }
ciphersuite = { path = "../../serai/crypto/ciphersuite", features = ["std"] }
modular-frost = { version = "0.10.1", features = ["ed25519"] }

# Monero wallet + RPC stack (monero-oxide, pinned for deterministic compatibility)
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide", rev = "32e6b5fe5ba9e1ea3e68da882550005122a11d22", package = "monero-wallet", features = ["std", "multisig", "compile-time-generators"] }
monero-simple-request-rpc = { git = "https://github.com/monero-oxide/monero-oxide", rev = "32e6b5fe5ba9e1ea3e68da882550005122a11d22", package = "monero-simple-request-rpc" }

# Crypto
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
argon2 = "0.5"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Storage
sled = "0.34"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client (for daemon RPC)
reqwest = { version = "0.12", features = ["json"] }

# Async
futures = "0.3"

# Misc
dashmap = "6"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
axum-test = "16"
tempfile = "3"

[patch.crates-io]
simple-request = { path = "../../serai/common/request" }
