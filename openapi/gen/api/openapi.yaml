openapi: 3.0.0
info:
  contact:
    email: devs@thorchain.org
  description: Thornode REST API.
  title: Thornode API
  version: 1.98.0
servers:
- url: /
paths:
  /thorchain/ping:
    get:
      operationId: ping
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
          description: OK
      tags:
      - Health
  /thorchain/pool/{asset}:
    get:
      description: Returns the pool information for the provided asset.
      operationId: pool
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: asset
        required: true
        schema:
          example: BTC.BTC
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolResponse'
          description: OK
      tags:
      - Pools
  /thorchain/pools:
    get:
      description: Returns the pool information for all assets.
      operationId: pools
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolsResponse'
          description: OK
      tags:
      - Pools
  /thorchain/bucket/{asset}:
    get:
      description: Returns the bucket information for the provided asset.
      operationId: bucket
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: asset
        required: true
        schema:
          example: BTC.BTC
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketResponse'
          description: OK
      tags:
      - Buckets
  /thorchain/buckets:
    get:
      description: Returns the bucket information for all assets.
      operationId: buckets
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketsResponse'
          description: OK
      tags:
      - Buckets
  /thorchain/pool/{asset}/liquidity_provider/{address}:
    get:
      description: Returns the liquidity provider information for an address and asset.
      operationId: liquidityProvider
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: asset
        required: true
        schema:
          example: BTC.BTC
          type: string
        style: simple
      - explode: false
        in: path
        name: address
        required: true
        schema:
          example: thor1zupk5lmc84r2dh738a9g3zscavannjy3nzplwt
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityProviderResponse'
          description: OK
      tags:
      - Liquidity Providers
  /thorchain/pool/{asset}/liquidity_providers:
    get:
      description: Returns all liquidity provider information for an asset.
      operationId: liquidityProviders
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: asset
        required: true
        schema:
          example: BTC.BTC
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityProviderResponse'
          description: OK
      tags:
      - Liquidity Providers
  /thorchain/tx/{hash}:
    get:
      description: Returns the observed transaction for a provided inbound or outbound
        hash.
      operationId: tx
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: hash
        required: true
        schema:
          example: CF524818D42B63D25BBA0CCC4909F127CAA645C0F9CD07324F2824CC151A64C7
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxResponse'
          description: OK
      tags:
      - Transactions
  /thorchain/tx/{hash}/signers:
    get:
      description: Returns the signers for a provided inbound or outbound hash.
      operationId: txSigners
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: hash
        required: true
        schema:
          example: CF524818D42B63D25BBA0CCC4909F127CAA645C0F9CD07324F2824CC151A64C7
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxSignersResponse'
          description: OK
      tags:
      - Transactions
  /thorchain/node/{address}:
    get:
      description: Returns node information for the provided node address.
      operationId: node
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: address
        required: true
        schema:
          example: thor1zupk5lmc84r2dh738a9g3zscavannjy3nzplwt
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
          description: OK
      tags:
      - Nodes
  /thorchain/nodes:
    get:
      description: Returns node information for all registered validators.
      operationId: nodes
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodesResponse'
          description: OK
      tags:
      - Nodes
  /thorchain/vaults/asgard:
    get:
      description: Returns current asgard vaults.
      operationId: asgard
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultsResponse'
          description: OK
      tags:
      - Vaults
  /thorchain/vaults/yggdrasil:
    get:
      description: Returns current yggdrasil vaults.
      operationId: yggdrasil
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultsResponse'
          description: OK
      tags:
      - Vaults
  /thorchain/vaults/{pubkey}:
    get:
      description: Returns the vault for the provided pubkey.
      operationId: vault
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: pubkey
        required: true
        schema:
          example: thorpub1addwnpepq068dr0x7ue973drmq4eqmzhcq3650n7nx5fhgn9gl207luxp6vaklu52tc
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'
          description: OK
      tags:
      - Vaults
  /thorchain/vaults/pubkeys:
    get:
      description: Returns all pubkeys for current vaults.
      operationId: vaultPubkeys
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultPubkeysResponse'
          description: OK
      tags:
      - Vaults
  /thorchain/network:
    get:
      description: Returns network overview statistics.
      operationId: network
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
          description: OK
      tags:
      - Network
  /thorchain/pol:
    get:
      description: Returns protocol owned liquidity overview statistics.
      operationId: pol
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POLResponse'
          description: OK
      tags:
      - POL
  /thorchain/inbound_addresses:
    get:
      description: Returns the set of asgard addresses that should be used for inbound
        transactions.
      operationId: inboundAddresses
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAddressesResponse'
          description: OK
      tags:
      - Network
  /thorchain/lastblock:
    get:
      description: Returns the last block information for all chains.
      operationId: lastblock
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastBlockResponse'
          description: OK
      tags:
      - Network
  /thorchain/lastblock/{chain}:
    get:
      description: Returns the last block information for the provided chain.
      operationId: lastblockChain
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: chain
        required: true
        schema:
          example: BTC
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastBlockResponse'
          description: OK
      tags:
      - Network
  /thorchain/version:
    get:
      description: "Returns the network's current THORNode version, the network's\
        \ next THORNode version, and the querier's THORNode version."
      operationId: version
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
          description: OK
      tags:
      - Network
  /thorchain/constants:
    get:
      description: "Returns constant configuration, can be overridden by mimir."
      operationId: constants
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstantsResponse'
          description: OK
      tags:
      - Network
  /thorchain/ragnarok:
    get:
      description: Returns a boolean indicating whether the chain is in ragnarok.
      operationId: ragnarok
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                example: false
                type: boolean
          description: OK
      tags:
      - Network
  /thorchain/ban/{address}:
    get:
      description: Returns the ban status for the provided node address.
      operationId: ban
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: address
        required: true
        schema:
          example: thor1zupk5lmc84r2dh738a9g3zscavannjy3nzplwt
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanResponse'
          description: OK
      tags:
      - Network
  /thorchain/queue:
    get:
      description: Returns queue statistics.
      operationId: queue
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
          description: OK
      tags:
      - Queue
  /thorchain/queue/scheduled:
    get:
      description: Returns the scheduled queue.
      operationId: queueScheduled
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledResponse'
          description: OK
      tags:
      - Queue
  /thorchain/queue/outbound:
    get:
      description: Returns the outbound queue including estimated RUNE values.
      operationId: queueOutbound
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundResponse'
          description: OK
      tags:
      - Queue
  /thorchain/keysign/{height}:
    get:
      description: Returns keysign information for the provided height - the height
        being the first block a tx out item appears in the signed-but-unobserved outbound
        queue.
      operationId: keysign
      parameters:
      - explode: false
        in: path
        name: height
        required: true
        schema:
          format: int64
          minimum: 0
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeysignResponse'
          description: OK
      tags:
      - TSS
  /thorchain/keysign/{height}/{pubkey}:
    get:
      description: Returns keysign information for the provided height and pubkey
        - the height being the block at which a tx out item is scheduled to be signed
        and moved from the scheduled outbound queue to the outbound queue.
      operationId: keysignPubkey
      parameters:
      - explode: false
        in: path
        name: height
        required: true
        schema:
          format: int64
          minimum: 0
          type: integer
        style: simple
      - explode: false
        in: path
        name: pubkey
        required: true
        schema:
          example: thorpub1addwnpepq068dr0x7ue973drmq4eqmzhcq3650n7nx5fhgn9gl207luxp6vaklu52tc
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeysignResponse'
          description: OK
      tags:
      - TSS
  /thorchain/metrics:
    get:
      description: Returns keygen and keysign metrics for current vaults.
      operationId: metrics
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: OK
      tags:
      - TSS
  /thorchain/metric/keygen/{pubkey}:
    get:
      description: Returns keygen metrics for the provided vault pubkey.
      operationId: metricsKeygen
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: pubkey
        required: true
        schema:
          example: thorpub1addwnpepq068dr0x7ue973drmq4eqmzhcq3650n7nx5fhgn9gl207luxp6vaklu52tc
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeygenMetricsResponse'
          description: OK
      tags:
      - TSS
  /thorchain/thorname/{name}:
    get:
      description: Returns addresses registered to the provided thorname.
      operationId: thorname
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - description: the thornode to lookup
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThornameResponse'
          description: OK
      tags:
      - Thornames
  /thorchain/mimir:
    get:
      description: Returns current active mimir configuration.
      operationId: mimir
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MimirResponse'
          description: OK
      tags:
      - Mimir
  /thorchain/mimir/key/{key}:
    get:
      description: Returns current active mimir configuration for the provided key.
      operationId: mimirKey
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - description: the mimir key to lookup
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int64
                type: integer
          description: OK
      tags:
      - Mimir
  /thorchain/mimir/admin:
    get:
      description: Returns current admin mimir configuration.
      operationId: mimirAdmin
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MimirResponse'
          description: OK
      tags:
      - Mimir
  /thorchain/mimir/nodes_all:
    get:
      description: Returns current node mimir votes.
      operationId: mimirNodes
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MimirNodesResponse'
          description: OK
      tags:
      - Mimir
  /thorchain/mimir/node/{address}:
    get:
      description: Returns current node mimir configuration for the provided node
        address.
      operationId: mimirNode
      parameters:
      - description: "optional block height, defaults to current tip"
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: false
        in: path
        name: address
        required: true
        schema:
          example: thor1zupk5lmc84r2dh738a9g3zscavannjy3nzplwt
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MimirResponse'
          description: OK
      tags:
      - Mimir
components:
  parameters:
    queryHeight:
      description: "optional block height, defaults to current tip"
      explode: true
      in: query
      name: height
      required: false
      schema:
        format: int64
        minimum: 0
        type: integer
      style: form
    pathHeight:
      explode: false
      in: path
      name: height
      required: true
      schema:
        format: int64
        minimum: 0
        type: integer
      style: simple
    hash:
      explode: false
      in: path
      name: hash
      required: true
      schema:
        example: CF524818D42B63D25BBA0CCC4909F127CAA645C0F9CD07324F2824CC151A64C7
        type: string
      style: simple
    asset:
      explode: false
      in: path
      name: asset
      required: true
      schema:
        example: BTC.BTC
        type: string
      style: simple
    address:
      explode: false
      in: path
      name: address
      required: true
      schema:
        example: thor1zupk5lmc84r2dh738a9g3zscavannjy3nzplwt
        type: string
      style: simple
    pubkey:
      explode: false
      in: path
      name: pubkey
      required: true
      schema:
        example: thorpub1addwnpepq068dr0x7ue973drmq4eqmzhcq3650n7nx5fhgn9gl207luxp6vaklu52tc
