[package]
name = "zec"
version = "0.1.0"
edition = "2021"

[lib]
name = "zec"
crate-type = [
  "cdylib",
  "staticlib",
  "rlib",
] # rlib needed for examples and tests

[dependencies]
# UniFFI dependencies for Go bindings (optional)
uniffi = { version = "0.25", features = ["build"], optional = true }

# NAPI dependencies for Node.js bindings (optional)
napi = { version = "2.16.0", features = ["napi8"], optional = true }
napi-derive = { version = "2.16.0", optional = true }

tracing = "0.1.41"
tracing-attributes = "0.1.28"
tracing-subscriber = { version = "0.3.19", features = [
  "fmt",
  "env-filter",
  "time",
] }

anyhow = "1.0.94"
thiserror = "1.0"                                                                # For defining custom errors
hex = "0.4"                                                                      # If you need hex encoding/decoding
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
reqwest = { version = "0.11", features = ["json", "blocking"], optional = true }
once_cell = "1.21.3"
bincode = "1.3.3"
bitflags = "2.5.0"
incrementalmerkletree = "0.8.2"


blake2b_simd = "1.0.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }    # For OsRng
secp256k1 = { version = "0.29.0", features = ["recovery"] }
rand_chacha = "0.3.1"
bip32 = { version = "=0.6.0-pre.1", default-features = false }
bip0039 = { version = "0.12" }
subtle = { version = "2.2.3", default-features = false }
sha2 = "0.10"
ripemd = "0.1"


zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d", features = [
  "test-dependencies",
  "transparent-inputs",
  "sapling",
  "orchard",
] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d", features = [
  "local-consensus",
] }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d", features = [
  "transparent-inputs",
] }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d", features = [
  "transparent-inputs",
] }
zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d", features = [
  "download-params",
], optional = true }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d", features = [
  "transparent-inputs",
] }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "b26c998cebc423d4a29f5202883b33e0eef3de4d" }
zcash_note_encryption = "0.4"
uniffi_bindgen = "0.29.4"

sapling = { package = "sapling-crypto", version = "0.5", default-features = false, features = [
  "circuit",
], optional = true }
orchard = { version = "0.11", default-features = false, features = [
  "circuit",
], optional = true }
jubjub = "0.10"

# We only need Sapling types for address validation, not for transaction building
# No need for prover components

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(zcash_unstable, values("zfuture"))',
] }

[features]
default = []
uniffi = ["dep:uniffi"]
napi = ["dep:napi", "dep:napi-derive"]
# Shielded functionality (Sapling/Orchard send/decrypt/witness)
shielded = ["dep:orchard", "dep:sapling", "dep:zcash_proofs"]
# E2E integration helpers (HTTP client, regtest integration)
# e2e implies shielded so E2E always has shielded code available
e2e = ["shielded", "dep:reqwest"]

[build-dependencies]
uniffi = { version = "0.25", features = ["build"] } # For build.rs

[[example]]
name = "regtest_example"
path = "examples/regtest_example.rs"
required-features = []
