image: golang:1.26.4

# Retry jobs that failed for infrastructure reasons, never on script_failure.
# Server-side execution timeouts are left out: those jobs really ran too long.
# Exit code 75 (EX_TEMPFAIL) is how our own scripts flag an infrastructure
# failure the runner cannot classify, e.g. the dind service never came up.
# A job-level `retry:` replaces this entirely, so jobs that set their own must
# repeat these reasons.
default:
  # Auto-cancel leaves a pipeline alone once any non-interruptible job has
  # started, so without this a superseded MR pipeline always ran to the end.
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
    exit_codes:
      - 75

# MR pipelines: a newer push cancels the superseded pipeline, and the first
# failed job cancels the rest of its pipeline. Retries and allow_failure jobs
# don't count as failed for this. Tag and protected-branch pipelines publish
# images and docs, so they always run to completion.
workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
      auto_cancel: &no_auto_cancel
        on_new_commit: none
        on_job_failure: none
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      auto_cancel: *no_auto_cancel
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  GOMODCACHE: /go-mod-cache
  GOCACHE: /go-build-cache
  # tss-lib-private is a private GitLab subgroup repo; skip proxy.golang.org / sumdb
  # and resolve directly so the per-job git auth below takes effect.
  GOPRIVATE: gitlab.com/thorchain/tss/tss-lib-private.git
  # Alpine's go package defaults GOTOOLCHAIN=local; override so jobs that bootstrap
  # Go via `apk add go` download the toolchain pinned in go.mod (toolchain go1.26.4).
  GOTOOLCHAIN: auto
  SAST_EXCLUDED_ANALYZERS: eslint,bandit,semgrep
  # Let the runner retry the stages it owns. A failed source fetch ("fetch-pack:
  # unexpected disconnect", "GitLab is currently unable to handle this request
  # due to load") is reported as script_failure, so `retry:` cannot catch it.
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  EXECUTOR_JOB_SECTION_ATTEMPTS: 3
  # Shallow clone. The project default is a full clone (941MB of history), which
  # averaged 78s per job, about 14% of all runner time on 2026-09-22..29. Only
  # lint and fork need history (a merge base with the target branch) and set
  # GIT_DEPTH 0 themselves; secret_detection sets its own 50 in the template.
  GIT_DEPTH: "20"
  SAST_EXCLUDED_PATHS: spec, test, tests, tmp, .cache

.use_dind: &use_dind
  image: docker:28.5.2
  services:
    - docker:28.5.2-dind

# Wait for the dind service before the first docker command. If it never
# answers ("dial tcp ...:2376: connect: no route to host"), exit 75 so the
# default retry picks the job up instead of failing it as a script error.
# https://gitlab.com/gitlab-org/gitlab-runner/-/issues/27384#note_497228752
.wait-for-dind:
  before_script:
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -ge 60 ]; then
          echo "dind service at $DOCKER_HOST did not answer within 60s"
          docker info || true
          exit 75
        fi
        echo "Waiting for docker to start"
        sleep 1
      done

# Registry setup for dind jobs, after .wait-for-dind:
# - Log in to Docker Hub for the higher pull rate limit. The login is only a
#   rate-limit courtesy, so after 3 attempts carry on anonymously rather than
#   fail (2026-09-14..28: 19 jobs died on this login alone).
# - Export DOCKER_MIRROR, the group dependency proxy prefix, for docker builds
#   and in-dind pulls. It stays unset when the pipeline user cannot use the
#   proxy (users outside the thorchain group get "manifest unknown" and fall
#   back to Docker Hub), so never use it for job or service images.
.dind-registries:
  before_script:
    - |
      for i in 1 2 3; do
        echo "$DOCKER_HUB_PASSWD" | docker login -u thornode --password-stdin && break
        if [ "$i" = 3 ]; then
          echo "Docker Hub login failed 3 times; continuing with anonymous pulls"
        else
          sleep 10
        fi
      done
    - |
      if [ -n "$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" ]; then
        export DOCKER_MIRROR="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"
        if ! echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin; then
          echo "Dependency proxy login failed; falling back to Docker Hub"
          unset DOCKER_MIRROR
        elif ! docker manifest inspect "${DOCKER_MIRROR}golang:1.26.4" >/dev/null 2>&1; then
          echo "Dependency proxy missing golang:1.26.4; falling back to Docker Hub"
          unset DOCKER_MIRROR
        fi
      fi

# Pull proto-builder from this project's registry, where mirror-ci-images
# copies it on protected branches, instead of ghcr.io (2026-09-14..28: 55 proto
# job failures on ghcr.io token and manifest timeouts). Falls back to ghcr.io
# when the mirror lacks the version the Makefile pins, e.g. in the MR that
# bumps protoVer. Any Developer's CI_JOB_TOKEN can push to this registry, so
# the image is always pulled by the Makefile's protoDigest, never by tag alone.
.proto-builder-image:
  before_script:
    - |
      PROTO_VER=$(sed -n 's/^protoVer=//p' Makefile)
      PROTO_DIGEST=$(sed -n 's/^protoDigest=//p' Makefile)
      PROTO_MIRROR="$CI_REGISTRY_IMAGE/ci/proto-builder"
      if docker pull -q "$PROTO_MIRROR:$PROTO_VER@$PROTO_DIGEST" >/dev/null 2>&1; then
        export PROTO_BUILDER_REPO="$PROTO_MIRROR"
      else
        echo "$PROTO_MIRROR:$PROTO_VER@$PROTO_DIGEST unavailable; pulling proto-builder from ghcr.io"
      fi

# buf.build's edge answers the Finland runner's egress IP with HTTP 403, so the
# BUF_PROXY CI/CD variable routes buf through a proxy (see the Makefile). That
# proxy only works from Finland: from any other runner it refuses the
# connection and buf fails with "the server hosted at that remote is
# unavailable". Keep BUF_PROXY only when this runner cannot reach api.buf.build
# itself (HTTP 403 or no answer). Any other status, including the 404 its root
# returns, means direct access works. Needs wget and sed (busybox has both).
# wget exits non-zero on every outcome that matters here (403, 404, no
# answer), and job scripts run with errexit and pipefail, so its status is
# discarded and only the HTTP status line it printed is used.
.buf-egress:
  before_script:
    - |
      if [ -n "${BUF_PROXY:-}" ]; then
        BUF_STATUS=$( { wget -q -S -T 10 -O /dev/null https://api.buf.build/ 2>&1 || true; } | sed -n 's/^ *HTTP\/[0-9.]* \([0-9]*\).*/\1/p' | tail -1)
        if [ -n "$BUF_STATUS" ] && [ "$BUF_STATUS" != 403 ]; then
          echo "api.buf.build reachable directly (HTTP $BUF_STATUS); not using BUF_PROXY"
          unset BUF_PROXY
        else
          echo "api.buf.build blocked or unreachable directly (${BUF_STATUS:-no response}); using BUF_PROXY"
        fi
      fi

# Authenticate git to gitlab.com so `go mod download` can fetch the private
# module tss-lib-private, and export GO_PRIVATE_GIT_CREDENTIAL for docker
# builds. Prefers the TSS_LIB_PRIVATE_READ_TOKEN CI/CD variable over
# CI_JOB_TOKEN, which only works when the pipeline user can read tss-lib-private.
# Include with `!reference [.go-private-auth, before_script]` in any job that
# resolves Go modules; jobs that build in dind also set
# GO_PRIVATE_AUTH_REQUIRED=1 to fail fast when no credential works. Needs git.
.go-private-auth:
  before_script:
    - . ./scripts/ci-go-private-auth.sh

# What test-simulation and test-regression wait for. On 2026-09-15..29 these
# jobs caught most pipelines that failed a check before the sim (generate 39,
# proto 37, unit-tests 14), and they finish in about 10 min. lint is left out
# although it caught 40: resource_group trunk-lint serializes it across every
# pipeline, and on 2026-09-29 it started 52-126 min in, which held the sim back
# by the same amount. `optional` covers pipelines where rules leave a job out
# (unit-tests on some merge trains). No artifacts are needed from them.
.long-test-gate:
  needs:
    - job: generate
      optional: true
      artifacts: false
    - job: proto-check-formatting
      optional: true
      artifacts: false
    - job: proto-lint
      optional: true
      artifacts: false
    - job: proto-check-breaking
      optional: true
      artifacts: false
    - job: unit-tests
      optional: true
      artifacts: false

# Install $PKGS from the distro mirror. A DNS blip on the runner ("Temporary
# failure resolving 'deb.debian.org'") only warns in `apt-get update` and then
# fails the install as a script error, so retry and exit 75 if the mirror stays
# unreachable. Include with `!reference [.pkg-install, before_script]`.
.pkg-install:
  before_script:
    - |
      for i in 1 2 3; do
        if command -v apk >/dev/null; then
          apk add --no-cache $PKGS && break
        else
          apt-get update && apt-get install -y --no-install-recommends $PKGS && break
        fi
        if [ "$i" = 3 ]; then
          echo "package mirror unreachable, treating as an infrastructure failure"
          exit 75
        fi
        sleep 15
      done

# Jobs start from `needs:`, not from stage order. With stage order the
# simulation started a median 27 min after the pipeline (p90 117 min), held back
# by whichever protobuf or test job finished last. Checks that need nothing
# start at once. test-simulation and test-regression wait only for the checks
# that catch most bad branches (.long-test-gate), so a branch that fails those
# does not also spend runner time on a sim. The build jobs keep stage order, so
# images are only pushed after every check passed.
stages:
  - .pre
  - fork
  - protobuf
  - test
  - build
  - long-test

# Fork MR validation job
# This job runs for all fork MRs and implements two main functions:
# 1. Skip CI validation if only documentation/config text files are changed
# 2. Validate that non-text changes have successful CI in the source project
#
# This consolidates the logic that was previously split between text_files_check
# and fork jobs, fixing a timing issue where GitLab CI rule evaluation happened
# before dotenv artifacts were available.
fork:
  stage: fork
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: always
  variables:
    PKGS: git jq
    GIT_DEPTH: "0"
  before_script:
    - !reference [.pkg-install, before_script]
  script:
    - |
      # First, check if only text files are changed in this fork MR
      echo "Checking if only text files are changed..."

      # Fetch the target branch to compare
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

      # Get list of changed files in the merge request
      CHANGED_FILES=$(git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD)
      echo "Changed files:"
      echo "$CHANGED_FILES"

      # Check if all changed files are text files (md, json, yaml, yml)
      # Exclude specific files that are not considered text-only changes
      EXCLUDED_FILES=".gitlab-ci.yml .trunk/trunk.yaml .trunk/configs/analyzers.yml .trunk/configs/.golangci.yaml .trunk/configs/.markdownlint.yaml .trunk/configs/.yamllint.yaml build/docker/docker-compose.yml config/default.yaml openapi/openapi.yaml"
      TEXT_ONLY=true
      if [ -n "$CHANGED_FILES" ]; then
        for file in $CHANGED_FILES; do
          if echo "$EXCLUDED_FILES" | grep -q "$file" || ! echo "$file" | grep -q '\.\(md\|json\|yaml\|yml\)$'; then
            echo "Non-text file found: $file"
            TEXT_ONLY=false
            break
          fi
        done
      else
        # No files changed, consider it as non-text
        TEXT_ONLY=false
      fi

      echo "Detected text files only: $TEXT_ONLY"

      # If only text files are changed, skip the fork validation
      if [ "$TEXT_ONLY" = "true" ]; then
        echo "Only text files detected in fork MR. Skipping fork validation."
        echo "Fork MR with text-only changes is allowed to proceed without CI validation."
        exit 0
      fi

      # Continue with fork validation for non-text changes
      echo "Non-text files detected. Proceeding with fork validation..."
      echo Project ID: $CI_PROJECT_ID
      echo Merge project ID: $CI_MERGE_REQUEST_PROJECT_ID
      COMMIT_SHA=${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}
      echo Commit SHA: $COMMIT_SHA
      if ! curl https://gitlab.com/api/v4/projects/$CI_MERGE_REQUEST_PROJECT_ID/pipelines?sha=$COMMIT_SHA | tee /dev/stderr | jq -e '.[]|select(.status=="success")'; then
        echo
        echo
        echo '1. Ensure the following passes locally: `make generate lint test test-regression test-simulation`'
        echo '2. Have a contributor run `make gitlab-trigger-ci`.'
        echo '3. Re-run this job.'
        exit 1
      fi

generate:
  rules: &rules
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI == "true"
      when: on_success
  # buf resolves BSR deps at job runtime and intermittently 403s under rate
  # limiting; without this a transient window blocks the whole pipeline, and
  # merge-train jobs cannot be retried by hand.
  retry: &buf_retry
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
      - script_failure
  stage: protobuf
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add bash curl findutils git go jq make protoc sed wget python3
    - !reference [.go-private-auth, before_script]
    - !reference [.dind-registries, before_script]
    - !reference [.proto-builder-image, before_script]
    - !reference [.buf-egress, before_script]
  script:
    - |
      export PATH="$PATH:/root/go/bin"
      make generate
      ./scripts/lint-generated.bash

unit-tests:
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  stage: test
  needs: []
  coverage: /total:\s+\(statements\)\s+(\d+.\d+\%)/
  before_script:
    - !reference [.go-private-auth, before_script]
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
    - go install gotest.tools/gotestsum@v1.13.0
  script:
    - make test-coverage-sum
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage*

test-mocknet-scripts:
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  stage: test
  needs: []
  image: alpine:3.21
  variables:
    PKGS: bash python3 jq
  before_script:
    - !reference [.pkg-install, before_script]
  script:
    - python3 -m unittest discover -s build/scripts/tests -v

xmr-e2e-gates:
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  stage: test
  needs: []
  before_script:
    - !reference [.go-private-auth, before_script]
  script:
    - make test-xmr-e2e

lint:
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI_COMMIT_BRANCH == "stagenet"
      when: never
    - if: $CI_COMMIT_BRANCH == "chainnet"
      when: never
    - if: $CI_COMMIT_BRANCH == "mainnet"
      when: never
    - if: $CI == "true"
      when: on_success
  stage: test
  needs: []
  # limit to 1 concurrent execution as shared trunk cache can cause internal error
  resource_group: trunk-lint
  variables:
    XDG_CACHE_HOME: /trunk-cache
    PKGS: jq
    # trunk-ci.sh diffs against the merge base with origin/develop
    GIT_DEPTH: "0"
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
  script:
    - make lint-ci

proto-check-formatting:
  rules: *rules
  stage: protobuf
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add findutils make
    - !reference [.proto-builder-image, before_script]
  script:
    - make proto-format-check

proto-lint:
  rules: *rules
  retry: *buf_retry
  stage: protobuf
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add make
    - !reference [.proto-builder-image, before_script]
    - !reference [.buf-egress, before_script]
  script:
    - make proto-lint

proto-check-breaking:
  # Compares this branch's protos against upstream `develop` via `buf breaking`.
  # The long-lived deployment branches (mainnet/stagenet/chainnet) intentionally
  # lag develop's schema and will report upstream-only additions as "deletions".
  # On those branches the result is informational, not gating; on MRs and
  # develop itself the check must block.
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(mainnet|stagenet|chainnet)$/
      when: on_success
      allow_failure: true
    - if: $CI == "true"
      when: on_success
  retry: *buf_retry
  stage: protobuf
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add git make
    - !reference [.proto-builder-image, before_script]
    - !reference [.buf-egress, before_script]
  script:
    - make proto-check-breaking

build-thornode:
  rules: &build-thornode-rules
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "stagenet"
      when: always
    - if: $CI_COMMIT_BRANCH == "chainnet"
      when: always
    - if: $CI_COMMIT_BRANCH == "mainnet"
      when: always
  stage: build
  <<: *use_dind
  variables:
    GO_PRIVATE_AUTH_REQUIRED: "1"
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add make git jq curl protoc
    - !reference [.go-private-auth, before_script]
    - !reference [.dind-registries, before_script]
    - make docker-gitlab-login
  script:
    - make docker-gitlab-build
    - make docker-gitlab-push
    # also push mocknet from develop
    - |
      if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        BUILDTAG=mocknet BRANCH=mocknet make docker-gitlab-build
        BUILDTAG=mocknet BRANCH=mocknet make docker-gitlab-push
      fi

chain-evm:
  rules:
    - changes:
        paths:
          - chain/evm/**/*
  stage: test
  needs: []
  image: node:18
  script:
    - cd chain/evm/
    - yarn install --non-interactive
    - yarn hardhat test

go-tss:
  rules:
    # Keeps honest fork MRs from running with tss-lib-private credentials. It is
    # not a security boundary: a fork MR pipeline a maintainer runs in this
    # project uses the fork's .gitlab-ci.yml and receives every unprotected
    # project variable, so review the fork's diff before running it.
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - changes:
        paths:
          - bifrost/tss/go-tss/**/*
          # go-tss is excluded from unit-tests (TEST_PATHS), so a tss-lib bump in
          # go.mod would otherwise run no TSS tests at all.
          - go.mod
          - go.sum
  stage: test
  needs: []
  before_script:
    - !reference [.go-private-auth, before_script]
  script:
    - make test-go-tss

pages:
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
  stage: build
  image: rust:1.90.0
  artifacts:
    paths:
      - public
  script:
    - make docs-generate

# Copy third-party images the dind jobs pull into this project's registry,
# registry to registry with `docker buildx imagetools`, so no dind daemon is
# involved. Running on protected branches only is not a registry ACL: any
# Developer's CI_JOB_TOKEN can push here too. So the copy is taken by the
# pinned digest, consumers pull by that digest, and a tag that points anywhere
# else is re-pointed.
mirror-ci-images:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  stage: build
  needs: []
  # consumers fall back to the upstream registry, so a failed copy only
  # costs reliability until the next protected pipeline
  allow_failure: true
  image: docker:28.5.2
  variables:
    DOCKER_HOST: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  script:
    - mkdir -p ~/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > ~/.docker/config.json
    - |
      # mirror <source repo> <dest repo> <tag> <digest>
      mirror() {
        _have=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$2:$3" 2>/dev/null || true)
        if [ "$_have" = "$4" ]; then
          echo "$2:$3 already mirrored at $4"
          return
        fi
        [ -z "$_have" ] || echo "$2:$3 is $_have, not $4; re-pointing it"
        docker buildx imagetools create --tag "$2:$3" "$1:$3@$4"
      }
      PROTO_VER=$(sed -n 's/^protoVer=//p' Makefile)
      PROTO_DIGEST=$(sed -n 's/^protoDigest=//p' Makefile)
      mirror ghcr.io/cosmos/proto-builder "$CI_REGISTRY_IMAGE/ci/proto-builder" "$PROTO_VER" "$PROTO_DIGEST"

# Build the dind jobs' tools image (ci/Dockerfile.ci-tools) when a push to the
# default branch changes its Dockerfile, or on demand from a web pipeline on a
# protected branch. Only default-branch pushes publish automatically: promoting
# the same Dockerfile to stagenet or mainnet, and API pipelines (where
# rules:changes is always true), would otherwise re-run it into the
# existing-tag error. It refuses to overwrite an existing tag, so a change must
# bump CI_TOOLS_VERSION. Any Developer's CI_JOB_TOKEN can push to this
# registry, so jobs must reference the image by the digest this job prints,
# never by tag alone.
build-ci-tools-image:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - ci/Dockerfile.ci-tools
  stage: build
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - !reference [.dind-registries, before_script]
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      VERSION=$(sed -n 's/^ENV CI_TOOLS_VERSION=//p' ci/Dockerfile.ci-tools)
      IMAGE="$CI_REGISTRY_IMAGE/ci/tools:$VERSION"
      if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
        echo "$IMAGE already exists; bump CI_TOOLS_VERSION in ci/Dockerfile.ci-tools to publish a change."
        exit 1
      fi
      docker build --pull --build-arg DOCKER_MIRROR -t "$IMAGE" - <ci/Dockerfile.ci-tools
      docker run --rm --entrypoint sh "$IMAGE" -c \
        'docker compose version && docker buildx version && go version && make --version && git --version && jq --version && python3 --version && protoc --version && bash --version'
      docker push "$IMAGE"
      echo "Pin jobs to: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"

build-thorscan:
  rules: *build-thornode-rules
  stage: build
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
  script:
    - apk -U add make
    - make thorscan-build
    - make thorscan-gitlab-push

build-events:
  rules: *build-thornode-rules
  stage: build
  <<: *use_dind
  variables:
    GO_PRIVATE_AUTH_REQUIRED: "1"
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add git make
    - !reference [.go-private-auth, before_script]
  script:
    - make events-build
    - make events-gitlab-push

test-simulation:
  # Run the cluster sim in parallel by default. Override per-pipeline with a
  # PARALLELISM CI variable; capped at 12 by the sim's user-mnemonic count.
  variables:
    DOCKER_BUILDKIT: "1"
    PARALLELISM: "4"
    GO_PRIVATE_AUTH_REQUIRED: "1"
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  timeout: 2h
  needs: !reference [.long-test-gate, needs]
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
      - script_failure
  stage: long-test
  <<: *use_dind
  artifacts:
    when: on_failure
    name: $CI_JOB_NAME-$CI_COMMIT_REF_NAME
    paths:
      - ./logs/
  environment:
    name: integration
  # docker compose is the plugin shipped in the docker image, not a download.
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add git make protoc bash go jq python3
    - !reference [.go-private-auth, before_script]
    - !reference [.dind-registries, before_script]
  script:
    - make test-simulation-cluster
  # Diagnostics for the on_failure artifacts. On a passing run nothing keeps
  # them, and the event replay and log dump took up to 3.6 min.
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        echo "test-simulation passed; skipping failure diagnostics"
        exit 0
      fi
    - make test-simulation-events || true
    - mkdir -p logs/xmr-debug
    - docker ps -a >./logs/ps.log 2>&1
    - |
      for name in $(docker ps --format '{{.Names}}'); do
        docker logs "$name" >"./logs/$name.log" 2>&1
      done
    - docker inspect docker-xmr-sim-helper-1 > logs/xmr-debug/xmr-sim-helper.inspect.json 2>&1 || true
    - docker image inspect "$(docker inspect -f '{{.Image}}' docker-xmr-sim-helper-1)" > logs/xmr-debug/xmr-sim-helper.image.json 2>&1 || true
    - |
      docker run --rm --network docker_default curlimages/curl:8.11.1 -sv \
        -H 'Authorization: Bearer xmr-sim-helper-mocknet-token' \
        http://xmr-sim-helper:8284/ \
        > logs/xmr-debug/root.txt 2>&1 || true
    - |
      docker run --rm --network docker_default curlimages/curl:8.11.1 -sv \
        -X POST http://xmr-sim-helper:8284/v1/monero/sim/balance \
        -H 'Authorization: Bearer xmr-sim-helper-mocknet-token' \
        -H 'Content-Type: application/json' \
        -d '{"spend_key_hex":"00"}' \
        > logs/xmr-debug/sim-balance.txt 2>&1 || true

unit-tests-race-bifrost:
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  # long-test, not test: the race detector makes this a ~35m job, and running it
  # alongside unit-tests and lint on the shared runner starved both of CPU --
  # unit-tests failed on localhost "context deadline exceeded" and lint hit its
  # 1h timeout at 3x its usual runtime. It still waits for unit-tests, which now
  # starts with the pipeline instead of after the protobuf stage.
  stage: long-test
  needs:
    - job: unit-tests
      optional: true
      artifacts: false
  timeout: 1h
  before_script:
    - !reference [.go-private-auth, before_script]
  script:
    - make test-race-bifrost

test-regression:
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
      - script_failure
  stage: long-test
  needs: !reference [.long-test-gate, needs]
  <<: *use_dind
  environment:
    name: integration
  variables:
    DOCKER_BUILDKIT: "1"
    TIME_FACTOR: "2"
    PARALLELISM: "6"
    FAIL_FAST: "true"
    GO_PRIVATE_AUTH_REQUIRED: "1"
  before_script:
    - !reference [.wait-for-dind, before_script]
    - apk -U add make git bash
    - !reference [.go-private-auth, before_script]
    - !reference [.dind-registries, before_script]
  script:
    - make test-regression
    - |
      CHANGES=$(git status --porcelain test/regression/mnt/exports/ test/regression/mnt/blocks/)
      if [ -n "$CHANGES" ]; then
        echo "Detected uncommitted regression test exports or blocks:"
        echo "$CHANGES"
        echo "Please run 'make test-regression' locally and commit the changes."
        exit 1
      fi

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# NOTE: The following included jobs have internal rule definitions that need to be
# overwritten for them to trigger on merge requests. We overwrite all with the default
# workflow rule set.

secret_detection:
  stage: test
  needs: []
  rules: *rules

semgrep:
  stage: test
  needs: []
  rules: *rules
  image: semgrep/semgrep:1.140.0
  # --error makes findings fail the job; the previous `|| true` meant this check
  # could never fail. Rules live in-repo (semgrep/) so no network fetch is needed.
  script:
    # --no-git-ignore: target discovery must not depend on git working inside the
    # image, otherwise a git error scans 0 files and still exits 0.
    - semgrep scan --config semgrep/ --no-git-ignore --error --metrics=off --gitlab-sast --output gl-sast-report.json .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json

govulncheck:
  stage: test
  needs: []
  rules: *rules
  # Informational until the baseline is cleared: on 2026-09-14 it reported 32
  # reachable vulnerabilities across 18 modules. Remove allow_failure once the
  # job is green so new reachable vulns block the pipeline.
  allow_failure: true
  before_script:
    - !reference [.go-private-auth, before_script]
  script:
    # only reports vulnerable symbols actually reachable from this module's call graph
    - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags mocknet ./...
