trunk-cache-du:
  image: alpine:3.21
  variables:
    GIT_STRATEGY: none
  script:
    - echo "runner=$CI_RUNNER_DESCRIPTION id=$CI_RUNNER_ID"
    - df -h /trunk-cache || true
    - ls -la /trunk-cache || true
    - du -sh /trunk-cache/* /trunk-cache/.[!.]* 2>/dev/null || true
    - du -sh /trunk-cache/trunk/* 2>/dev/null | sort -h | tail -15 || true
    - for d in /trunk-cache/slot-*; do echo "== $d"; du -sh $d/* 2>/dev/null; done || true
    - find /trunk-cache/trunk -maxdepth 3 -type d 2>/dev/null | head -40 || true
    - du -sh /trunk-cache/trunk/tools/* 2>/dev/null | sort -h | tail -20 || true
    - echo files=$(find /trunk-cache/trunk -type f 2>/dev/null | wc -l)
